name: X refresh browser QA
on:
  push:
    branches: [main]
    paths:
      - 'src/x.js'
      - 'src/x-view.js'
      - 'style.css'
      - 'tests/x-audience-browser.mjs'
      - '.github/workflows/x-refresh-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: X independent refresh browser acceptance
        run: node tests/x-audience-browser.mjs
