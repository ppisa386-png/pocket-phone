name: Bundle weather photography
on:
  push:
    paths:
      - tools/build_weather_photos.py
      - .github/workflows/weather-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle-weather-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Fetch original-size photographs and encode four WebP images
        run: python tools/build_weather_photos.py
      - name: Commit bundled images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weather/day.webp assets/weather/dusk.webp assets/weather/night.webp assets/weather/rain.webp assets/weather/SOURCES.md
          if git diff --cached --quiet; then
            echo "Images already current"
          else
            git commit -m "assets(weather): bundle four licensed high-resolution WebP backgrounds"
            git push origin HEAD:main
          fi
