name: Window Weather Diary visual QA
on:
  push:
    branches: [main, work/weather-window-diary]
    paths:
      - 'src/weather-view.js'
      - 'src/weather-art.js'
      - 'src/weather.js'
      - 'src/ui.js'
      - 'src/config.js'
      - 'index.js'
      - 'style.css'
      - 'style-weather.css'
      - 'assets/weather/**'
      - 'tests/weather*.test.js'
      - 'tests/weather-browser.mjs'
      - 'tools/build_preview.mjs'
      - '.github/workflows/weather-visual-qa.yml'
  workflow_dispatch:
jobs:
  weather-regression-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete project regression
        run: npm test
      - name: Build offline preview with local weather assets
        run: npm run build:preview
      - name: Install Chromium runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Weather window browser acceptance
        run: node tests/weather-browser.mjs
      - name: Collect weather screenshots
        if: always()
        run: |
          mkdir -p qa-results-upload
          cp ../qa-results/weather-window-*.png qa-results-upload/ 2>/dev/null || true
      - name: Upload weather browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-weather-diary-browser-evidence
          path: qa-results-upload/weather-window-*.png
          if-no-files-found: warn
          retention-days: 30
