const RESIDENCE_RULE = '根据 user 人设及当前酒馆上下文里 user 长期居住、定居、工作学习和日常生活的环境，确定常住地区和当地通货。首次地区判断依据人设、可见剧情与近期正式摘要。明确的当前生活环境优先于过时设定。没有准确的国家或城市名称时，允许结合人物姓名、生活方式、学校与工作制度、社会文化及日常环境智能推断。例如人物普遍使用中国名字，整体生活环境也明显符合中国，即使没有写出中国或具体中国城市名，也可判断为中国；其他国家和地区同理。不能仅因为正文使用中文就判断为中国；明确的国外生活背景优先于姓名线索。旅游、出差或他人所在地不等于user常住地。返回residence:{region:两位地区代码,currency:当地三位货币代码,place:判断出的国家或地区或城市,inferred:是否基于环境推断}。place允许填写推断出的真实地区，可以只确定国家或地区，不必编造具体城市；place不能填语言名称。综合资料仍无法合理判断时返回residence:null，不按正文语言默认币种。';
function resolveResidence(value, persona, prose, { allowInference = false } = {}) {
    void persona; void prose; void allowInference; // Judgement inputs only; quotes are no longer verified.
    if (value == null) return null;
    const region=String(value.region||'').trim().toUpperCase(), currency=String(value.currency||'').trim().toUpperCase();
    if (!Object.hasOwn(territories,currency) || !region || !territories[currency].split(' ').includes(region))
        throw Error('常住地区与当地币种不匹配，本次未保存。');
    if (/^(?:中文|汉语|日语|英语|普通话|Chinese|Japanese|English)$/i.test(String(value.place||'').trim()))
        throw Error('place 不能是语言名称，请填写国家、地区或城市。');
    return {region,currency};
}
const walletCurrency = state => state.assets?.wallet ? state.assets.wallet.currency || 'USD' : null;
const validCurrency = code => Object.hasOwn(territories,code);
function currencyDigits(code) {
    return new Intl.NumberFormat('en',{style:'currency',currency:code}).resolvedOptions().maximumFractionDigits;
}
const unitScale = code => 10 ** currencyDigits(code);
const majorAmount = (minor,code) => minor/unitScale(code);
function formatMoney(minor,code) {
    if (!code) return '—';
    return new Intl.NumberFormat('zh-CN',{style:'currency',currencyDisplay:'narrowSymbol',currency:code}).format(majorAmount(minor,code));
}

// Only an invalidation marker, not another stored copy of the persona.
function personaStamp(persona='') {
    let hash=2166136261;
    for (let i=0;i<persona.length;i++) hash=Math.imul(hash^persona.charCodeAt(i),16777619);
    return (hash>>>0).toString(36);
}

// Read scene timestamps locally. No wall-clock fallback and no model calls.
function dateDay(value) {
    const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
    const d=new Date(0);d.setUTCFullYear(+m[1],+m[2]-1,+m[3]);d.setUTCHours(0,0,0,0);
    return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]?Math.floor(d.getTime()/86400000):null;
}
const dayDate = day => Number.isInteger(day)?new Date(day*86400000).toISOString().slice(0,10):'';
// SDC is explicit scene metadata, even when a preset wraps prose in a code
// fence. Read it before stripping presentation wrappers; never use wall time.
function lastSDC(source) {
    let result=null;
    for(const match of source.matchAll(/<!--\s*SDC-(?:start|end)\s*\|([\s\S]*?)-->/gi)) {
        const fields={};let duplicate=false;
        for(const part of match[1].split('|')) {
            const field=part.match(/^\s*(date|time)\s*=\s*(.*?)\s*$/i);
            if(!field)continue;
            const key=field[1].toLowerCase();if(key in fields)duplicate=true;fields[key]=field[2];
        }
        const date=fields.date?.match(/^(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?$/);
        const time=fields.time?.match(/^(\d{1,2}):(\d{2})$/);
        if(duplicate||!date||!time||+time[1]>23||+time[2]>59)continue;
        const day=dateDay(`${date[1]}-${date[2].padStart(2,'0')}-${date[3].padStart(2,'0')}`);
        if(day!==null)result={day,hour:+time[1]+time[2]/60};
    }
    return result;
}
function readStoryClock(chat, seed=null, { exact = false } = {}) {
    let day=seed?.day??null,hour=seed?.hour??null;
    for(const m of chat||[]){
        if(!m||m.role==='system'||m.isPhoneMessage||m.is_system&&!m.extra?.qianqianjieAutoHide)continue;
        const source=String(m.mes??m.content??'').replace(/<(script|style|think|thinking|analysis)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|$)/gi,'');
        const sdc=!m.is_user&&m.role!=='user'?lastSDC(source):null;
        if(sdc){day=sdc.day;hour=sdc.hour;continue;}
        const text=source.replace(/```[\s\S]*?```/g,'').replace(/<!--[\s\S]*?-->/g,'').replace(/<[^>]*>/g,'\n');
        const lines=text.split('\n').map(s=>s.replace(/^[\s*#|]+|[\s*|]+$/g,'')).filter(Boolean);
        for(const rawLine of lines){
            let line=rawLine.replace(/^[【\[]\s*/, '').replace(/\s*[】\]]$/, '');
            let t=line.match(/^(?:(?:当前|剧情|故事)?(?:日期|时间)|Date|Time|Scene time)?\s*[:：]?\s*(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?:\s|$|[T,，|])/i);
            // A scene status can summarize a time jump. Only accept an explicit
            // opening date range, never arbitrary later dates in narrative prose.
            if(t){
                const end=line.slice(t[0].length).match(/^(?:\d{1,2}[:：]\d{2}\s*(?:AM|PM)?\s*)?(?:(?:星期|周)[一二三四五六日天]\s*)?(?:至|到|→|～|~|—|to\b)\s*(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?=\s|$|[T,，|])/i);
                if(end){
                    const startDay=dateDay(`${t[1]}-${t[2].padStart(2,'0')}-${t[3].padStart(2,'0')}`);
                    const endDay=dateDay(`${end[1]}-${end[2].padStart(2,'0')}-${end[3].padStart(2,'0')}`);
                    if(startDay!==null&&endDay!==null&&endDay>=startDay){
                        line=`${end[1]}-${end[2].padStart(2,'0')}-${end[3].padStart(2,'0')} `+line.slice(t[0].length+end[0].length);
                        t=line.match(/^(\d{4})-(\d{2})-(\d{2})/);
                    }
                }
            }
            const md=!t&&day!==null?line.match(/^(?:(?:当前|剧情)?(?:日期|时间)|Date|Time)\s*[:：]\s*(\d{1,2})[-月/.](\d{1,2})日?/i):null;
            let next=null;
            if(t)next=dateDay(`${t[1]}-${t[2].padStart(2,'0')}-${t[3].padStart(2,'0')}`);
            if(md)next=dateDay(`${dayDate(day).slice(0,4)}-${md[1].padStart(2,'0')}-${md[2].padStart(2,'0')}`);
            if(next!==null){if(next!==day)hour=null;day=next;}
            // Only scene-opening relative transitions, never mentions in dialogue.
            const relative=line===lines[0]?line.match(/^(?:第二天|次日|翌日|隔天|the next day|the following morning)|^([一二两三四五六七八九十\d]+)天后|^(\d+) days? later/i):null;
            if(relative&&day!==null){const n=relative[1]||relative[2];const count=n?(/^\d+$/.test(n)?+n:{一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10}[n]):1;if(count){day+=count;hour=null;}}
            const sceneLine=!!t||!!md||!!relative||/^(?:(?:当前|剧情|故事)?时间|Time|Scene time)\s*[:：]/i.test(line);
            if(sceneLine){
                const tm=line.match(/(?:\b|[T\s：:])(\d{1,2})[:：](\d{2})(?:\s*(AM|PM))?/i);
                if(tm&&+tm[1]<24&&+tm[2]<60){let h=+tm[1];if(tm[3]){h=h%12+(/pm/i.test(tm[3])?12:0);}hour=h+(+tm[2]/60);}
                else if(exact && /凌晨|半夜|晚上|夜晚|夜间|下午|午后|中午|正午|上午|早上|清晨|黎明|midnight|night|evening|afternoon|noon|morning|dawn/i.test(line))hour=null;
                else if(/凌晨|半夜|midnight/i.test(line))hour=2;
                else if(/晚上|夜晚|夜间|night|evening/i.test(line))hour=21;
                else if(/下午|午后|afternoon/i.test(line))hour=15;
                else if(/中午|正午|noon/i.test(line))hour=12;
                else if(/上午|早上|morning/i.test(line))hour=10;
                else if(/清晨|黎明|dawn/i.test(line))hour=7;
            }
        }
    }
    return {day,hour};
}

// Exact clock for elapsed-time policies: fuzzy morning/evening is not a time.
function exactStoryTime(chat) {
    const {day,hour}=readStoryClock(chat,null,{exact:true});
    return {date:dayDate(day),time:hour==null?'':String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0'),precision:'exact'};
}

// Stored story anchors are distinct from createdAt (local ordering only).
function storyTime(chat) {
    const {day,hour}=readStoryClock(chat);
    return {date:dayDate(day), time:hour==null?'':String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0'), precision:'scene'};
}
const displayStoryTime = item => /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(item?.storyTime?.time||'') ? item.storyTime.time : '—';

function displayStoryDate(date) {
    const day = dateDay(date);
    if (day === null) return '';
    const weekday = new Date(day * 86400000).getUTCDay();
    return date + ' 星期' + '日一二三四五六'[weekday];
}

// Shared display-name rules. Original names stay as aliases for identity lookup.
const CHINESE_NAME_RULE = '\n手机姓名显示规则（所有 App 共用）：电话簿、短信联系人、好友、关注列表及账号显示姓名一律用中文。外文姓名优先采用人物设定/人设/世界书中已经使用的中译名，完整照用，不擅自换译名；没有中译名才按原姓名音译成中文。同一人只保留一个中文姓名，不能中英文各返回一个联系人，也不要在显示姓名中附英文括号。人物或地点联系人的 name 填中文显示名，aliases 数组保留原文姓名及设定已有别名，供识别同一人物。地点联系人的名称也用中文。商品名、品牌名不属于此规则。此规则只控制姓名标签，不改变短信、帖子、对白等内容所遵循的酒馆预设语言；handle/@账号、内部 id 和 user 自己设置的网名保持原值，不翻译或改写。';

const key = s => String(s || '').normalize('NFKC').trim().toLowerCase().replace(/[\s·.・'’_-]/g,'');
const han = s => /\p{Script=Han}/u.test(s || '');
const nameAliases = item => [...new Set([item?.name,...(Array.isArray(item?.aliases) ? item.aliases : [])].filter(n => typeof n === 'string' && n.trim()).map(n => n.trim().slice(0,100)))];
function sameNamedPerson(a,b) {
    const keys = nameAliases(a).map(key);
    return nameAliases(b).some(n => keys.includes(key(n)));
}
function localizedPerson(item, context, existing = []) {
    const aliases = nameAliases(item), probe = {aliases};
    const cards = (context.characters || []).map((c,index) => ({c,index})).filter(({c}) => sameNamedPerson(probe,c));
    const card = cards.length === 1 ? cards[0] : null;
    const old = [...new Map(existing.filter(c => sameNamedPerson(probe,c)).map(c => [c.id,c])).values()];
    const known = old.length === 1 ? old[0] : null;
    const material = [context.powerUserSettings?.persona_description,...(context.characters || []).flatMap(c => {
        const d = c.data || c;
        return [c.name,d.description,d.personality,d.scenario,...(d.character_book?.entries || []).filter(e => e.enabled !== false).map(e => e.content)];
    })].filter(Boolean).join('\n');
    const chinese = aliases.filter(han);
    let name = (han(card?.c.name) ? card.c.name : null) || chinese.find(n => material.includes(n)) || (han(known?.name) ? known.name : null) || chinese[0] || aliases[0] || '';
    const complete = [...chinese, ...nameAliases(known).filter(han)].find(n => n.startsWith(name + '·') && (n === known?.name || material.concat('\n',context.name1 || '').includes(n.slice(name.length + 1))));
    if (complete) name = complete;
    return {name,aliases:[...new Set([...aliases,...nameAliases(known),...(card ? [card.c.name] : []),name])],cardIndex:card?.index ?? null,cardId:card ? 'card:' + (card.c.avatar || card.c.name) : null,existingId:known?.id ?? null};
}

const DAILY_EDITORIAL_PROMPT = '本期报纸按事件优先编选，不先按栏目凑新闻。先依据剧情资料 date、currentLocation、locationKind 和报刊定位寻找新闻：现实地点从模型已有的历史知识中回忆截至剧情日期确实发生、当时值得该报刊报道的具体事件；同时考虑世界书中的公共事件、正文已经公开的进展和符合世界观的原创公共事件。架空地点只把本世界事件作为新闻事实，现实历史仅供创作参考。'

// Entering Soft Haze Enamel selects its included Frost Bloom launcher.

function clampPosition(position, viewport, size = LAUNCHER_SIZE) {
    const margin = 8;
    const maxX = Math.max(margin, viewport.width - size - margin);
    const maxY = Math.max(margin, viewport.height - size - margin);
    return {
        x: Math.min(maxX, Math.max(margin, position?.x ?? maxX)),
        y: Math.min(maxY, Math.max(margin, position?.y ?? Math.max(margin, maxY * 0.8))),
    };
}

// Desktop Enter and mobile soft-keyboard line breaks share the same local action.
function bindComposerKeys(root,{queue,onError=()=>{},signal}) {
    const selector='textarea[data-sms-draft],textarea[data-snap-field="message"],textarea[data-chat-field="message"]';
    const composing=new WeakSet(),finishing=new WeakSet();
    let pending=false;
    const composer=event=>event.target?.matches?.(selector)?event.target:null;
    function submit(event) {
        const input=composer(event);if(!input||input.disabled)return;
        if(event.isComposing||event.keyCode===229||composing.has(input)||finishing.has(input))return;
        event.preventDefault();
        if(pending||!input.value.trim())return;
        pending=true;
        Promise.resolve().then(()=>queue(input)).catch(onError).finally(()=>{pending=false;});
    }
    root.addEventListener('compositionstart',e=>{const input=composer(e);if(input)composing.add(input);},{signal});
    root.addEventListener('compositionend',e=>{const input=composer(e);if(input){composing.delete(input);finishing.add(input);setTimeout(()=>finishing.delete(input),0);}},{signal});
    root.addEventListener('keydown',e=>{if(e.key==='Enter')submit(e);},{signal});
    root.addEventListener('beforeinput',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType)&&e.cancelable)submit(e);},{signal});
    // Some mobile keyboards deliver only a non-cancelable input event.
    root.addEventListener('input',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType))submit(e);},{signal});
}

// Keep native editing inside the phone's scroll areas without scrolling the host chat.
function bindInputViewport({ shadow, phone, content, signal }) {
    const viewport = window.visualViewport;
    let frame = 0, normalHeight = viewport?.height || window.innerHeight;
    const editable = () => {
        const element = shadow.activeElement;
        return element && phone.contains(element) && !element.disabled && !element.readOnly &&
            (element.matches('textarea, [contenteditable="true"]') || element.matches('input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="button"]):not([type="submit"])')) ? element : null;
    };
    function reveal(element) {
        // Work from the innermost scroll container outwards, never the document.
        for (let parent = element.parentElement; parent && phone.contains(parent); parent = parent.parentElement) {
            if (parent.scrollHeight <= parent.clientHeight || !/auto|scroll/.test(getComputedStyle(parent).overflowY)) continue;
            const field = element.getBoundingClientRect(), box = parent.getBoundingClientRect();
            const top = box.top + 10, bottom = box.bottom - 10;
            // Long editors scroll internally; do not bounce between their two edges.
            if (field.height > bottom - top) {
                if (field.top > bottom - 40 || field.bottom < top + 40) parent.scrollTop += field.top - top;
            } else if (field.bottom > bottom) parent.scrollTop += field.bottom - bottom;
            else if (field.top < top) parent.scrollTop -= top - field.top;
        }
    }
    function update() {
        frame = 0;
        if (signal.aborted) return;
        const field = editable(), height = viewport?.height || window.innerHeight, top = viewport?.offsetTop || 0;
        if (!field) normalHeight = Math.max(height, window.innerHeight);
        const compact = !!field && ((normalHeight - height > 120) || (window.innerWidth <= 600 && height < 520));
        phone.dataset.editing = String(!!field);
        phone.dataset.keyboard = String(compact);
        phone.style.setProperty('--pp-visible-height', height + 'px');
        phone.style.setProperty('--pp-visible-top', top + 'px');
        if (field && !phone.hidden) reveal(field);
    }
    function schedule() {
        if (!frame && !signal.aborted) frame = requestAnimationFrame(update);
    }
    for (const name of ['focusin', 'focusout', 'input']) shadow.addEventListener(name, schedule, { signal });
    window.addEventListener('resize', schedule, { signal });
    viewport?.addEventListener('resize', schedule, { signal });
    viewport?.addEventListener('scroll', schedule, { signal });
    signal.addEventListener('abort', () => cancelAnimationFrame(frame), { once:true });
    return { update: schedule };
}

// Local, bounded error history. Never persist request bodies, responses or keys.
function createDiagnostics({storage, version = '', getSecrets = () => []} = {}) {
    if (storage === undefined) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const key = 'durian_phone_errors_v1';
    let entries = [];
    const clean = (value, secrets = []) => {
        let text = String(value ?? '');
        for (const secret of [...getSecrets(), ...secrets].filter(s=>typeof s==='string'&&s).sort((a,b)=>b.length-a.length)) text=text.split(secret).join('[已隐藏]');
        return text.replace(/\bBearer\s+[^\s"',;]+/gi,'Bearer [已隐藏]')
            .replace(/((?:api[_-]?key|proxy_password|authorization|access_token|密钥)["']?\s*[:=]\s*["']?)[^\s"',;}&]+/gi,'$1[已隐藏]')
            .replace(/\bsk-[a-zA-Z0-9_-]+/g,'[已隐藏]')
            .replace(/https?:\/\/[^\s<>"']+/g, url => { try { const u=new URL(url);u.username='';u.password='';u.search='';u.hash='';return u.toString(); } catch { return '[地址已隐藏]'; } })
            .slice(0,1500);
    };
    try {
        const saved=JSON.parse(storage?.getItem(key)||'[]');
        if(Array.isArray(saved))entries=saved.filter(e=>e&&typeof e.message==='string').slice(-100).map(e=>({time:clean(e.time),version:clean(e.version),source:clean(e.source),message:clean(e.message)}));
    } catch { /* A malformed log must never block the phone. */ }
    let persisted = true;
    function save() { try { if(!storage)throw Error();storage.setItem(key,JSON.stringify(entries));persisted=true; } catch { persisted=false; } }
    return {
        add(error, source = '运行', secrets = []) {
            const message=clean(error?.message ?? error ?? '未知错误',secrets)+(typeof error?.diagnostic==='string'?'\n'+clean(error.diagnostic,secrets):'');
            entries.push({time:new Date().toISOString(),version,source:clean(source,secrets),message});
            entries=entries.slice(-100);save();
        },
        list: () => structuredClone(entries).reverse(),
        persistent: () => persisted,
        clear() { entries=[];save(); },
        text() { return (entries.length ? '当前运行版本：榴莲手机 ' + version + '\n（以下每条版本为报错发生时的版本；更新插件后请刷新酒馆页面。）\n\n' : '') + entries.slice().reverse().map(e=>'['+e.time+'] 榴莲手机 '+e.version+' · '+e.source+'\n'+e.message).join('\n\n'); },
    };
}

// Independent OpenAI-compatible requests go through the existing ST backend.
// Never overwrite the host's connection settings or borrow its provider keys.
function normalizeApiUrl(value) {
    let url;
    try { url = new URL(String(value ?? '').trim()); } catch { throw new Error('请填写完整 API 地址，例如 https://example.com/v1'); }
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('API 地址仅支持 HTTP/HTTPS，不要在地址里填写密钥或查询参数。');
    url.pathname = url.pathname.replace(/\/(?:chat\/completions|models)\/?$/, '').replace(/\/+$/, '') || '/v1';
    return url.toString().replace(/\/$/, '');
}

function createKeyStore(storage) {
    if (arguments.length === 0) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const prefix = 'durian_phone_api_key:';
    return {
        get(url, profileId = '') { try { return storage?.getItem(prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url)) ?? ''; } catch { return ''; } },
        secrets() {
            try { return Array.from({length: storage?.length || 0}, (_, i) => storage.key(i)).filter(k => k?.startsWith(prefix)).map(k => storage.getItem(k)).filter(Boolean); } catch { return []; }
        },
        set(url, key, profileId = '') {
            if (!storage) throw new Error('当前浏览器不能保存密钥，请检查浏览器存储设置。');
            const name = prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url);
            try { key ? storage.setItem(name, key) : storage.removeItem(name); }
            catch { throw new Error('密钥保存失败，请检查浏览器存储空间或权限。'); }
        },
    };
}

    const raw = data?.error;

    const message = (typeof raw === 'string' ? raw : typeof nested.message === 'string' ? nested.message : typeof data?.message === 'string' ? data.message : '').slice(0, 4000).toLowerCase();
    const labels = { 'bad request':400, unauthorized:401, forbidden:403, 'not found':404, 'request timeout':408,

        'internal server error':500, 'bad gateway':502, 'service unavailable':503, 'gateway timeout':504 };

    const effective = reported || status;

    if (data?.quota_error === true || /insufficient_quota|quota_exceeded|resource_exhausted/.test(code)) { reason='额度不足';hint='请检查服务额度。'; }
    else if ([401,403].includes(effective) || /authentication|invalid_api_key/.test(code)) { reason='认证失败';hint='请检查这个地址对应的 API 密钥和访问权限。'; }
    else if (effective===429 || /rate_limit/.test(code)) { reason='请求过于频繁';hint='请稍后手动重试。'; }
    else if (effective===404 || /model_not_found/.test(code)) { reason='找不到接口或模型';hint='请检查 API 地址及模型 ID。'; }
    else if (effective===413 || /context_length|max_tokens|token_limit/.test(code) || /context length|context window|too many tokens/.test(message)) { reason='上下文或输出长度超限';hint='请核对模型长度限制与预设参数。'; }
    else if (effective===408 || effective===504 || /timeout|timed.?out/.test(code+' '+message)) { reason='上游等待超时';hint='请核对中转或执行器记录，再手动重试。'; }
    else if (effective===503 || /overloaded|server_busy|no available.*executor|executor.*offline/.test(code+' '+message)) { reason='服务繁忙或执行器不可用';hint='请检查服务或执行器状态，再手动重试。'; }
    else if (effective===502 || /econnrefused|econnreset|enotfound/.test(code+' '+message)) { reason='转发连接失败';hint='请检查中转服务或执行器的对应请求记录，再手动重试。'; }
    else if (effective===400 || effective===422 || /invalid_request|invalid_argument/.test(code)) { reason='请求被接口拒绝';hint='请核对服务支持的模型与预设参数；具体拒绝原因需查看酒馆服务端记录。'; }
    else if (effective>=500) { reason='服务内部错误';hint='请核对中转服务记录，再手动重试。'; }

    const error = failure(prefix+(reason==='未识别'?'':reason+'。')+hint, status===429 && data?.quota_error!==true);

        +'；错误结构：'+(raw===null?'null':Array.isArray(raw)?'array':typeof raw)
        +'；含错误说明：'+(message?'是':'否')+'；额度标记：'+(data?.quota_error===true?'是':'否');
    return error;
}

function extractApiText(data) {

    const choices = Array.isArray(data?.choices) ? data.choices : [];
    const choice = choices[0], message = choice?.message, content = message?.content;
    const shape = value => value === undefined ? '缺失' : value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
    const nonempty = value => typeof value === 'string' ? !!value.trim() : Array.isArray(value) && value.length > 0;
    const reasoning = nonempty(message?.reasoning_content) || nonempty(message?.reasoning) || nonempty(message?.reasoning_details);
    const tools = Array.isArray(message?.tool_calls) ? message.tool_calls.length : message?.function_call ? 1 : 0;
    const refusal = nonempty(message?.refusal);
    const finish = ['stop','length','content_filter','tool_calls','function_call'].includes(choice?.finish_reason) ? choice.finish_reason : choice?.finish_reason == null ? '未提供' : '其他';
    const textParts = Array.isArray(content) ? content.filter(p => p?.type === 'text' && typeof p.text === 'string') : [];
    const tokenCount = value => Number.isSafeInteger(value) && value >= 0 ? value : '未提供';
    const fail = (code, reason) => {
        const error = failure(reason);
        error.code = code;
        // Only known shapes/counts/enums: no response excerpts, reasoning or arbitrary field names.
        error.diagnostic = '错误代码：'+code+'；响应结构：'+shape(data)+'；choices：'+shape(data?.choices)+'；候选数：'+choices.length
            +'；message：'+shape(message)+'；content：'+shape(content)+'；文本片段数：'+textParts.length+'；旧式text：'+shape(choice?.text)
            +'；结束原因：'+finish+'；含推理内容：'+(reasoning?'是':'否')+'；工具调用数：'+tools+'；含拒答标记：'+(refusal?'是':'否')
            +'；含流式片段：'+(choice?.delta?'是':'否')+'；输出token用量：'+tokenCount(data?.usage?.completion_tokens)
            +'；推理token用量：'+tokenCount(data?.usage?.completion_tokens_details?.reasoning_tokens);
        throw error;
    };
    if (finish === 'length') fail('API_OUTPUT_TRUNCATED','接口标记模型输出被截断，本次未保存回复。');
    if (finish === 'content_filter' || refusal) fail('API_OUTPUT_FILTERED','接口返回内容过滤或拒答标记，本次未取得可用回复。');
    if (finish === 'tool_calls' || finish === 'function_call') fail('API_OUTPUT_TOOLS','接口返回了工具调用，未完成本次所需的文字回复。');
    // Support the legacy completion text used by compatible gateways, but never
    // treat reasoning, tool arguments or an unfinished streaming delta as a reply.
    let text = typeof content === 'string' ? content : textParts.map(p => p.text).join('');
    if (!text.trim() && content == null && !reasoning && !tools && typeof choice?.text === 'string') text = choice.text;
    if (!text.trim()) {
        if (!choices.length || !choice || typeof choice !== 'object') fail('API_RESPONSE_SHAPE','接口返回中没有有效的回复候选，无法读取文字；需核对返回格式。');
        if (reasoning) fail('API_REASONING_ONLY','模型没有返回文字：接口只提供了推理内容，没有最终回复。本次未保存。');
        if (tools) fail('API_OUTPUT_TOOLS','接口只提供了工具调用，没有最终文字回复。');
        if (choice.delta) fail('API_UNEXPECTED_DELTA','非流式请求收到了流式片段，无法确认完整回复；需核对中转返回格式。');
        if (content != null && typeof content !== 'string' && !(Array.isArray(content) && content.every(p => p?.type==='text' && typeof p.text==='string'))) {
            fail('API_CONTENT_SHAPE','接口返回了无法识别的内容格式，未读取到回复文字。');
        }
        fail('API_EMPTY_OUTPUT','接口返回的最终回复文字为空。本次未保存；空回复本身不能说明是 token 上限问题。');
    }
    return text.trim();
}

function createApiClient({ getContext, getSettings, getKey, prepareRequest, fetchImpl = globalThis.fetch }) {
    const active = new Set();
    let cancelEpoch = 0;
    let preparation = null;
    async function post(path, config, key, extra, isCurrent = () => true, onProgress = () => {}) {
        if (getSettings().enabled === false) throw failure('榴莲手机已停用，请先勾选「启用榴莲手机」。');
        const endpoint = normalizeApiUrl(config.baseUrl);
        const host = getContext();
        if (typeof host?.getRequestHeaders !== 'function') throw failure('当前酒馆缺少请求接口，请更新酒馆后使用独立 API。');
        if (/\r|\n/.test(key)) throw failure('密钥不能包含换行，请重新粘贴。');
        if (!isCurrent()) throw failure('本次操作已取消。');
        const controller = new AbortController(); active.add(controller);
        let timedOut = false;
        const started = Date.now();
        let stage = '提交酒馆转发接口，等待响应', status = null, bodyLength = 0;
        const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, config.timeout * 1000);
        const watcher = setInterval(() => { if (!isCurrent()) controller.abort(); }, 150);
        try {
            const body = JSON.stringify({ chat_completion_source: 'openai', reverse_proxy: endpoint, proxy_password: key, ...extra });
            bodyLength = body.length;
            onProgress(stage);
            const response = await fetchImpl('/api/backends/chat-completions/' + path, {
                method: 'POST', headers: host.getRequestHeaders(), credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
                body,
            });
            if (!isCurrent()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            status = Number.isInteger(response.status) ? response.status : null;
            stage = '酒馆接口已响应，正在读取返回内容';
            onProgress(stage);
            let data;
            try { data = await response.json(); } catch {
                if (!response.ok) throw apiError(response.status, null);
                throw failure('接口没有返回有效 JSON，请检查 API 地址和酒馆版本。');
            }
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (!response.ok || data?.error) throw apiError(response.status, data);
            if (path === 'generate') {
                stage = '正在读取模型回复文字';
                onProgress(stage);
                return extractApiText(data);
            }
            return data;
        } catch (error) {
            let result;
            if (timedOut) result = failure('等待酒馆转发结果超时（' + config.timeout + ' 秒），本次已停止等待，不会自动重发。请核对中转或执行器记录后手动重试。');
            else if (controller.signal.aborted || !isCurrent()) result = failure('本次操作已取消。');
            else if (error && typeof error === 'object' && 'retryable' in error) result = error;
            // Provider error bodies can echo credentials: never display them.
            else result = failure('未能完成酒馆转发请求，请检查酒馆服务端网络与服务地址；本次不会自动重发。');
            result.diagnostic = (result.diagnostic ? result.diagnostic + '\n' : '') + '请求环节：' + stage + '；等待耗时：' + Math.round((Date.now() - started) / 1000) + ' 秒；超时设置：' + config.timeout + ' 秒'
                + '；HTTP：' + (status ?? '尚未收到') + '；请求字符数：' + bodyLength
                + '；上下文消息数：' + (Array.isArray(extra.messages) ? extra.messages.length : 0)
                + '；回复上限：' + (extra.max_completion_tokens ?? extra.max_tokens ?? '由服务决定')
                + '\n此处记录的是浏览器与酒馆接口的往返，不能据此确认上游执行器已收到请求。';
            throw result;
        } finally { clearTimeout(timeout); clearInterval(watcher); active.delete(controller); }
    }
    async function complete(config, key, messages, isCurrent) {
        if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
        return post('generate', config, key, { model: config.model.trim(), messages, stream: false,
            max_tokens: config.maxTokens }, isCurrent);
    }
    return {
        async generate(prompt, contact, isCurrent, onProgress = () => {}, options = {}) {
            if (getSettings().enabled === false) throw failure('榴莲手机已停用，请先勾选「启用榴莲手机」。');
            const config = structuredClone(getSettings().api);
            normalizeApiUrl(config.baseUrl);
            if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
            const key = getKey(config.baseUrl);
            const fingerprint = JSON.stringify(config), epoch = cancelEpoch;
            const current = () => epoch === cancelEpoch && isCurrent() && fingerprint === JSON.stringify(getSettings().api) && key === getKey(config.baseUrl);
            onProgress('正在整理正文、预设与记忆，尚未提交独立 API');
            // The host uses shared prompt hooks. Release this queue before the network call.
            const prepare = async () => {
                if (!current()) throw failure('本次操作已取消。');
                return prepareRequest(getContext(), prompt, contact, current);
            };
            const handoff = preparation ? preparation.then(prepare) : prepare();
            const tail = handoff.catch(() => {});
            preparation = tail;
            let prepared;
            try { prepared = await handoff; }
            finally { if (preparation === tail) preparation = null; }
            if (!current()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            const payload = independentPayload(prepared, config);
            // A task may need a larger one-shot output than the saved preset
            // provides. This is a per-request ceiling only: saved API settings
            // and the host preset are never rewritten.
            if (Number.isInteger(options.maxTokens) && options.maxTokens >= 128 && options.maxTokens <= 32768) {
                const limit = options.maxTokens;
                if (payload.max_completion_tokens !== undefined) payload.max_completion_tokens = limit;
                else payload.max_tokens = limit;
            }
            // Only the caller's task contract is appended, after preset hooks.
            // Keep all roleplay context and portable settings intact.
            if (typeof options.finalOutputContract === 'string' && options.finalOutputContract.trim()) {
                payload.messages = [...payload.messages, { role: 'system', content: options.finalOutputContract }];
            }
            try {
                try { return await post('generate', config, key, payload, current, onProgress); }
                catch (error) {
                    if (options.retryEmptyOnce!==true || error.code!=='API_EMPTY_OUTPUT' || !current()) throw error;
                    // Only opted-in X tasks use this recovery. A successful response is
                    // never repeated; the retry keeps the full original context
                    // with a smaller per-request budget and unchanged settings.
                    const retryPayload={...payload};
                    const field=retryPayload.max_completion_tokens!==undefined?'max_completion_tokens':'max_tokens';
                    retryPayload[field]=Math.min(4096, Math.max(1024, Math.floor((Number(retryPayload[field])||8192)/2)));
                    onProgress('X 请求收到空回复，降低输出上限重试一次');
                    try { return await post('generate', config, key, retryPayload, current, onProgress); }
                    catch (again) {
                        again.diagnostic=(again.diagnostic?again.diagnostic+'\n':'')+'X 请求空回复恢复：已执行一次较低上限重试';
                        throw again;
                    }
                }
            } catch (error) {
                if (error.diagnostic) {
                    const sizes=payload.messages.map(m=>JSON.stringify(m).length);
                    error.diagnostic+='\n手机任务提示字符数：'+prompt.length+'；最终各条消息字符数（按发送顺序，含结构）：'+sizes.join('、');
                }
                throw error;
            }
        },
        async models(config, key, isCurrent) {
            const data = await post('status', config, key, {}, isCurrent);
            if (!Array.isArray(data?.data)) throw failure('服务没有返回模型列表，请手动填写模型 ID。');
            return [...new Set(data.data.map(item => item?.id).filter(id => typeof id === 'string' && id.length < 300))].sort();
        },
        test(config, key, isCurrent) {
            return complete({ ...config, maxTokens: Math.max(128, Math.min(config.maxTokens, 1024)) }, key,
                [{ role: 'user', content: 'Connection test. Reply only: OK' }], isCurrent);
        },
        cancel() { cancelEpoch++; for (const controller of active) controller.abort(); },
    };
}

// Keep prompt contents and portable preset parameters. Never forward the host's
// URL, authorization headers, custom endpoint configuration or account fields.
function independentPayload(prepared, config) {
    const fields = ['messages','temperature','frequency_penalty','presence_penalty','top_p','top_k','min_p','top_a','typical_p',
        'max_tokens','max_completion_tokens','stop','seed','logit_bias','logprobs','top_logprobs',
        'include_reasoning','reasoning_effort','verbosity','custom_prompt_post_processing','user_name','char_name','group_names',
        'tools','tool_choice','response_format','json_schema'];
    if (!Array.isArray(prepared?.messages) || !prepared.messages.length) throw failure('酒馆没有提供有效的生成内容。');
    const payload = Object.fromEntries(fields.filter(k => prepared[k] !== undefined).map(k => [k, prepared[k]]));
    return { ...payload, model: config.model.trim(), stream: false, type: 'quiet' };
}

const apiEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function createApiPanel({ adapter, getSettings, persist, redraw }) {
    let selectedProfile = '', profileName = '';
    const profiles = () => getSettings().apiProfiles || [];
    const activeId = () => getSettings().apiProfileId || '';
    let draft = null, key = '', tab = 'connection', models = [], status = '', statusKind = '', busy = false, token = 0;
    function init() { if (!draft) { draft = structuredClone(getSettings().api); key = adapter.keyStore?.get(draft.baseUrl, activeId()) || ''; } }
    function field(id, label, type = 'text', extra = '') {
        const value = id === 'key' ? key : draft[id];
        return '<label class="pp-field"><span>' + label + '</span><input data-api-field="' + id + '" type="' + type + '" value="' + apiEscape(value) + '" ' + extra + (busy ? ' disabled' : '') + '></label>';
    }
    function config(requireModel = true) {
        init();
        const value = { ...draft, baseUrl: normalizeApiUrl(draft.baseUrl), model: draft.model.trim() };
        if (requireModel && !value.model) throw new Error('请填写或选择模型 ID。');
        for (const [id, min, max] of [['timeout', 15, 300]]) {
            if (!Number.isInteger(value[id]) || value[id] < min || value[id] > max) throw new Error('请在参数页填写范围内的整数。');
        }
        if (/\r|\n/.test(key)) throw new Error('密钥不能包含换行。');
        return value;
    }
    return {
        html() {
            init();
            const disabled = busy ? ' disabled' : '';
            let body = '';
            const activeName = profiles().find(p => p.id === activeId())?.name || '未命名配置';
            if (tab === 'connection') {
                body = '<div class="pp-card pp-form"><label class="pp-field"><span>手机模型连接</span><select data-api-field="mode"' + disabled + '><option value="host"' + (draft.mode === 'host' ? ' selected' : '') + '>跟随酒馆</option><option value="independent"' + (draft.mode === 'independent' ? ' selected' : '') + '>独立 API（OpenAI 兼容）</option></select></label>';
                if (draft.mode === 'independent') body += field('baseUrl', 'API 地址', 'url', 'placeholder="https://example.com/v1" autocomplete="off" spellcheck="false"') +
                    field('key', 'API 密钥', 'password', 'autocomplete="off" spellcheck="false" placeholder="无需密钥的本地服务可留空"') +
                    field('model', '模型 ID', 'text', 'autocomplete="off" spellcheck="false" placeholder="填写服务商提供的模型 ID"') +
                    (models.length ? '<label class="pp-field"><span>已获取的模型</span><select data-api-field="modelChoice"' + disabled + '><option value="">选择模型</option>' + models.map(id => '<option value="' + apiEscape(id) + '"' + (draft.model === id ? ' selected' : '') + '>' + apiEscape(id) + '</option>').join('') + '</select></label>' : '') +
                    '<div class="pp-api-actions"><button type="button" class="pp-text-button" data-api-action="models"' + disabled + '>获取模型</button><button type="button" class="pp-text-button" data-api-action="test"' + disabled + '>测试连接</button><button type="button" class="pp-text-button" data-api-action="clear-key"' + disabled + '>清除密钥</button></div>';
                else body += '<p class="pp-footnote">使用酒馆当前模型连接和完整生成流程。</p>';
                body += '</div><p class="pp-footnote">独立 API 不修改酒馆正文连接。支持 OpenAI 兼容的 Chat Completions 接口；原生 Claude/Gemini 接口需使用兼容地址。</p><p class="pp-footnote">密钥按方案和地址仅保存在当前浏览器，不进入聊天记录或插件设置导出。更换浏览器需重新填写。切换地址不会沿用原地址的密钥。</p>';
            } else if (tab === 'profiles') {
                body = '<p class="pp-footnote">当前使用：' + apiEscape(activeName) + '</p><div class="pp-card pp-form"><label class="pp-field"><span>已保存方案</span><select data-api-field="selectedProfile"' + disabled + '><option value="">选择方案</option>' + profiles().map(p => '<option value="' + apiEscape(p.id) + '"' + (selectedProfile === p.id ? ' selected' : '') + '>' + apiEscape(p.name) + '</option>').join('') + '</select></label><div class="pp-api-actions"><button type="button" class="pp-text-button" data-api-action="profile-use"' + disabled + '>使用方案</button><button type="button" class="pp-text-button" data-api-action="profile-delete"' + disabled + '>删除方案</button></div></div>' +
                    '<div class="pp-card pp-form"><label class="pp-field"><span>新方案名称</span><input data-api-field="profileName" maxlength="80" value="' + apiEscape(profileName) + '"' + disabled + '></label><button type="button" class="pp-text-button" data-api-action="profile-save"' + disabled + '>另存为新方案</button></div><p class="pp-footnote">另存当前连接、参数和记忆设置。使用方案后立即生效；修改后点击下方保存，会更新当前方案。各方案密钥分别保存在当前浏览器。</p>';
            } else if (tab === 'parameters') {
                body = '<div class="pp-card pp-form">' + field('timeout', '超时秒数（15—300）', 'number', 'min="15" max="300" step="1"') + '</div><p class="pp-footnote">预设、上下文范围和回复长度跟随酒馆。超时只用于独立 API；失败重试次数在设置的「失败重试」页调整。</p>';
            } else if (tab === 'memory') {
                const source = draft.memorySource || 'qqj';
                const report = adapter.memoryStatus?.({ ...getSettings(), api: draft });
                body = '<div class="pp-card pp-form"><label class="pp-field"><span>记忆来源</span><select data-api-field="memorySource"' + disabled + '><option value="qqj"' + (source === 'qqj' ? ' selected' : '') + '>千千结</option><option value="none"' + (source === 'none' ? ' selected' : '') + '>关闭</option></select></label></div>' +
                    '<p class="pp-footnote" data-memory-status>' + apiEscape(report?.message || '请在酒馆内查看接口状态。') + '</p><button type="button" class="pp-text-button" data-api-action="memory-refresh">刷新状态</button>' +
                    '<p class="pp-footnote">从当前聊天的正式楼层摘要中按任务选择最近或相关的最多20条；社交任务可补充对应人物记忆。日报与开局名单导入不读取摘要。</p>';
            } else {
                body = '<div class="pp-card pp-info"><p>两种模式均使用酒馆的完整生成流程；独立 API 只更换接收请求的接口和模型。独立模式需要酒馆使用「聊天补全」连接类型。</p><p>内容语言跟随已启用的预设文本。测试连接仅发送简短测试消息，不携带角色或剧情，会消耗少量 token；获取模型失败时仍可手填模型 ID。</p><p>短信、电话及后续 App 的使用记录继续随聊天保存与删楼回退。API 配置不随删楼改变；聊天变化后旧请求结果不会写入记录。</p><p>允许主动联系时，正文完成和拒接等操作可能调用模型；可在「主动联系」页暂停。</p></div>';
            }
            return '<div class="pp-page"><nav class="pp-api-tabs" aria-label="API 设置分页">' + [['connection','连接'],['profiles','方案'],['parameters','参数'],['memory','记忆'],['help','说明']].map(([id,label]) => '<button type="button" class="pp-text-button" data-api-action="tab:' + id + '" aria-pressed="' + (tab === id) + '">' + label + '</button>').join('') + '</nav>' + body +
                '<div class="pp-api-savebar"><div class="pp-api-actions"><button type="button" class="pp-call-retry" data-api-action="save"' + disabled + '>保存 API 设置</button>' + (busy ? '<button type="button" class="pp-text-button" data-api-action="cancel">取消请求</button>' : '') + '</div><p class="pp-api-status" data-api-status data-kind="' + statusKind + '" role="status">' + apiEscape(status || '修改后点击保存才会用于手机通信。') + '</p></div></div>';
        },
        input(id, value) {
            init();
            if (id === 'selectedProfile') { selectedProfile = value; return; }
            if (id === 'profileName') { profileName = value; return; }
            token++; statusKind = ''; status = '尚未保存。';
            if (id === 'key') key = value.trim();
            else if (id === 'baseUrl') { draft.baseUrl = value; key = adapter.keyStore?.get(value, activeId()) || ''; models = []; }
            else if (id === 'modelChoice') { draft.model = value; redraw(); }
            else draft[id] = ['maxTokens', 'timeout', 'historyLimit'].includes(id) ? Number(value) : value;
            if (id === 'mode' || id === 'memorySource') redraw();
        },
        keyValue: () => key,
        async action(action) {
            init();
            if (action.startsWith('tab:')) { tab = action.slice(4); redraw(); return; }
            if (action === 'memory-refresh') { redraw(); return; }
            if (action === 'cancel') { token++; busy = false; status = '已取消请求。'; redraw(); return; }
            if (busy) return;
            statusKind = '';
            try {
                if (action === 'profile-use') {
                    const saved = profiles().find(p => p.id === selectedProfile);
                    if (!saved) throw new Error('请先选择方案。');
                    if (!persist({api:{...saved.api,revision:getSettings().api.revision+1},apiProfileId:saved.id})) throw new Error('方案切换失败。');
                    draft=structuredClone(getSettings().api);key=adapter.keyStore?.get(draft.baseUrl,saved.id)||'';models=[];token++;statusKind='success';status='已切换到「'+saved.name+'」。';
                } else if (action === 'profile-delete') {
                    const saved=profiles().find(p=>p.id===selectedProfile);
                    if(!saved)throw new Error('请先选择方案。');
                    // Deleting a preset keeps the active connection as an unnamed copy.
                    const wasActive=activeId()===saved.id;
                    const currentApi=getSettings().api;
                    const previousDefault=adapter.keyStore?.get(currentApi.baseUrl)||'';
                    if(wasActive&&currentApi.mode==='independent')adapter.keyStore?.set(currentApi.baseUrl,adapter.keyStore.get(currentApi.baseUrl,saved.id));
                    if(!persist({apiProfiles:profiles().filter(p=>p.id!==saved.id),...(wasActive?{apiProfileId:'',api:{...currentApi,revision:currentApi.revision+1}}:{})})) {
                        if(wasActive&&currentApi.mode==='independent')adapter.keyStore?.set(currentApi.baseUrl,previousDefault);
                        throw new Error('方案删除失败。');
                    }
                    if(saved.api.baseUrl)adapter.keyStore?.set(saved.api.baseUrl,'',saved.id);
                    selectedProfile='';token++;statusKind='success';status='方案已删除。';
                } else if (action === 'save' || action === 'profile-save') {
                    const next = draft.mode === 'independent' ? config() : { ...draft };
                    const creating=action==='profile-save';
                    const name=profileName.trim().slice(0,80);
                    if(creating&&!name)throw new Error('请填写方案名称。');
                    if(creating&&profiles().some(p=>p.name===name))throw new Error('已有同名方案，请换一个名称。');
                    const id=creating?crypto.randomUUID():activeId();
                    const previousKey = next.baseUrl ? adapter.keyStore?.get(next.baseUrl,id) : '';
                    if (draft.mode === 'independent') {
                        if (!adapter.keyStore) throw new Error('离线预览不保存 API 密钥。');
                        adapter.keyStore.set(next.baseUrl, key,id);
                    }
                    const nextApi={...next,revision:getSettings().api.revision+1};
                    const nextProfiles=creating?[...profiles(),{id,name,api:nextApi}]:profiles().map(p=>p.id===id?{...p,api:nextApi}:p);
                    if (!persist({ api: nextApi, apiProfiles:nextProfiles, apiProfileId:id })) {
                        if (draft.mode === 'independent') adapter.keyStore.set(next.baseUrl, previousKey,id);
                        throw new Error('API 设置保存失败。');
                    }
                    draft = structuredClone(getSettings().api); if(creating){selectedProfile=id;profileName='';} token++; statusKind = 'success'; status = '已保存，手机将使用' + (draft.mode === 'independent' ? '独立 API。' : '酒馆当前连接。');
                } else if (action === 'clear-key') {
                    adapter.keyStore?.set(normalizeApiUrl(draft.baseUrl), '',activeId()); key = ''; token++;
                    status = '此地址的本地密钥已清除。';
                } else if (action === 'models' || action === 'test') {
                    if (!adapter.api) throw new Error('离线预览不能连接 API，请在酒馆内测试。');
                    const next = config(action === 'test');
                    const id = ++token; busy = true; status = action === 'models' ? '正在获取模型…' : '正在测试连接…'; redraw();
                    try {
                        const result = await adapter.api[action](next, key, () => token === id);
                        if (token !== id) return;
                        if (action === 'models') { models = result; status = result.length ? '已获取 ' + result.length + ' 个模型，请选择后保存。' : '服务返回空列表，请手动填写模型 ID。'; }
                        else { statusKind = 'success'; status = '连接成功，模型已返回文字。请保存设置后使用。'; }
                    } catch (error) { if (token === id) { adapter.diagnostics?.add(error,'API '+action,[key]); statusKind = 'error'; status = error.message; } }
                    finally { if (token === id) busy = false; }
                }
            } catch (error) { adapter.diagnostics?.add(error,'API 设置',[key]); statusKind = 'error'; status = error.message; }
            redraw();
        },
        destroy() { token++; key = ''; draft = null; },
    };
}

// Small, chat-local event journal. It stores phone changes, never a copy of prose.
const JOURNAL_KEY = 'durian_phone_history';
const COLLECTIONS = ['profiles', 'contacts', 'calls', 'messages', 'snapchat', 'whatsapp', 'wechat', 'x', 'orders', 'assets', 'daily', 'smsContext', 'commContext', 'business', 'location', 'weather'];
const SCHEMA = 1;
const EMPTY_REVISION = 'root';
const copy = value => JSON.parse(JSON.stringify(value));
const record = value => value && typeof value === 'object' && !Array.isArray(value);

const isMemoryHidden = message => message?.extra?.qianqianjieAutoHide?.schemaVersion === 1 && typeof message.extra.qianqianjieAutoHide.chatId === 'string' && !message.extra.type;

function messageSignatures(chat, legacy = false) {
    return chat.map(message => JSON.stringify([
        String(message.mes ?? ''), String(message.name ?? ''), Boolean(message.is_user),
        Boolean(message.is_system && (legacy || !isMemoryHidden(message))), message.send_date ?? null, message.swipe_id ?? null,
    ]));
}

async function revisionsFor(signatures) {
    const encoder = new TextEncoder();
    const revisions = [];
    let previous = EMPTY_REVISION;
    for (const signature of signatures) {
        const hash = await crypto.subtle.digest('SHA-256', encoder.encode(previous + '\n' + signature));
        previous = Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
        revisions.push(previous);
    }
    return revisions;
}

function validateChanges(changes) {
    if (!Array.isArray(changes) || !changes.length) throw new Error('手机记录缺少变更内容。');
    for (const change of changes) {
        if (!record(change) || !COLLECTIONS.includes(change.collection) || typeof change.key !== 'string' || !change.key.length ||
            ['__proto__', 'constructor', 'prototype'].includes(change.key) || !(change.value === null || record(change.value))) {
            throw new Error('手机记录格式不正确，原数据已保留。');
        }
    }
}

function readJournal(raw) {
    if (raw === undefined) return { schema: SCHEMA, events: [] };
    if (!record(raw) || raw.schema !== SCHEMA || !Array.isArray(raw.events)) {
        throw new Error('暂时无法读取此聊天的手机记录，原数据已保留。');
    }
    const ids = new Set();
    for (const event of raw.events) {
        if (!record(event) || typeof event.id !== 'string' || !event.id || ids.has(event.id) ||
            !record(event.source) || !Number.isInteger(event.source.index) || event.source.index < 0 ||
            typeof event.source.revision !== 'string') throw new Error('手机记录来源不完整，原数据已保留。');
        ids.add(event.id);
        validateChanges(event.changes);
    }
    return copy(raw);
}

function reconcileJournal(raw, revisions, legacyRevisions = null) {
    const journal = readJournal(raw);
    const before = journal.events.length;
    // A chained revision binds an event to its entire narrative prefix, not just
    // its floor number. Editing an earlier floor invalidates later changes too.
    let migrated = false;
    for (const event of journal.events) {
        if (!event.source.visibilityNormalized && legacyRevisions && event.source.revision === legacyRevisions[event.source.index] && revisions[event.source.index]) {
            event.source.revision = revisions[event.source.index]; event.source.visibilityNormalized = true; migrated = true;
        }
    }
    journal.events = journal.events.filter(event => revisions[event.source.index] === event.source.revision);
    return { journal, removed: before - journal.events.length, migrated };
}

function appendChange(journal, revisions, changes, id = crypto.randomUUID()) {
    if (!revisions.length) throw new Error('请先开始一段聊天。');
    validateChanges(changes);
    const next = readJournal(journal);
    if (next.events.some(event => event.id === id)) return next; // Safe retry of the same operation.
    next.events.push({ id, source: { index: revisions.length - 1, revision: revisions.at(-1), visibilityNormalized: true }, changes: copy(changes) });
    return next;
}

function replayJournal(journal) {
    const maps = Object.fromEntries(COLLECTIONS.map(name => [name, new Map()]));
    const messagePositions = new Map();
    for (const event of readJournal(journal).events) {
        for (const change of event.changes) {
            // First creation anchors chronology. Edits/read flags must not move
            // old SMS; late imports still belong to their original story floor.
            if (change.collection === 'messages' && change.value !== null && !messagePositions.has(change.key)) {
                messagePositions.set(change.key, { floor: event.source.index, order: messagePositions.size });
            }
            if (change.value === null) maps[change.collection].delete(change.key);
            else {
                const value = copy(change.value), records = maps[change.collection];
                const publication = (change.collection === 'x' && value.type === 'post') ||
                    (change.collection === 'snapchat' && ['story','clip'].includes(value.type));
                if (publication) value.sourceIndex = records.get(change.key)?.sourceIndex ?? value.sourceIndex ?? event.source.index;
                records.set(change.key, value);
            }
        }
    }
    maps.messages = new Map([...maps.messages].sort(([a], [b]) => {
        const left = messagePositions.get(a), right = messagePositions.get(b);
        return left.floor - right.floor || left.order - right.order;
    }));
    return Object.fromEntries(COLLECTIONS.map(name => [name, Object.fromEntries(maps[name])]));
}

// A manual erase is permanent for this phone history, unlike a story action.
// Keep event IDs/source anchors with null changes so imports cannot resurrect it.
// Unified timing/shown sidecar rows follow their record: deleting the record
// also erases `commContext` rows keyed to it, including element entries.
function eraseMessageFromJournal(raw, messageId) {
    const journal = readJournal(raw);
    for (const event of journal.events) for (const change of event.changes) {
        if (['messages','smsContext'].includes(change.collection) && change.key === messageId) change.value = null;
        else if (change.collection === 'messages' && change.value?.replyTo === messageId) delete change.value.replyTo;
        else if (change.collection === 'commContext' && change.key === 'sms:' + messageId) change.value = null;
    }
    return journal;
}

function eraseRecordFromJournal(raw, collection, recordId) {
    if (collection === 'messages') return eraseMessageFromJournal(raw, recordId);
    const journal = readJournal(raw);
    const sidecar = collection + ':' + recordId;
    for (const event of journal.events) for (const change of event.changes) {
        if (change.collection === collection && change.key === recordId) change.value = null;
        else if (change.collection === 'commContext' &&
            (change.key === sidecar || change.key.startsWith(sidecar + '#'))) change.value = null;
    }
    return journal;
}

const squareClock = chat => readStoryClock(chat, null, {exact:true});

function squareExpiry(publication, chat) {
    const start=publication?.clock, now=squareClock(chat);
    if (!start || start.day==null || now.day==null) return 'unknown';
    const days=now.day-start.day;
    if (days>=2) return 'expired';
    if (days<0 || start.hour==null || now.hour==null) return 'unknown';
    const hours=days*24+now.hour-start.hour;
    return hours<0?'unknown':hours>=24?'expired':'active';

        let below = rect.top - size.height - gap < view.top + 6;

        top = Math.min(Math.max(top, view.top + 6), Math.max(view.top + 6, view.bottom - size.height - 6));

            ' data-kind="' + action.icon + '" aria-label="' + String(action.label).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]) + '"' +
            ' title="' + String(action.label).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]) + '"' +
            (action.danger ? ' data-danger="true"' : '') + (action.active ? ' data-active="true"' : '') +
            (action.disabled ? ' disabled aria-disabled="true"' : '') + '>' + icon(action.icon) + '</button>').join('') +
            '</div><span class="pp-press-tail" aria-hidden="true"></span>';
        bubble = node;
        menuState = { actions };
        // 直接使用手机窗口的原生 CSS 像素，不需要对长按气泡二次缩放。
        node.style.visibility = 'hidden';
        root.append(node);

        node.addEventListener('click', event => {
            const button = event.target.closest('button[data-press-index]');

    }

    function onPointerDown(event) {
        if (bubble && !bubble.contains(event.target)) close();
        const target = event.target.closest?.('[data-press]');

        if (event.pointerType === 'mouse') return;

    }

    function onPointerMove(event) {

    }

    function onContextMenu(event) {
        const target = event.target.closest?.('[data-press]');

        event.preventDefault();

        const actions = getActions(target);
        if (Array.isArray(actions) && actions.length) open(target, actions);
    }

    function onKeyDown(event) {
        if (!((event.key === 'F10' && event.shiftKey) || event.key === 'ContextMenu')) return;
        const target = shadow.activeElement?.closest?.('[data-press]');
        if (!target) return;
        event.preventDefault();
        const actions = getActions(target);

    function onClickCapture(event) {
        if (bubble?.contains(event.target)) return;

    shadow.addEventListener('pointermove', onPointerMove, true);
    shadow.addEventListener('pointerup', clearPress, true);
    shadow.addEventListener('pointercancel', clearPress, true);
    shadow.addEventListener('contextmenu', onContextMenu, true);
    shadow.addEventListener('keydown', onKeyDown, true);
    shadow.addEventListener('click', onClickCapture, true);
    shadow.addEventListener('scroll', () => close(true), true);

    return {
        close,
        get isOpen() { return !!bubble; },
        get target() { return activeTarget; },
    };

function validateSMS(data) {

    const participants = { ...(state.contacts ?? {}) };

            const replyable = message.replyable !== false;
            if (!participants[message.contactId] || (participants[message.contactId].replyable === false && replyable)) {
                participants[message.contactId] = { ...message.participant, number: null, receivedSMS: true, replyable };
