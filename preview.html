    }
    async function perform(method,args=[],message='') {
        if(!adapter.snapchat){notice('请在酒馆内使用 Snapchat。');return null;}
        if(posting||getView().busy)return null;
        const token=epoch;posting=true;redraw();
        try {const result=await adapter.snapchat[method](...args);if(token!==epoch)return null;if(result?.ok){status=message;return result;}status=result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){if(token===epoch)status=error.message;return null;}
        finally{if(token===epoch)posting=false;redraw();}
    }
    async function queueCurrent(){
        const token=epoch,selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(!message.trim())return;
        const result=await perform('queueMessage',[selected,kind,message]);
        if(token===epoch&&result?.ok&&drafts[draftKey]===message)delete drafts[draftKey];
        redraw();return result;
    }
    async function sendCurrent(){
        const token=epoch,selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(message.trim()) {const added=await perform('queueMessage',[selected,kind,message]);if(token!==epoch||!added?.ok)return;if(drafts[draftKey]===message)delete drafts[draftKey];}
        await perform('flushMessages',[selected]);redraw();
    }
    function back() {
        if(editingId){editingId=null;redraw();return true;}
        if(page==='cash'){page='';redraw();return true;}
        if(!page&&!accountId)return false;
        accountId=null;page='';redraw();return true;
    }
    const api = {
        html, queueCurrent, back,
        reset(){selectedAccounts.clear();epoch++;posting=false;editingId=null;tab='chat';accountId=null;page='';drafts=Object.create(null);status='';},
        input(target){if(target.dataset.snapSelect){if(posting||getView().busy)return;target.checked?selectedAccounts.add(target.dataset.snapSelect):selectedAccounts.delete(target.dataset.snapSelect);redraw();return;}if(target.dataset.snapField)drafts[key(target.dataset.snapField)]=target.type==='checkbox'?target.checked:target.value;},
        async readVisible(){if(reading||posting||getView().busy||!accountId||page==='profile'||!adapter.snapchat)return;if(!snapItems(getView(),'message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;reading=true;try{await adapter.snapchat.markRead(accountId);}finally{reading=false;}},
        async action(action,id) {
            if(action==='add-selected'){const token=epoch,ids=[...selectedAccounts];const result=await perform('inviteMany',[ids]);if(token===epoch&&result?.ok){ids.forEach(id=>selectedAccounts.delete(id));const r=result.value;status='已添加 '+r.friends+' 人，等待通过 '+r.pending+' 人，未通过 '+r.declined+' 人。';redraw();}return;}
            if(action==='edit-message'){editingId=id;drafts[key('editText')]=getView().snapchat[id]?.text||'';redraw();return;}
            if(action==='cancel-edit'){editingId=null;redraw();return;}
            if(action==='reroll-message'){await perform('rerollMessage',[id]);return;}
            if(action==='delete-message'){
                if(!window.confirm('删除这条消息？删除后不会再出现在聊天记录中。'))return;
                await perform('deleteMessage',[id],'已删除消息');return;
            }
            if(action==='tab'){editingId=null;tab=id;accountId=null;page='';status='';redraw();return;}
            if(action==='profile'){editingId=null;page='profile';redraw();return;}
            if(action==='list'){editingId=null;accountId=null;page='';redraw();return;}
            if(action==='thread'){editingId=null;accountId=id;page='';redraw();return;}
            if(action==='cash'){editingId=null;page='cash';redraw();return;}
            if(action==='comment'){editingId=null;page='comment:'+id;redraw();return;}
            const handlers={invite:['invite',[id]],accept:['accept',[id,true]],decline:['accept',[id,false]],block:['block',[id,true]],unblock:['block',[id,false]],reveal:['reveal',[id]],voice:['call',[id,'voice']],video:['call',[id,'video']],hangup:['hangup',[id]],retry:['retryMessage',[id]],refresh:['refresh',[tab]],like:['like',[id]],settle:['settle',[id,true]],cancel:['settle',[id,false]]};
            if(handlers[action])await perform(...handlers[action]);
        },
        async submit(formElement) {
            const data=Object.fromEntries(new FormData(formElement));const formName=formElement.dataset.snapForm;
            const initialKey=key(''),token=epoch;const draftKey=name=>initialKey+name;let result;
            if(formName==='search'){result=await perform('discover',[data.query]);if(token===epoch&&result?.ok)status='搜索完成，新增 '+result.value.added+' 个账号。';}
            if(formName==='profile')result=await perform('saveProfile',[{...data,sharing:data.sharing==='on'}],'已保存个人设置');
            if(formName==='message'){await sendCurrent();return;}
            if(formName==='edit-message'){result=await perform('editMessage',[editingId,data.editText]);if(token===epoch&&result?.ok)editingId=null;}
            if(formName==='story'){result=await perform('publish',[data.storyKind,data.story],'故事已发布');if(token===epoch&&result?.ok)delete drafts[draftKey('story')];}
            if(formName==='comment'){result=await perform('comment',[page.slice(8),data.comment]);if(token===epoch&&result?.ok){delete drafts[draftKey('comment')];page='';}}
            if(formName==='call'){const active=snapItems(getView(),'call').find(c=>c.accountId===accountId&&c.status==='connected');if(active){result=await perform('call',[accountId,active.mode,data.call,active.id]);if(token===epoch&&result?.ok)delete drafts[draftKey('call')];}}
            if(formName==='cash'){
                result=await perform('transfer',[accountId,data.amount,data.currency,data.memo]);
                if(token===epoch&&result?.ok){for(const name of ['amount','memo'])delete drafts[draftKey(name)];page='';await perform('settle',[result.value,true]);}
            }
            redraw();
        },
        press(element){
            const id=element.dataset.snapId,item=getView().snapchat?.[id];
            if(!item||item.type!=='message')return [];
            const busy=!!(posting||getView().busy),actions=[];
            if(item.role==='assistant'){
                actions.push({icon:'edit',label:'修改消息',disabled:busy,run:()=>api.action('edit-message',id)});
                actions.push({icon:'refresh',label:'重新生成消息',disabled:busy,run:()=>api.action('reroll-message',id)});
            }
            actions.push({icon:'delete',label:'删除消息',danger:true,disabled:busy,run:()=>api.action('delete-message',id)});
            return actions;
        },
    };
    return api;
}


const MAX_POSTS = 5;
const plain = (value, max) => String(value ?? '').trim().slice(0,max);
const allowedModes = new Set(['all','private','include','exclude']);
const wxMoments = state => Object.values(state.wechat||{}).filter(item=>item.type==='moment');
const wxFriends = state => Object.values(state.wechat||{}).filter(x=>x.type==='account').filter(a=>a.friend==='friends'&&!a.blocked);

function canViewWxMoment(moment,accountId) {
    if(moment?.type!=='moment')return false;
    if(moment.authorId==='user') {
        if(accountId==='user')return true;
        const visibility=moment.visibility||'all',list=moment.audienceIds||[];
        if(visibility==='private')return false;
        if(visibility==='include')return list.includes(accountId);
        if(visibility==='exclude')return !list.includes(accountId);
        return true;
    }
    return accountId==='user'||moment.authorId===accountId;
}

const norm = value => String(value||'').normalize('NFKC').trim().toLowerCase();
const validMoment = moment => moment?.type==='moment' && (moment.text||moment.imageDescription);
const recentMoments = state => wxMoments(state).filter(validMoment).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const shownComments = (moment,actorId) => (moment.comments||[]).filter(c=>c.authorId==='user'||c.authorId===actorId);

// A direct WeChat conversation is also scoped to the one real friend who can
// see the post. Never attach another friend's exclusive Moments to this chat.
function wechatMomentsAccountPrompt(state,accountId,chat) {
    const friend=wxFriends(state).find(a=>a.id===accountId);
    if(!friend)return '';
    const now=readStoryClock(chat);
    const rows=recentMoments(state).filter(m=>m.authorId==='user'&&canViewWxMoment(m,friend.id))
        .filter(m=>!(Number.isInteger(now.day)&&Number.isInteger(m.storyTime?.day)&&now.day-m.storyTime.day>3))
        .slice(0,8).map(m=>({
            id:m.id,text:plain(m.text,600),imageDescription:plain(m.imageDescription,200),
            storyTime:m.storyTime||null,
            comments:shownComments(m,friend.id).slice(-6).map(c=>({
                author:c.authorId==='user'?'user':friend.name,text:plain(c.text,250),replyTo:c.replyTo||null,
            })),
        }));
    if(!rows.length)return '';
    return '\n本次微信聊天对象有权限看到的用户朋友圈（仅此账号知情，不作为私信）：'+
        JSON.stringify({friend:friend.name,userAlias:state.wechat?.profile?.alias||'user',moments:rows})+
        '。可以自然回应或完全不提，不强制生成朋友圈评论或重复旧帖子。' +
        (friend.identityKnown===true?'':'当前账号不一定知道网名背后的真人身份，不得凭后台信息识破匿名。');
}

function wechatMomentsStoryPrompt(state,context,chat) {
    // The narrative speaker is one actual chat character. Do not expose a
    // restricted Moment to any other speaker merely because the author is user.
    const actor=context.characters?.[context.characterId];
    if(!actor?.name)return '';
    const unique=context.characters.filter(c=>norm(c.name)===norm(actor.name)).length===1;
    const accounts=wxFriends(state).filter(a=>a.characterId==='card:'+actor.avatar||
        (!a.characterId&&unique&&norm(a.name)===norm(actor.name)));
    if(accounts.length!==1)return '';
    const friend=accounts[0],now=readStoryClock(chat);
    const moments=recentMoments(state).filter(m=>m.authorId==='user'&&canViewWxMoment(m,friend.id))
        .filter(m=>!(Number.isInteger(now.day)&&Number.isInteger(m.storyTime?.day)&&now.day-m.storyTime.day>3))
        .slice(0,8).map(m=>({
            id:m.id,author:m.authorName,identityKnown:friend.identityKnown===true,
            text:plain(m.text,600),imageDescription:plain(m.imageDescription,220),
            storyTime:m.storyTime||null,
            comments:shownComments(m,friend.id).slice(-6).map(c=>({id:c.id,author:c.authorId==='user'?m.authorName:friend.name,text:plain(c.text,300),replyTo:c.replyTo||null})),
        }));
    const rules='\n微信朋友圈与正文同步：仅当本楼小说正文明确描写当前人物已实际发表一条新朋友圈，且写出真实发表内容时，末尾附 <!--durian-wechat-moment:{"action":"published","authorId":"'+friend.id+'","text":"实际发出的朋友圈文字","imageDescription":"如明确发布图片则填写文字描述"}-->；仅当本楼明确描写该人物已在以下可见朋友圈发表评论时，末尾附 <!--durian-wechat-moment:{"action":"comment","authorId":"'+friend.id+'","momentId":"以下已有朋友圈准确ID","text":"实际已发表的评论文字","replyTo":"回复已有评论ID或不填写"}-->。只记录真实已经发生、正文实际写出的评论和发帖；打算、草稿、回忆、手机中已有内容均不重记，不为了生成标记而安排额外动作。没有本楼新发文或评论就不输出标记。';
    if(!moments.length)return rules;
    return rules+'\n微信朋友圈·当前人物可见记录：'+JSON.stringify({account:friend.name,userAlias:state.wechat?.profile?.alias||context.name1,moments})+
        '。这些朋友圈已经发表且对当前人物可见，不是尚待发送的消息；只供自然延续人物认知，' +
        '可以在剧情相关时提起，也可以完全不理会；不得让未授权的人物知晓仅部分好友可见的内容。' +
        (friend.identityKnown===true?'':'本账号不一定知道网名对应的现实 user，不得仅凭后台关系认出真人。')+
        '不要将旧朋友圈重新写成刚发布，也不要为了展示朋友圈强行安排 user 打开微信；正文明确发生新的朋友圈评论时才描述，不凭空补写 user 的发言。';
}


function createWechatMoments({memory,phone,getContext,getSettings}) {
    const run = work => phone.appTask(async (view,current,request) => {
        const ticket=await memory.begin(view);
        const commit=async changes=>{
            if(!current())throw new Error('聊天已变化，朋友圈操作已取消。');
            if(changes.length)await memory.commit(ticket,changes);
        };
        return work(view.state,current,request,commit);
    },'wechat');

    const publish=(body,imageDescription,visibility='all',audienceIds=[])=>run(async (state,current,request,commit)=>{
        const text=plain(body,6000),image=plain(imageDescription,1500);
        if(!text&&!image)throw new Error('请输入正文或图片描述。');
        if(String(body??'').trim().length>6000||String(imageDescription??'').trim().length>1500)throw new Error('朋友圈内容过长。');
        if(!allowedModes.has(visibility))throw new Error('朋友圈可见范围无效。');
        if(!Array.isArray(audienceIds)||audienceIds.length>300||audienceIds.some(id=>typeof id!=='string'))throw new Error('请选择有效的好友。');
        const friends=new Set(wxFriends(state).map(a=>a.id));
        const audience=[...new Set(audienceIds)];
        if(audience.some(id=>!friends.has(id)))throw new Error('所选好友已经不可用，请重新选择。');
        if(['include','exclude'].includes(visibility)&&!audience.length)throw new Error('请至少选择一位好友。');
        const item={id:'wx-moment:'+crypto.randomUUID(),type:'moment',authorId:'user',
            authorName:plain(state.wechat?.profile?.alias||getContext().name1,60)||'user',
            text,imageDescription:image,visibility,audienceIds:['include','exclude'].includes(visibility)?audience:[],
            likes:[],comments:[],createdAt:Date.now(),storyTime:readStoryClock(getContext().chat)};
        await commit([{collection:'wechat',key:item.id,value:item}]);
        return {id:item.id};
    });

    const refreshMoments=()=>run(async(state,current,request,commit)=>{
        const friends=wxFriends(state).slice(0,25);
        if(!friends.length)return {added:0,interactions:0};
        const existing=recentMoments(state).slice(0,22);
        // A multi-actor prompt MUST only contain moments visible to every actor
        // in that cohort. Split by the exact visible set, never attach a
        // restricted post to a prompt containing an unauthorized friend.
        const cohorts=new Map();
        for(const friend of friends){
            const visible=existing.filter(m=>canViewWxMoment(m,friend.id));
            const key=visible.map(m=>m.id).sort().join('|');
            if(!cohorts.has(key))cohorts.set(key,{friends:[],visible});
            cohorts.get(key).friends.push(friend);
        }
        const staged=structuredClone(state),changes=[],newPosts=[],newInteractions=[];
        const usedPosts=new Set();
        const acceptedReactions=new Set();
        const now=Date.now(),clock=readStoryClock(getContext().chat);
        for(const cohort of cohorts.values()){
            if(!current())throw Error('朋友圈刷新已取消。');
            const remaining=MAX_POSTS-newPosts.length;
            const candidates=cohort.friends.map(a=>({id:a.id,name:a.name,aliases:(a.aliases||[]).slice(0,3)}));
            const visible=cohort.visible.map(m=>({
                id:m.id,authorId:m.authorId,authorName:m.authorName,
                text:plain(m.text,600),imageDescription:plain(m.imageDescription,200),storyTime:m.storyTime||null,
                comments:(m.comments||[]).filter(c=>c.authorId==='user')
                    .slice(-8).map(c=>({id:c.id,authorId:'user',text:plain(c.text,300),replyTo:c.replyTo||null})),
            }));
            const previous=wxMoments(state).filter(m=>m.authorId!=='user'&&cohort.friends.some(a=>a.id===m.authorId))
                .slice(-14).map(m=>({authorId:m.authorId,text:plain(m.text,250)}));
            const prompt=getSettings().prompts.general+'\n'+getSettings().prompts.wechat+
                '\n当前任务：刷新虚构微信朋友圈，允许好友自行发新朋友圈，也允许他们对当前确实可见的旧朋友圈点赞、评论、回复 user 已写出的评论。不替 user 发言，不自动生成新的 user 帖子。'+
                '\n本批可以生成的微信好友：'+JSON.stringify(candidates)+
                '\n仅本批好友有权限看到的朋友圈：'+JSON.stringify(visible)+
                '\n这些好友此前的朋友圈（避免重复）：'+JSON.stringify(previous)+
                '\n可见范围由程序按好友预先分组；只依据本次可见列表，不能推断私人、仅其他好友可见、聊天私信或隐藏身份的内容。'+
                '人物可以不发表评论、不点赞或不发新动态；不要让所有人围着 user 转，也不要重复旧评论。'+
                '\n只输出一个 JSON 对象：{"moments":[{"authorId":"本批好友账号id","text":"新朋友圈内容","imageDescription":"可选图片文字描述"}],"interactions":[{"momentId":"可见朋友圈id","authorId":"本批好友账号id","kind":"like 或 comment","text":"评论正文；like 时为空字符串","replyTo":"回复的已有 user 评论id；普通评论留空"}]}。'+
                'moments 最多'+remaining+'条，正文1～300字；interactions最多12条。作者和目标必须使用提供的准确ID，不需要互动时返回空数组。';
            const data=await request(prompt,value=>{
                if(!Array.isArray(value.moments)||value.moments.length>remaining||
                    (value.interactions!==undefined&&(!Array.isArray(value.interactions)||value.interactions.length>12)))
                    throw Error('朋友圈数据格式不正确。');
                const accounts=new Map(cohort.friends.map(a=>[a.id,a]));
                const posts=value.moments.map(item=>{
                    const a=accounts.get(item?.authorId);
                    if(!a||typeof item.text!=='string'||!item.text.trim()||item.text.length>300||
                        (item.imageDescription!=null&&(typeof item.imageDescription!=='string'||item.imageDescription.length>600)))
                        throw Error('朋友圈作者或正文无效。');
                    return {authorId:a.id,authorName:a.name,text:item.text.trim(),imageDescription:plain(item.imageDescription,600)};
                });
                const visibleIds=new Map(cohort.visible.map(m=>[m.id,m]));
                const interactions=(value.interactions||[]).map(item=>{
                    const friend=accounts.get(item?.authorId),target=visibleIds.get(item?.momentId);
                    if(!friend||!target||!canViewWxMoment(target,friend.id)||!['like','comment'].includes(item.kind))
                        throw Error('朋友圈互动账号或可见目标无效。');
                    const body=typeof item.text==='string'?item.text.trim():'';
                    if(item.kind==='comment'&&(!body||body.length>500)||item.kind==='like'&&body)
                        throw Error('朋友圈评论内容无效。');
                    const replyTo=item.replyTo||null;
                    if(replyTo&&(!target.comments?.some(c=>c.id===replyTo&&c.authorId==='user')||item.kind!=='comment'))
                        throw Error('朋友圈回复目标无效。');
                    return {authorId:friend.id,name:friend.name,momentId:target.id,kind:item.kind,text:body,replyTo};
                });
                return {posts,interactions};
            },current,null,{retries:0,skipExternalMemory:true,skipSMSClassification:true,
                parseResponse:parseModelObject,finalOutputContract:'仅返回一个合法 JSON 对象，根字段 moments 和 interactions 均为数组。不能输出正文、说明或隐藏标记。'});
            for(const p of data.posts){
                const dedupe=p.authorId+':'+p.text;
                if(usedPosts.has(dedupe)||wxMoments(state).some(m=>m.authorId===p.authorId&&m.text===p.text))continue;
                usedPosts.add(dedupe);newPosts.push(p);
            }
            for(const a of data.interactions){
                const key=[a.momentId,a.authorId,a.kind,a.text,a.replyTo||''].join('|');
                if(acceptedReactions.has(key))continue;
                acceptedReactions.add(key);newInteractions.push(a);
            }
        }
        for(const [i,post] of newPosts.entries()){
            const value={...post,id:'wx-moment:'+crypto.randomUUID(),type:'moment',
                visibility:'all',audienceIds:[],likes:[],comments:[],createdAt:now+i,storyTime:clock};
            changes.push({collection:'wechat',key:value.id,value});
        }
        const mutated=new Map();
        let savedInteractions=0;
        for(const row of newInteractions){
            const old=mutated.get(row.momentId)||staged.wechat?.[row.momentId];
            if(old?.type!=='moment')continue;
            let next;
            if(row.kind==='like'){
                if((old.likes||[]).includes(row.authorId))continue;
                next={...old,likes:[...(old.likes||[]),row.authorId]};
            }else{
                if((old.comments||[]).some(c=>c.authorId===row.authorId&&c.text===row.text&&
                    (c.replyTo||null)===(row.replyTo||null)))continue;
                const comment={id:'wx-comment:'+crypto.randomUUID(),authorId:row.authorId,
                    name:row.name,text:row.text,replyTo:row.replyTo||null,createdAt:now+changes.length,
                    storyTime:clock};
                next={...old,comments:[...(old.comments||[]),comment]};
            }
            mutated.set(row.momentId,next);savedInteractions++;
        }
        for(const [id,value]of mutated)changes.push({collection:'wechat',key:id,value});
        await commit(changes);
        return {added:newPosts.length,interactions:savedInteractions};
    });

    const likeMoment=id=>run(async(state,current,request,commit)=>{
        const item=state.wechat?.[id],friends=wxFriends(state);
        if(!item||item.type!=='moment'||(item.authorId!=='user'&&!friends.some(a=>a.id===item.authorId)))throw new Error('朋友圈动态不可用。');
        const likes=Array.isArray(item.likes)?item.likes:[];
        const next=likes.includes('user')?likes.filter(a=>a!=='user'):[...likes,'user'];
        await commit([{collection:'wechat',key:id,value:{...item,likes:next}}]);
        return {liked:next.includes('user')};
    });
    const commentMoment=(id,comment,replyTo=null)=>run(async(state,current,request,commit)=>{
        const item=state.wechat?.[id],friends=wxFriends(state),text=plain(comment,500);
        if(!item||item.type!=='moment'||(item.authorId!=='user'&&!friends.some(a=>a.id===item.authorId)))throw new Error('朋友圈动态不可用。');
        if(!text||String(comment||'').trim().length>500)throw new Error('请填写有效评论（最多500字）。');
        if(replyTo&&!(item.comments||[]).some(c=>c.id===replyTo))throw Error('回复的朋友圈评论已不存在。');
        const record={id:'wx-comment:'+crypto.randomUUID(),authorId:'user',
            name:plain(state.wechat?.profile?.alias||getContext().name1,60),text,replyTo:replyTo||null,
            storyTime:readStoryClock(getContext().chat),createdAt:Date.now()};
        await commit([{collection:'wechat',key:id,value:{...item,comments:[...(item.comments||[]),record]}}]);
        return {id:record.id};
    });
    return {publish,refreshMoments,likeMoment,commentMoment};
}

// A short name is scoped to this request, never saved as a global identity alias.
function matchesFriendName(person,query){
    if(sameNamedPerson(person,{name:query}))return true;
    const short=query.normalize('NFKC').trim().toLowerCase();
    return nameAliases(person).some(alias=>{
        const full=alias.normalize('NFKC').trim().toLowerCase();
        const parts=full.split(/[\s·・•]+/u);
        if(parts.length>1)return parts.includes(short);
        // Unseparated Chinese full name with a single- or double-character surname.
        return /^[\p{Script=Han}]{2,4}$/u.test(full)&&/^[\p{Script=Han}]{1,2}$/u.test(short)
            &&full.endsWith(short)&&[1,2].includes(full.length-short.length);
    });
}
function friendTarget(context,existing,query){
    const members=context.groups?.find(g=>String(g.id)===String(context.groupId))?.members||[];
    const active=(context.characters||[]).filter((c,i)=>context.groupId!=null&&context.groupId!==''?members.includes(c.avatar):context.characterId!=null&&context.characterId!==''&&i===Number(context.characterId));
    const candidates=[...existing,...active].filter(a=>matchesFriendName(a,query));
    if(active.filter(c=>matchesFriendName(c,query)).length>1)throw Error('有多位角色符合这个名字，请输入可区分的姓名。');
    const first=candidates[0];
    if(candidates.some(a=>!sameNamedPerson(first,a)&&!(a.characterId&&a.characterId==='card:'+first.avatar)&&!(first.characterId&&first.characterId==='card:'+a.avatar)))
        throw Error('有多位人物符合这个名字，请补充姓氏或完整姓名。');
    return first||null;
}

    async function perform(method,args=[],message='') {
        if(!adapter[app]){notice('请在酒馆内使用'+label+'。');return null;}
        if(posting||getView().busy)return null;
        const token=epoch;posting=true;redraw();
        try{const result=await adapter[app][method](...args);if(token!==epoch)return null;status=result?.ok?message:result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){if(token===epoch)status=error.message;return null;}
        finally{if(token===epoch)posting=false;redraw();}
    }
    async function queueCurrent(){
        const token=epoch,id=accountId,draftKey=key('message'),text=value('message');
        if(!wc&&value('kind','text')==='transfer'){drafts[key('kind')]='text';page='cash';redraw();return;}
        if(!text.trim())return;
        const result=await perform('queueMessage',[id,value('kind','text'),text]);
        if(token===epoch&&result?.ok&&drafts[draftKey]===text)delete drafts[draftKey];redraw();return result;
    }
    function back(){
        if(editingId){editingId=null;redraw();return true;}
        if(wc&&page==='moment-audience'){page='moment-compose';redraw();return true;}
        if(wc&&page==='moment-compose'){page='moment-feed';redraw();return true;}
        if(wc&&page==='share-music'){page='';plusMenu=false;redraw();return true;}
        if(page){page='';redraw();return true;}
        if(accountId){accountId=null;redraw();return true;}
        return false;
    }
    async function bulk(){const token=epoch,result=await perform('addEstablished');if(token===epoch&&result?.ok){status='已添加 '+result.value.added+' 位好友'+(result.value.updated?'，更新 '+result.value.updated+' 位':'')+'。';redraw();}}
    const api={html,back,queueCurrent,
        reset(){epoch++;posting=false;reading=false;tab='chats';accountId=null;page='';editingId=null;status='';drafts=Object.create(null);momentDraft={text:'',imageDescription:'',visibility:'all',audienceIds:[]};momentMenuId=null;momentCommentText='';momentReplyTo=null;plusMenu=false;},
        input(target){const name=target.dataset.chatField;if(name){
            if(wc&&name==='momentImage'){momentDraft.imageDescription=target.value;return;}
            if(wc&&name==='momentText'){momentDraft.text=target.value;return;}
            if(wc&&name==='momentComment'){momentCommentText=target.value;return;}
            const changed=value(name)!==target.value;drafts[key(name)]=target.value;
            if(name==='kind'&&!wc&&target.value==='transfer'&&accountId){drafts[key(name)]='text';page='cash';editingId=null;redraw();return;}
            if((name==='filter'||name==='kind'&&!wc)&&changed)redraw();}},
        async readVisible(){if(reading||posting||getView().busy||page||!accountId||!adapter[app]||!records('message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;const token=epoch;reading=true;try{await adapter[app].markRead(accountId);}finally{if(token===epoch)reading=false;}},
        async action(action,id){
            if(action==='back'){back();return;}
            if(action==='tab'||action==='contacts'){tab=action==='contacts'?'contacts':id;accountId=null;page='';editingId=null;status='';plusMenu=false;redraw();return;}
            if(action==='thread'){accountId=id;page='';editingId=null;status='';plusMenu=false;redraw();return;}
            if(wc&&action==='wx-plus'){plusMenu=!plusMenu;redraw();return;}
            if(wc&&action==='share-music'){page='share-music';plusMenu=false;redraw();return;}
            if(wc&&action==='wx-profile'){page='wx-profile';redraw();return;}
            if(wc&&action==='moment-feed'){tab='discover';accountId=null;page='moment-feed';momentMenuId=null;redraw();return;}
            if(wc&&action==='moment-compose'){page='moment-compose';redraw();return;}
            if(wc&&action==='moment-audience'){page='moment-audience';redraw();return;}
            if(wc&&action==='moment-mode'){momentDraft.visibility=id;momentDraft.audienceIds=[];redraw();return;}
            if(wc&&action==='moment-friend'){const ids=momentDraft.audienceIds,ix=ids.indexOf(id);if(ix>=0)ids.splice(ix,1);else ids.push(id);redraw();return;}
            if(wc&&action==='moment-audience-done'){
                if(['include','exclude'].includes(momentDraft.visibility)&&!momentDraft.audienceIds.length){
                    status='请至少选择一位好友。';redraw();return;
                }
                status='';page='moment-compose';redraw();return;
            }
            if(wc&&action==='moment-refresh'){await perform('refreshMoments',[],'已刷新朋友圈');return;}
            if(wc&&action==='moment-actions'){momentMenuId=momentMenuId===id?null:id;redraw();return;}
            if(wc&&action==='moment-comment-open'){momentMenuId='comment:'+id;momentCommentText='';momentReplyTo=null;redraw();return;}
            if(wc&&action==='moment-comment-reply'){
                const moment=wxMoments(getView()).find(m=>(m.comments||[]).some(c=>c.id===id));
                if(!moment)return;

// Missing replyTo (older direct replies) and null (ambient samples) both
// mean the post itself. Distinct parents, authors and intentional user posts
// keep their own IDs. A child of an old duplicate follows the surviving row.
function xCommentKey(postId, author, text, parent = null) {
    return JSON.stringify([postId, author, parent || null, String(text || '').trim().normalize('NFC').replace(/\s+/gu, ' ')]);
}

function xComments(state) {
    const comments = [], first = new Map(), redirects = new Map();
    for (const row of Object.values(state.x || {})) {
        if (row.type !== 'comment') continue;
        const parent = redirects.get(row.replyTo) || row.replyTo || null;
        const key = xCommentKey(row.postId, row.author, row.text, parent);
        if (row.author !== 'user' && first.has(key)) {
            redirects.set(row.id, first.get(key));
            continue;
        }
        first.set(key, row.id);
        comments.push(parent === (row.replyTo || null) ? row : {...row, replyTo: parent});
    }
    return comments;
}

const X_COMMENT_LIMIT=15;
function visibleXComments(comments) {
    if(comments.length<=X_COMMENT_LIMIT)return comments;
    const byId=new Map(comments.map(c=>[c.id,c])),selected=new Set();
    // Keep recent direct conversations visible together with their parents.
    const recent=[...comments].reverse();
    for(const comment of [...recent.filter(c=>!c.ambient),...recent.filter(c=>c.ambient)]){
        if(selected.size===X_COMMENT_LIMIT)break;
        const chain=new Set();
        for(let c=comment;c&&!selected.has(c.id)&&!chain.has(c.id);c=byId.get(c.replyTo))chain.add(c.id);
        if(selected.size+chain.size<=X_COMMENT_LIMIT)for(const id of chain)selected.add(id);
    }
    return comments.filter(c=>selected.has(c.id));
}

function resolveEdits(state,fields,edits){

        let value=String(edit.value).trim();

const metric = n => Number.isFinite(Number(n)) ? Math.min(Number.MAX_SAFE_INTEGER,Math.max(0,Math.floor(Number(n)))) : 0;

    const comments=xItems(state,'comment').filter(c=>c.postId===post.id);

function orderClock(order,chat){return readStoryClock((chat||[]).slice(order.sourceIndex+1),{day:order.createdDay,hour:order.createdHour});}
const receiptText=m=>String(m.mes||'').replace(/```[\s\S]*?```/g,'').replace(/<(think|thinking|script|style)[^>]*>[\s\S]*?<\/\1>/gi,'');
const arrivalIds=text=>{
    const ids=[];
    for(const match of text.matchAll(/<!--\s*durian-delivery\s*:\s*([\s\S]*?)-->/g)){
        try{const receipt=JSON.parse(match[1]);
            // A delivery marker naming this order with arrived:true is the
            // receipt itself; arrival quotes are no longer required.
            if(typeof receipt.id==='string'&&receipt.arrived===true)ids.push(receipt.id);
        }catch{/* An incomplete generated marker is not a receipt. */}
    }
    return ids;
};
function deliveryReceipt(order,chat){
    let clock={day:order.createdDay,hour:order.createdHour};
    for(let i=order.sourceIndex+1;i<(chat||[]).length;i++){
        const m=chat[i];clock=readStoryClock([m],clock);if(m.is_user||(m.is_system&&!isMemoryHidden(m)))continue;
        if(clock.day<order.dueDay||clock.hour===null||clock.hour<9||clock.hour>=18)continue;
        if(arrivalIds(receiptText(m)).includes(order.id))return {index:i,date:dayDate(clock.day)};
    }
    return null;
}
// Food orders have no fixed delivery day or window: any later narrative floor
// that actually writes the arrival counts, regardless of story clock.
function foodReceipt(order,chat){
    for(let i=order.sourceIndex+1;i<(chat||[]).length;i++){
        const m=chat[i];
        if(m.is_user||(m.is_system&&!isMemoryHidden(m)))continue;
        if(arrivalIds(receiptText(m)).includes(order.id))return {index:i};
    }
    return null;
}

    async function perform(method,args,message=''){
        if(!adapter.amazon){notice('请在酒馆内使用 Amazon。');return null;}if(working||getView().busy)return null;
        const token=epoch;working=true;redraw();
        try{const r=await adapter.amazon[method](...args);if(token!==epoch)return null;status=r?.ok?message:r?.error||'请重试。';return r;}
        catch(e){if(token===epoch)status=e.message;return null;}finally{working=false;redraw();}
    }
    return {html,back(){if(tab==='shop'&&selected){selected=null;redraw();return true;}return false;},reset(){epoch++;tab='shop';selected=null;drafts={};status='';gift=null;},input(el){drafts[el.dataset.shopField]=el.value;},
        async action(action,id){
            if(action==='tab'){tab=id;selected=null;status='';gift=null;redraw();return;}
            if(action==='product'){selected=id;delete drafts.variant;drafts.quantity=1;redraw();return;}
            if(action==='back'){selected=null;redraw();return;}
            if(action==='remove')await perform('remove',[id]);
            if(action==='gift-self'){gift={step:'pay',recipientKey:'self',origin:'target',hint:''};status='';redraw();return;}
            if(action==='gift-other'){gift={step:'name',hint:''};status='';delete drafts.giftName;redraw();return;}
            if(action==='gift-back'){
                if(gift?.step==='payer')gift={...gift,step:'pay',hint:''};
                else if(gift?.step==='pay')gift={...gift,step:gift.origin||'target',hint:''};

            }
            if(action==='gift-cancel'){gift=null;status='';redraw();return;}
            if(action==='gift-pick'){gift={...(gift||{}),step:'pay',recipientKey:id,origin:'name',hint:''};status='';redraw();return;}
            if(action==='pay-self')await placeOrder(gift?.recipientKey||'self','self');
            if(action==='pay-npc'){gift={...(gift||{}),step:'payer',hint:''};status='';delete drafts.payerName;redraw();return;}
        },
        async submit(form){const v=Object.fromEntries(new FormData(form)),kind=form.dataset.shopForm;
            if(kind==='search')await perform('search',[v.query]);
            if(kind==='add')await perform('add',[selected,v.variant,Number(v.quantity)],'已加入购物车');
            if(kind==='checkout'){drafts.date=v.date;drafts.time=v.time;gift={step:'target',hint:''};status='';redraw();return;}

                await placeOrder(gift?.recipientKey||'self','npc',name);
            }
        },
    };
    async function placeOrder(key,method='self',payerName=''){
        const target=gift;gift=null;status='';redraw();
        const r=await perform('checkout',[key,drafts.date??'',drafts.time??'',method,payerName],'下单成功');
        if(r?.ok){
            // NPC 拒绝不是请求失败：回到付款方式选择，收件人与购物车原样保留。
            if(r.value?.rejected){gift={...target,step:'pay',hint:'对方拒绝了你的代付要求'};status='';redraw();return;}
            tab='orders';delete drafts.date;delete drafts.time;delete drafts.giftName;delete drafts.payerName;redraw();return;
        }
        // AI 请求失败或格式错误：显示真实错误，保留原有选择，可重试。
        gift=target?{...target,step:method==='npc'?'payer':'pay',hint:r?.error||'请重试。'}:null;redraw();
    }
    async function resolveGift(query){
        if(!adapter.amazon?.recipientMatches){notice('请在酒馆内使用 Amazon。');return;}
        if(working||getView().busy)return;
        const token=epoch;working=true;redraw();
        let matched=null;
        try{
            const r=await adapter.amazon.recipientMatches(query);
            if(token!==epoch)return;
            if(r.kind==='unique')matched=r.matches[0].key;
            else if(r.kind==='ambiguous'){gift={step:'pick',hint:'',candidates:r.matches};status='';}
            else{gift={step:'name',hint:'没有找到这个角色，请重新输入。'};status='';}
        }catch(e){if(token===epoch)status=e.message;}
        finally{working=false;}
        if(token!==epoch)return;
        if(matched!==null){gift={...(gift||{}),step:'pay',recipientKey:matched,origin:'name',hint:''};status='';}
        redraw();
    }
}

const foodText=(s,n=200)=>typeof s==='string'?s.trim().slice(0,n):'';

const FOOD_SHOP_COUNT=10,FOOD_MENU_MIN=20,FOOD_MENU_MAX=30,FOOD_CATEGORY_MIN=5,FOOD_SPECIAL_COUNT=5,FOOD_SPECIAL_DISCOUNT=20;

    if(!/^\d{1,10}(\.\d{1,4})?$/.test(amount)||Number(amount)<=0)throw Error('菜品价格格式不正确，请重新搜索。');
    return moneyMinor(amount,false,currency);

// One search returns every shop with its full menu; the program only checks
// counts, prices and obvious padding — variety itself stays a prompt contract.
// The ledger currency is the single settlement currency: with a ledger, the

// allowed but checkout waits for a ledger and a fresh search.
function validateShops(data,ledgerCurrency=null){
    const shops=data?.shops;
    if(!Array.isArray(shops)||shops.length!==FOOD_SHOP_COUNT)throw Error(`需要一次返回 ${FOOD_SHOP_COUNT} 家店铺，请重新搜索。`);
    const returned=foodText(data?.currency,20);
    if(ledgerCurrency&&returned!==ledgerCurrency)throw Error('菜单币种与账本不一致，请重新搜索。');
    const currency=ledgerCurrency||returned;
    if(!validCurrency(currency))throw Error('菜单币种无效，请重新搜索。');
    const validated=shops.map((shop,index)=>{
        const name=foodText(shop?.name,100),cuisine=foodText(shop?.cuisine,60),description=foodText(shop?.description,200);
        if(!name)throw Error('店铺信息不完整，请重新搜索。');
        const menu=Array.isArray(shop?.menu)?shop.menu:[];
        if(menu.length<FOOD_MENU_MIN||menu.length>FOOD_MENU_MAX)throw Error(`${name} 的菜单需要 ${FOOD_MENU_MIN}—${FOOD_MENU_MAX} 道菜，请重新搜索。`);
        const seen=new Set(),categories=new Set();
        const dishes=menu.map((dish,position)=>{
            const dishName=foodText(dish?.name,150),category=foodText(dish?.category,60);
            if(!dishName||!category)throw Error(`${name} 的菜品名称或分类不完整，请重新搜索。`);
            const key=dishNameKey(dishName);
            if(seen.has(key))throw Error(`${name} 存在重复菜品，请重新搜索。`);
            seen.add(key);categories.add(dishNameKey(category));
            return {id:`foodShop:${index}#${position}`,name:dishName,category,description:foodText(dish?.description,200),priceMinor:dishPrice(dish?.price,currency)};
        });
        if(categories.size<FOOD_CATEGORY_MIN)throw Error(`${name} 的菜单至少需要 ${FOOD_CATEGORY_MIN} 个有区别的品类，请重新搜索。`);
        return {id:`foodShop:${index}`,type:'foodShop',name,cuisine,description,currency,menu:dishes};
    });
    return applyDailySpecials(validated);
}
function applyDailySpecials(shops){
    for(const shop of shops)for(const dish of shop.menu||[]){
        if(dish.specialDiscount&&Number.isSafeInteger(dish.originalPriceMinor)){
            dish.priceMinor=dish.originalPriceMinor;
            delete dish.originalPriceMinor;
            delete dish.specialDiscount;
        }
    }
    for(let i=0;i<FOOD_SPECIAL_COUNT;i++){
        const shop=shops[Math.floor(i*shops.length/FOOD_SPECIAL_COUNT)];
        const dish=shop.menu[Math.min(2+i*3,shop.menu.length-1)];
        const originalPriceMinor=dish.priceMinor;
        dish.originalPriceMinor=originalPriceMinor;
        dish.priceMinor=Math.max(1,Math.floor(originalPriceMinor*(100-FOOD_SPECIAL_DISCOUNT)/100));
        dish.specialDiscount=FOOD_SPECIAL_DISCOUNT;
    }
    return shops;
}
function createFood({memory,phone,getContext,getSettings,paymentRequest}){
    const run=work=>phone.appTask(async(view,current,request)=>{
        const ticket=await memory.begin(view);
        const commit=async changes=>{if(!current())throw Error('聊天已变化，请重试。');await memory.commit(ticket,changes);};
        return work(view.state,current,request,commit);
    },'food');
    const foodSet=value=>({collection:'orders',key:value.id,value});
    // Selections live in one cart record; lines are snapshots, so later
    // searches never rewrite the price of something already picked.
    function changesFor(state,shopId,dishId,quantity,mode){
        if(typeof shopId!=='string'||typeof dishId!=='string')throw Error('菜品已更新，请重新选择。');
        const shop=state.orders[shopId];
        if(shop?.type!=='foodShop')throw Error('店铺已更新，请重新搜索。');
        const dish=shop.menu.find(d=>d.id===dishId);
        if(!dish)throw Error('菜品已更新，请重新选择。');
        const cart=state.orders.foodCart??{id:'foodCart',type:'foodCart',items:[]};
        const items=structuredClone(cart.items||[]);
        const line=items.find(i=>i.dishId===dishId);
        const next=mode==='add'?((line?.quantity??0)+quantity):quantity;
        if(!Number.isInteger(next)||next<0||next>99)throw Error('数量需为 0—99。');
        if(next===0){const index=items.findIndex(i=>i.dishId===dishId);if(index>=0)items.splice(index,1);}
        else if(line)line.quantity=next;
        else items.push({dishId,shopId,shopName:shop.name,cuisine:shop.cuisine,name:dish.name,category:dish.category,priceMinor:dish.priceMinor,currency:shop.currency,quantity:next,...(dish.specialDiscount?{originalPriceMinor:dish.originalPriceMinor,specialDiscount:dish.specialDiscount}:{})});
        return [foodSet({...cart,items})];
    }
    return {
        async open(){
            const view=await memory.read();
            const shops=foodItems(view.state,'foodShop');
            const count=shops.reduce((n,shop)=>n+(shop.menu||[]).filter(d=>d.specialDiscount).length,0);
            if(shops.length&&count!==FOOD_SPECIAL_COUNT){
                const migrated=applyDailySpecials(shops.map(shop=>structuredClone(shop)));
                const ticket=await memory.begin(view);
                await memory.commit(ticket,migrated.map(foodSet));
                return memory.read();
            }
            return view;
        },
        search(query){return run(async(state,current,request,commit)=>{
            const q=foodText(query,300);if(!q)throw Error('请输入想吃的菜系或菜品。');
            const currency=walletCurrency(state);
            const economy={currency,persona:!currency?getContext().powerUserSettings?.persona_description:undefined};
            const prompt=getSettings().prompts.general+'\n'+getSettings().prompts.food+'\n'+getSettings().prompts.foodShopping+
                '\n当前任务：榴莲外卖店铺搜索。'+(currency?'返回结果的 currency 字段必须是 '+currency+'，所有菜品一律按 '+currency+' 定价，不做汇率换算。':'尚未建立账本，请按剧情所在地和人物背景确定一个合理币种，写入返回结果的 currency 字段；结算前需要先建立账本并重新搜索。')+'想吃的东西：'+JSON.stringify(q)+'。当前资料：'+JSON.stringify(economy)+'。'+
                '\n一次性返回 '+FOOD_SHOP_COUNT+' 家符合当前世界观、地域、年代的店铺，每家 '+FOOD_MENU_MIN+'—'+FOOD_MENU_MAX+' 道独立菜品，每家覆盖至少 '+FOOD_CATEGORY_MIN+' 个有实际区别的品类；不能用同一种菜的口味、配料或烹饪变化凑数量；同一家店内菜品名称不得重复。每家店有各自的经营特色、菜系和价格档次，符合人物消费水平。菜单描述保持简短，不写买家评价。'+
                '\n只输出 JSON：{"currency":"三位货币代码","shops":[{"name":"店铺名称","cuisine":"菜系","description":"一句话简介","menu":[{"name":"菜品名称","category":"品类","description":"简短介绍","price":"数字价格"}]}]}。输出必须完整包含全部店铺和菜单，不要省略任何一家。不返回 user 已下单或付款等结论，不替 user 决定。';
            const shops=await request(prompt,data=>validateShops(data,currency),current,null,{retries:0,maxTokens:32768});
            const changes=[...foodItems(state,'foodShop').map(s=>({collection:'orders',key:s.id,value:null})),...foodItems(state,'foodCart').map(c=>({collection:'orders',key:c.id,value:null}))];
            changes.push(...shops.map(foodSet),foodSet({id:'foodSearch',type:'foodSearch',query:q,currency:shops[0]?.currency??currency}));
            await commit(changes);
        });},
        add(shopId,dishId,quantity=1){return run(async(state,_c,_r,commit)=>{await commit(changesFor(state,shopId,dishId,Number(quantity)||0,'add'));});},
        update(shopId,dishId,quantity){return run(async(state,_c,_r,commit)=>{await commit(changesFor(state,shopId,dishId,Number(quantity)||0,'set'));});},
        checkout(shopId,recipient='self',name='',paymentMethod='self',payerName=''){return run(async(state,current,request,commit)=>{
            const lines=(state.orders.foodCart?.items||[]).filter(i=>i.shopId===shopId);
            if(!lines.length)throw Error('还没有选择菜品，先挑几样想吃的吧。');
            if(paymentMethod!=='self'&&paymentMethod!=='npc')throw Error('付款方式不正确，请重新选择。');
            const npcPay=paymentMethod==='npc';
            const payer=npcPay?foodText(payerName,80):'';
            if(npcPay&&!payer)throw Error('请填写代付角色的名字。');
            const currency=walletCurrency(state);
            if(!currency)throw Error('请先在小榴莲点击「一键更新」建立账本，再重新搜索外卖。');
            if(state.orders.foodSearch?.currency!==currency)throw Error('菜单币种与账本不一致，请先重新搜索外卖再结算。');
            const context=getContext(),clock=readStoryClock(context.chat);
            if(clock.day===null)throw Error('无法确定当前剧情日期，请先在正文中写明日期再下单。');
            const self=recipient!=='other';
            const receiver=self?{id:'self',name:context.name1||'user'}:{id:'other',name:foodText(name,80)};
            if(!self&&!receiver.name)throw Error('请填写收件人的名字。');
            const totals=Object.create(null);
            for(const i of lines)totals[i.currency]=(totals[i.currency]||0)+i.priceMinor*i.quantity;
            if(Object.values(totals).some(n=>!Number.isSafeInteger(n)))throw Error('订单金额过大，请减少数量。');
            if(Object.keys(totals).some(c=>c!==currency))throw Error('菜单币种与账本不一致，请先重新搜索外卖再结算。');
            const total=totals[currency];
            const id=crypto.randomUUID(),shop=state.orders[shopId];
            if(npcPay){
                // 收件人与付款人相互独立：由 AI 判断被点名的 NPC 是否愿意代付。
                const answer=await paymentRequest.judge({request,current,app:'food',npc:payer,totalMinor:total,currency,items:lines.map(({name,quantity})=>({name,quantity})),recipientName:receiver.name});
                if(!current())throw Error('剧情或设置已变化，本次下单已取消。');
                if(!answer.accept)return {rejected:true};
            } else {
                try{requireCash(state,total,currency);}
                catch(error){
                    if(/余额不足/.test(error.message))throw Error('支付失败，余额不足。');
                    throw error;
                }
            }
            await commit([foodSet({id,type:'foodOrder',shopId,shopName:shop?.name||lines[0].shopName,cuisine:shop?.cuisine||lines[0].cuisine||'',items:lines.map(i=>({dishId:i.dishId,name:i.name,category:i.category,priceMinor:i.priceMinor,currency:i.currency,quantity:i.quantity,...(i.specialDiscount?{originalPriceMinor:i.originalPriceMinor,specialDiscount:i.specialDiscount}:{})})),totals,recipient:receiver,createdDay:clock.day,createdHour:clock.hour,sourceIndex:context.chat.length-1,createdAt:Date.now(),paymentMethod:npcPay?'npc':'self',payerName:payer,paymentStatus:'paid'}),
                foodSet({id:'foodCart',type:'foodCart',items:(state.orders.foodCart?.items||[]).filter(i=>i.shopId!==shopId)}),
                ...(npcPay?[]:[assetSet(cashRecord('foodOrder:'+id,-total,'榴莲外卖 · '+(shop?.name||lines[0].shopName),{currency,source:'food',orderId:id,day:clock.day}))])]);
            return {id};
        });},
    };
}

    async function perform(method, args, message = '') {
        if (!adapter.food) { notice('请在酒馆内使用榴莲外卖。'); return null; }
        if (working || getView().busy) return null;
        const token = epoch; working = true; redraw();
        try {
            const result = await adapter.food[method](...args);
            if (token !== epoch) return null;
            status = result?.ok ? message : result?.error || '请重试。';
            return result;
        } catch (error) {
            if (token === epoch) status = error.message;
            return null;
        } finally {
            working = false;
            redraw();
        }
    }

    async function placeOrder(key, method = 'self', payerName = '') {
        const target = buy;
        const recipientName = key === 'other' ? (drafts.foodName ?? '') : '';
        buy = null; status = ''; redraw();
        const result = await perform('checkout', [selectedShop, key, recipientName, method, payerName], '下单成功');
        if (result?.ok) {
            if (result.value?.rejected) { buy = { ...target, step: 'pay', hint: '对方拒绝了你的代付要求' }; status = ''; redraw(); return; }
            tab = 'orders'; selectedShop = null; category = 'all'; delete drafts.foodName; delete drafts.payerName; redraw(); return;
        }
        buy = target ? { ...target, step: method === 'npc' ? 'payer' : 'pay', hint: result?.error || '请重试。' } : null;
        redraw();
    }

    return {
        html,
        back() { if (tab === 'home' && selectedShop) { selectedShop = null; category = 'all'; buy = null; redraw(); return true; } return false; },
        reset() { epoch++; tab = 'home'; selectedShop = null; category = 'all'; drafts = {}; status = ''; buy = null; },
        input(el) { drafts[el.dataset.foodField] = el.value; },
        async action(action, id, shopId) {
            if (action === 'tab') { if (!['home', 'orders'].includes(id)) return; tab = id; selectedShop = null; category = 'all'; status = ''; buy = null; redraw(); return; }
            if (action === 'shop') { selectedShop = id; category = 'all'; status = ''; buy = null; redraw(); return; }
            if (action === 'special-add') { await perform('add', [shopId, id, 1], '已加入购物车'); return; }
            if (action === 'back') { selectedShop = null; category = 'all'; buy = null; redraw(); return; }
            if (action === 'category') { category = id || 'all'; redraw(); return; }
            if (action === 'inc') await perform('add', [selectedShop, id, 1]);
            if (action === 'dec') {
                const line = lineOf(getView(), id);
                await perform('update', [selectedShop, id, Math.max(0, (line?.quantity || 1) - 1)]);
            }
            if (action === 'buy') {
                if (!shopLines(getView(), selectedShop).length) { status = '还没有选择菜品，先挑几样想吃的吧。'; redraw(); return; }
                buy = { step: 'target', hint: '' }; status = ''; redraw(); return;
            }
            if (action === 'gift-self') { buy = { step: 'pay', recipientKey: 'self', origin: 'target', hint: '' }; status = ''; redraw(); return; }
            if (action === 'gift-other') { buy = { step: 'name', hint: '' }; status = ''; delete drafts.foodName; redraw(); return; }
            if (action === 'gift-back') {
                if (buy?.step === 'payer') buy = { ...buy, step: 'pay', hint: '' };
                else if (buy?.step === 'pay') buy = { ...buy, step: buy.origin || 'target', hint: '' };
                else { buy = { step: buy?.step === 'name' ? 'target' : 'name', hint: '' }; if (buy.step === 'name') delete drafts.foodName; }
                redraw(); return;
            }
            if (action === 'gift-cancel') { buy = null; status = ''; redraw(); return; }
            if (action === 'pay-self') await placeOrder(buy?.recipientKey || 'self', 'self');
            if (action === 'pay-npc') { buy = { ...(buy || {}), step: 'payer', hint: '' }; status = ''; delete drafts.payerName; redraw(); }
        },
        async submit(form) {
            const values = Object.fromEntries(new FormData(form));
            const kind = form.dataset.foodForm;
            if (kind === 'search') await perform('search', [values.query]);
            if (kind === 'gift-name') {
                if (!String(values.foodName || '').trim()) { buy = { step: 'name', hint: '请填写收件人的名字。' }; status = ''; redraw(); return; }
                buy = { ...(buy || {}), step: 'pay', recipientKey: 'other', origin: 'name', hint: '' }; status = ''; redraw();
            }
            if (kind === 'payer-name') {
                const name = String(values.payerName || '').trim();
                if (!name) { buy = { ...(buy || {}), step: 'payer', hint: '请填写代付角色的名字。' }; status = ''; redraw(); return; }
                await placeOrder(buy?.recipientKey || 'self', 'npc', name);
            }
        }
    };
}


const assetRows = (state, type) => Object.values(state.assets || {}).filter(x => x.type === type);
const assetSet = value => ({ collection: 'assets', key: value.id, value });

const assetText = (s, max = 180) => typeof s === 'string' ? s.trim().slice(0, max) : '';
function moneyMinor(value, signed = false, currency = 'USD') {
    const digits = currencyDigits(currency);
    const match = /^(-?)(\d{1,12})(?:\.(\d+))?$/.exec(String(value));
    if (!match || (!signed && match[1]) || (match[3] || '').replace(/0+$/,'').length > digits) throw Error('账本金额格式不正确。');
    const n = (match[1] ? -1 : 1) * (Number(match[2]) * unitScale(currency) + Number((match[3] || '').slice(0,digits).padEnd(digits,'0')));
    if (!Number.isSafeInteger(n)) throw Error('账本金额超出范围。');
    return n;
}
function cashBalance(state) {
    const wallet = state.assets?.wallet;
    if (!wallet) return null;
    const ignored = new Set(wallet.included || []);
    const amount = assetRows(state, 'cash_transaction').filter(t => t.currency === walletCurrency(state) && !ignored.has(t.id))
        .reduce((sum, t) => sum + t.deltaMinor, wallet.openingMinor);
    if (!Number.isSafeInteger(amount)) throw Error('账本金额超出范围。');
    return amount;
}
function reservedCash(state, except = '') {
    return ['snapchat','whatsapp','wechat'].flatMap(app=>Object.values(state[app] || {})).filter(t => t.type === 'transfer' && t.direction === 'outgoing' && t.status === 'pending' && t.currency === walletCurrency(state) && t.id !== except)
        .reduce((sum, t) => sum + t.amountMinor, 0);
}
function requireCash(state, minor, currency = walletCurrency(state), except = '') {
    if (walletCurrency(state) && currency !== walletCurrency(state)) throw Error('请使用账本货币 '+walletCurrency(state)+'。');
    const balance = cashBalance(state);
    if (balance === null) throw Error('请先在小榴莲点击「一键更新」建立账本。');
    if (assetRows(state, 'story_event').some(e => e.kind === 'expense' && !e.processed)) throw Error('还有待结算的支出，请先在小榴莲点击「一键更新」。');
    if (balance - reservedCash(state, except) < minor) throw Error('可用余额不足。');
}
function cashRecord(id, deltaMinor, memo, fields = {}) {
    if (!validCurrency(fields.currency)) throw Error('流水缺少有效币种。');
    if (!Number.isSafeInteger(deltaMinor)) throw Error('账本金额超出范围。');
    return { id, type: 'cash_transaction', deltaMinor, memo: assetText(memo), createdAt: Date.now(), ...fields };
}

// Payday covers [previous month's 15th, this month's 15th). Partial employment
// earns the corresponding fraction; all calculations use fictional UTC dates.
function salaryPayments(state, throughDay) {
    const wallet = state.assets?.wallet;
    if (!wallet || !Number.isInteger(throughDay) || throughDay < wallet.startDay) return [];
    const changes = [];
    const first = new Date(wallet.startDay * 86400000);
    let year = first.getUTCFullYear(), month = first.getUTCMonth();
    const end = new Date(throughDay * 86400000);
    for (; year < end.getUTCFullYear() || year === end.getUTCFullYear() && month <= end.getUTCMonth(); month++) {
        if (month === 12) { year++; month = 0; }
        const due = dateDay(`${year}-${String(month + 1).padStart(2, '0')}-15`);
        if (due > throughDay) break;
        if (due <= wallet.startDay) continue;
        const prevYear = month === 0 ? year - 1 : year, prevMonth = month === 0 ? 12 : month;
        const from = dateDay(`${prevYear}-${String(prevMonth).padStart(2, '0')}-15`);
        const groups = new Map();
        for (const job of assetRows(state, 'job')) {
            if (job.monthlyMinor === null || job.monthlyMinor === undefined) continue;
            const days = Math.max(0, Math.min(due, job.endDay ?? due) - Math.max(from, job.startDay, wallet.startDay));
            if (!days) continue;
            const group = groups.get(job.employer) || { amount: 0, name: job.name };
            group.amount += job.monthlyMinor * days / (due - from);
            groups.set(job.employer, group);
        }
        for (const [employer, group] of groups) {
            const id = 'salary:' + employer + ':' + dayDate(due);
            const explicit = assetRows(state, 'cash_transaction').filter(t => t.currency === walletCurrency(state) && t.salaryEmployer === employer && t.payDate === dayDate(due) && t.id !== id)
                .reduce((sum, t) => sum + Math.max(0, t.deltaMinor), 0);
            const amount = Math.max(0, Math.round(group.amount) - explicit);
            if (!state.assets[id]) changes.push(assetSet(cashRecord(id, amount, group.name + ' · ' + dayDate(due) + ' 工资', { currency:walletCurrency(state), source: 'salary', salaryEmployer: employer, payDate: dayDate(due), day: due })));
        }
    }
    return changes;
}

function recentCash(state) {
    return assetRows(state, 'cash_transaction').map((t, index) => ({ t, index })).filter(({ t }) => t.deltaMinor !== 0)
        .sort((a, b) => (b.t.createdAt || 0) - (a.t.createdAt || 0) || b.index - a.index).slice(0, 6).map(({ t }) => t);
}
function debtEpisode(state) {
    if (cashBalance(state) === null) return null;
    const wallet = state.assets.wallet, ignored = new Set(wallet.included || []);
    let balance = wallet.openingMinor, id = balance < 0 ? 'debt:opening' : null;
    for (const t of assetRows(state, 'cash_transaction').filter(t => t.currency === walletCurrency(state) && !ignored.has(t.id))) {
        const prior = balance; balance += t.deltaMinor;
        if (balance >= 0) id = null;
        else if (prior >= 0) id = 'debt:' + t.id;
    }
    return id;
}

// One boundary for narrative capture and manual assessment; no occupation rules.

const ASSET_ITEM_RULES = '实物财产按独立物品登记：一件物品一个条目、一个名称、一个单独估值；一双鞋/一副眼镜等自然成对物品算一件。手袋、鞋、香水、礼服即使同店同单购买也必须分开，不写“手袋与其余两只手袋”“太阳镜及高跟鞋与香水”等合并名称，不用一笔总估值代表不同物品。正文明确有多个同类物品时分别列条目，可用原文颜色/款式区分；未给细节用编号区分，不编造型号材质。只提购物袋且未说明内容的，不据袋数虚构物品。'

const normalize = value => String(value ?? '').normalize('NFKC')
    .replace(/&(?:quot|#34);/g, '"').replace(/&(?:apos|#39);/g, "'").replace(/&amp;/g, '&').replace(/&(?:nbsp|#160);/g, ' ')
    .replace(/<[^>]*>/g, '').replace(/[\s*_`“”‘’"']/g, '');

// Presentation normalization only. Ellipses may join substantial, ordered
// verbatim excerpts; every excerpt must still exist in the same source floor.
function financialEvidenceMatches(prose, evidence) {
    if (typeof evidence !== 'string') return false;
    const source = normalize(prose), quote = normalize(evidence);
    if (quote.length < 4) return false;
    if (source.includes(quote)) return true;
    const parts = quote.split(/(?:\.{3,}|…+|⋯+)/u);
    if (parts.length < 2 || parts.some(p => p.length < 8) || parts.join('').length < 24) return false;
    let cursor = 0;
    for (const part of parts) {
        const at = source.indexOf(part, cursor);
        if (at < 0) return false;
        cursor = at + part.length;
    }
    return true;
}


// One migration audit for ledgers settled before ownership recovery existed.
// This is NOT permission to reroll money, prices or the settlement period.
const needsOwnershipRecovery = wallet => !!wallet && wallet.ownershipAuditVersion !== 1;
function ownershipRecoveryProse(state, chat) {
    if (!needsOwnershipRecovery(state.assets?.wallet)) return [];
    let clock = { day: null, hour: null };
    return chat.map((m, index) => {
        clock = readStoryClock([m], clock);
        return { index, day: clock.day, text: String(m.mes || '').replace(/<(think|thinking|script|style)[^>]*>[\s\S]*?<\/\1>/gi, '').replace(/<!--[\s\S]*?-->/g, '') };
    }).filter(p => p.index <= state.assets.wallet.lastIndex && !chat[p.index].is_user &&
        (!chat[p.index].is_system || isMemoryHidden(chat[p.index])) && p.day !== null && p.day >= state.assets.wallet.startDay).slice(-20);
}

const OWNERSHIP_RECOVERY_RULES = '本次还需一次性检查酒馆当前可见剧情中对应ownershipRecoveryFloors的旧版已结算事实，仅补登记漏掉的user实物财产。返回recoveredAssets数组（确无遗漏返回[]），每条为{sourceIndex:原楼层index,name:具体物品名,category:"fixed或luxury",owner:"user",amount:null,marketValue:合理正常市价或null,details:已知规格及取得方式}。'
    + '只登记已经买到/获赠且当前仍属于user的财产，付款人可以是别人；试穿、试背、想买、计划、他人物品、回忆旧物、无法确定内容的购物袋不算。逐项对照ownershipRecoveryHoldings全部记录（含已出售/排除条目），同一物品即使换了名称也不得再登；整套和单件不能重复，已有笼统收藏不得遮蔽明确后续新取得的物品。'
    + '旧楼仅恢复财产所有权，不补记现金、不重算旧生活费/工资/投资收益、不修改或重新估价已有财产，不回溯新增投资权益。旧楼提到的收支不能放入events绕过限制。不要续写剧情或补写正文注释。' + ASSET_CATEGORY_RULES + ASSET_ITEM_RULES;

const nameKey = name => assetText(name).normalize('NFKC').replace(/\s+/g, '').toLowerCase();
function applyOwnershipRecovery(original, data, chat) {
    if (!needsOwnershipRecovery(original.assets?.wallet)) {
        if (data.recoveredAssets?.length) throw Error('旧账物品补查已完成，不重复补登记。');
        return [];
    }
    if (!Array.isArray(data.recoveredAssets) || data.recoveredAssets.length > 100) throw Error('缺少旧账物品核对结果 recoveredAssets，未更改账本。');
    const prose = ownershipRecoveryProse(original, chat), state = structuredClone(original), changes = [];
    const names = new Set(assetRows(state, 'holding').map(h => nameKey(h.name)));
    const add = rows => { changes.push(...rows); applyAssetChanges(state, rows); };
    for (const raw of data.recoveredAssets) {
        const source = prose.find(p => p.index === raw.sourceIndex);
        if (!source) throw Error('旧账补登记缺少有效的原楼层 sourceIndex。');
        if (raw.owner !== 'user' || !['fixed', 'luxury'].includes(raw.category) || raw.amount != null ||
            (raw.kind && raw.kind !== 'asset') || (raw.action && raw.action !== 'acquire') || raw.holdingId || raw.id)
            throw Error('旧账补查只能新增user实物财产，不能登记现金、投资或改写旧资产。');
        const name = nameKey(raw.name);
        if (!name) throw Error('补登记物品缺少名称。');
        if (names.has(name)) continue;
        const id = 'recovered:' + source.index + ':' + name;
        if (state.assets[id]) continue;
        const event = validateFinancialEvent({ ...raw, kind: 'asset', action: 'acquire', amount: null, date: undefined }, id, source.index, source.day,walletCurrency(state));
        add(applyFinancialEvent(state, event)); names.add(name);
    }
    add([assetSet({ ...state.assets.wallet, ownershipAuditVersion: 1 })]);
    return changes;
}

function applyOwnershipRepair(original, data, chat) {
    // The same-floor upgrade audit cannot execute any settlement operations.
    if (data.initial != null || ['events','valuations','ownership','classifications','salaries','business'].some(k => data[k] != null && (!Array.isArray(data[k]) || data[k].length)) ||
        data.living && (data.living.total !== 0 || (data.living.bookedIds?.length ?? 0) !== 0))
        throw Error('本轮仅补查遗漏物品，不允许重新结算收支或估价旧财产。');
    return applyOwnershipRecovery(original, data, chat);
}

        if(action==='read'){if(expanded.has(id))expanded.delete(id);else expanded.add(id);redraw();return;}
        if(action==='delete-archive'){
            if(!folder||working||getView().busy)return;
            if(!adapter.daily?.deleteArchive){notice('请在酒馆中管理报纸夹。');return;}
            const token=epoch;working=true;status='';redraw();
            try{
                const result=await adapter.daily.deleteArchive(id);
                if(token===epoch){
                    if(result?.ok){archiveId=null;expanded.clear();status='这期报纸已删除';}

                }
            }catch(error){if(token===epoch)status=error.message;}
            finally{if(token===epoch){working=false;redraw();}}

        }
        if(folder||!['update','inject'].includes(action)||working||getView().busy)return;
        if(!adapter.daily){notice('请在酒馆中取阅日报。');return;}
        const token=epoch;working=true;status='';redraw();
        try{const result=await (action==='update'?adapter.daily.update():adapter.daily.toggle(id));if(token===epoch){status=result?.ok?(action==='update'?'本期已更新':''):result?.error||'本次未完成，请重试。';if(result?.ok&&action==='update')expanded.clear();}}
        catch(e){if(token===epoch)status=e.message;}
        finally{if(token===epoch)working=false;redraw();}
    }};
    return api;
}

// Shared story location and the local random weather engine. The narrative AI
// only tags city changes; every weather value here is sampled locally.

const WEATHER_LOCATION_RULE = '仅当本楼 user 首次明确当前城市，或已实际进入另一城市时，在正文末尾附 <!--durian-location:{"city":"城市名称"}-->。未换城市不标记；仅提及、计划前往或他人抵达不算。';

const norm = value => String(value ?? '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
const normCity = city => norm(city);

 // Common Los Angeles labels need one shared real-city classification for
 // weather and newspaper history, without accepting arbitrary partial matches.
const knownCityKey = value => {
    const raw = String(value ?? '').normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const latin = raw.replace(/[,，.()（）]/g, ' ').replace(/\s+/g, ' ').trim();
    if (/^(?:city of )?los angeles(?:(?: city| ca| california| usa| us| united states| of america))*$/.test(latin))
        return normCity('los angeles');
    const chinese = raw.replace(/[\s,，()（）]/g, '');
    if (/^(?:(?:美国|美國)(?:加州|加利福尼亚州|加利福尼亞州)?)?(?:洛杉矶|洛杉磯)(?:(?:市|加州|加利福尼亚州|加利福尼亞州|美国|美國))*$/.test(chinese))
        return normCity('洛杉矶');
    return normCity(value);
};

// The marker carries only a city name, so the location kind is decided locally:
// a known real city is real unless the world declares itself fictional (an
// explicit fictional marker beside the city name or a world-level declaration),
// a city named in the world setting is fictional, and anything else stays
// unconfirmed — never silently borrowing a same-named real city's climate.
function locationKind(city, context) {
    const name = knownCityKey(city);
    if (!name) return 'unconfirmed';
    const material = typeof context === 'object' && context ? worldMaterial(context) : [];
    if (CITY_TABLE[name]) {
        const nearCity = material.some(text => text.includes(city) && /架空|虚构|异世界/.test(text));
        const worldDeclared = /架空世界|异世界|平行世界|另一个世界/.test(material.join('\n'));
        return nearCity || worldDeclared ? 'fictional' : 'real';
    }
    return material.some(text => text.includes(city)) ? 'fictional' : 'unconfirmed';
}
function worldMaterial(context) {
    return establishedSources(context || {}).map(source => String(source.text || '')).filter(Boolean);
}
// Worldbook climate settings beat the local draw: descriptors that appear in
// world material naming the city map onto a climate archetype. Missing or too
// vague settings return null and fall back to the derived profile.
const CLIMATE_HINTS = [
    ['af', ['热带', '全年炎热', '酷暑', '湿热']],
    ['am', ['季风', '雨季漫长']],
    ['aw', ['干湿分明', '稀树草原']],
    ['bwh', ['沙漠', '干旱', '少雨', '荒漠']],
    ['bsh', ['半干旱']],
    ['csa', ['地中海']],
    ['cfa', ['副热带', '湿润', '梅雨']],
    ['cfb', ['温带海洋', '四季如春', '温和湿润']],
    ['dfa', ['大陆性湿润']],
    ['dfb', ['大陆性', '漫长冬季', '严寒']],
    ['dwa', ['干燥冬季', '季风性温带']],
    ['et', ['极地', '苔原', '冰原']],
    ['h', ['高原', '山地气候']],
];
function worldClimate(city, context) {
    const material = worldMaterial(context).filter(text => text.includes(city));
    if (!material.length) return null;
    const text = material.join('\n');
    let best = null;
    for (const [archetype, hints] of CLIMATE_HINTS) {
        const score = hints.reduce((total, hint) => total + text.split(hint).length - 1, 0);
        if (score > 0 && (!best || score > best.score)) best = { archetype, score };
    }
    return best ? { archetype: best.archetype, offset: 0, south: false, fromWorld: true } : null;
}

const hash32 = text => { let h = 2166136261; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const mulberry32 = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rngAt = (seed, key, hour) => mulberry32(hash32(seed + '|' + key + '|' + hour));
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

// City tags are hidden markers; no evidence field is required or accepted.
function locationAnnotations(message) {
    if (message?.is_user || (message?.is_system && !isMemoryHidden(message))) return [];
    const text = String(message?.mes || '').replace(/```[\s\S]*?```/g, '').replace(/<(think|thinking|analysis|script|style)[^>]*>[\s\S]*?<\/\1>/gi, '');
    const rows = [];
    for (const match of text.matchAll(/<!--\s*durian-location\s*:\s*([\s\S]*?)-->/g)) {
        try {
            const row = JSON.parse(match[1]);
            const city = typeof row?.city === 'string' ? row.city.trim() : '';
            if (city && city.length <= 60 && !/[\r\n<>]/.test(city)) rows.push({ city });
        } catch { /* an incomplete marker never moves the location */ }
    }
    return rows;
}

// The single authoritative location record: one journal event per narrative
// city change, so floor rollback restores the previous city automatically.
function importStoryLocation(raw, revisions, chat, context) {
    let journal = raw, state = replayJournal(raw), changed = false;
    for (let index = 0; index < chat.length; index++) {
        if (!effectiveReply(chat[index])) continue;
        const id = 'story-location:' + revisions[index];
        if (journal?.events.some(event => event.id === id)) continue;
        const row = locationAnnotations(chat[index]).at(-1);
        if (!row) continue;
        const current = state.location?.current;
        if (current && norm(current.city) === norm(row.city)) continue;
        journal = appendChange(journal, revisions.slice(0, index + 1), [{ collection: 'location', key: 'current', value: { city: row.city, sourceIndex: index } }], id);
        state = replayJournal(journal);
        changed = true;
    }
    // Shared importer contract: {journal, changed}, like every other importer.
    return { journal, changed };
}
