const RESIDENCE_RULE = '根据 user 人设及当前酒馆上下文里 user 长期居住、定居、工作学习和日常生活的环境，确定常住地区和当地通货。首次地区判断依据人设、可见剧情与近期正式摘要。明确的当前生活环境优先于过时设定。没有准确的国家或城市名称时，允许结合人物姓名、生活方式、学校与工作制度、社会文化及日常环境智能推断。例如人物普遍使用中国名字，整体生活环境也明显符合中国，即使没有写出中国或具体中国城市名，也可判断为中国；其他国家和地区同理。不能仅因为正文使用中文就判断为中国；明确的国外生活背景优先于姓名线索。旅游、出差或他人所在地不等于user常住地。返回residence:{region:两位地区代码,currency:当地三位货币代码,place:判断出的国家或地区或城市,inferred:是否基于环境推断}。place允许填写推断出的真实地区，可以只确定国家或地区，不必编造具体城市；place不能填语言名称。综合资料仍无法合理判断时返回residence:null，不按正文语言默认币种。';
function resolveResidence(value, persona, prose, { allowInference = false } = {}) {
    void persona; void prose; void allowInference; // Judgement inputs only; quotes are no longer verified.
    if (value == null) return null;
    const region=String(value.region||'').trim().toUpperCase(), currency=String(value.currency||'').trim().toUpperCase();
    if (!Object.hasOwn(territories,currency) || !region || !territories[currency].split(' ').includes(region))
        throw Error('常住地区与当地币种不匹配，本次未保存。');
    if (/^(?:中文|汉语|日语|英语|普通话|Chinese|Japanese|English)$/i.test(String(value.place||'').trim()))
        throw Error('place 不能是语言名称，请填写国家、地区或城市。');
    return {region,currency};
}
const walletCurrency = state => state.assets?.wallet ? state.assets.wallet.currency || 'USD' : null;
const validCurrency = code => Object.hasOwn(territories,code);
function currencyDigits(code) {
    return new Intl.NumberFormat('en',{style:'currency',currency:code}).resolvedOptions().maximumFractionDigits;
}
const unitScale = code => 10 ** currencyDigits(code);
const majorAmount = (minor,code) => minor/unitScale(code);
function formatMoney(minor,code) {
    if (!code) return '—';
    return new Intl.NumberFormat('zh-CN',{style:'currency',currencyDisplay:'narrowSymbol',currency:code}).format(majorAmount(minor,code));
}

// Only an invalidation marker, not another stored copy of the persona.
function personaStamp(persona='') {
    let hash=2166136261;
    for (let i=0;i<persona.length;i++) hash=Math.imul(hash^persona.charCodeAt(i),16777619);
    return (hash>>>0).toString(36);
}

// Read scene timestamps locally. No wall-clock fallback and no model calls.
function dateDay(value) {
    const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
    const d=new Date(0);d.setUTCFullYear(+m[1],+m[2]-1,+m[3]);d.setUTCHours(0,0,0,0);
    return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]?Math.floor(d.getTime()/86400000):null;
}
const dayDate = day => Number.isInteger(day)?new Date(day*86400000).toISOString().slice(0,10):'';
// SDC is explicit scene metadata, even when a preset wraps prose in a code
// fence. Read it before stripping presentation wrappers; never use wall time.
function lastSDC(source) {
    let result=null;
    for(const match of source.matchAll(/<!--\s*SDC-(?:start|end)\s*\|([\s\S]*?)-->/gi)) {
        const fields={};let duplicate=false;
        for(const part of match[1].split('|')) {
            const field=part.match(/^\s*(date|time)\s*=\s*(.*?)\s*$/i);
            if(!field)continue;
            const key=field[1].toLowerCase();if(key in fields)duplicate=true;fields[key]=field[2];
        }
        const date=fields.date?.match(/^(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?$/);
        const time=fields.time?.match(/^(\d{1,2}):(\d{2})$/);
        if(duplicate||!date||!time||+time[1]>23||+time[2]>59)continue;
        const day=dateDay(`${date[1]}-${date[2].padStart(2,'0')}-${date[3].padStart(2,'0')}`);
        if(day!==null)result={day,hour:+time[1]+time[2]/60};
    }
    return result;
}
function readStoryClock(chat, seed=null, { exact = false } = {}) {
    let day=seed?.day??null,hour=seed?.hour??null;
    for(const m of chat||[]){
        if(!m||m.role==='system'||m.isPhoneMessage||m.is_system&&!m.extra?.qianqianjieAutoHide)continue;
        const source=String(m.mes??m.content??'').replace(/<(script|style|think|thinking|analysis)\b[^>]*>[\s\S]*?(?:<\/\1\s*>|$)/gi,'');
        const sdc=!m.is_user&&m.role!=='user'?lastSDC(source):null;
        if(sdc){day=sdc.day;hour=sdc.hour;continue;}
        const text=source.replace(/```[\s\S]*?```/g,'').replace(/<!--[\s\S]*?-->/g,'').replace(/<[^>]*>/g,'\n');
        const lines=text.split('\n').map(s=>s.replace(/^[\s*#|]+|[\s*|]+$/g,'')).filter(Boolean);
        for(const rawLine of lines){
            let line=rawLine.replace(/^[【\[]\s*/, '').replace(/\s*[】\]]$/, '');
            let t=line.match(/^(?:(?:当前|剧情|故事)?(?:日期|时间)|Date|Time|Scene time)?\s*[:：]?\s*(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?:\s|$|[T,，|])/i);
            // A scene status can summarize a time jump. Only accept an explicit
            // opening date range, never arbitrary later dates in narrative prose.
            if(t){
                const end=line.slice(t[0].length).match(/^(?:\d{1,2}[:：]\d{2}\s*(?:AM|PM)?\s*)?(?:(?:星期|周)[一二三四五六日天]\s*)?(?:至|到|→|～|~|—|to\b)\s*(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?=\s|$|[T,，|])/i);
                if(end){
                    const startDay=dateDay(`${t[1]}-${t[2].padStart(2,'0')}-${t[3].padStart(2,'0')}`);
                    const endDay=dateDay(`${end[1]}-${end[2].padStart(2,'0')}-${end[3].padStart(2,'0')}`);
                    if(startDay!==null&&endDay!==null&&endDay>=startDay){
                        line=`${end[1]}-${end[2].padStart(2,'0')}-${end[3].padStart(2,'0')} `+line.slice(t[0].length+end[0].length);
                        t=line.match(/^(\d{4})-(\d{2})-(\d{2})/);
                    }
                }
            }
            const md=!t&&day!==null?line.match(/^(?:(?:当前|剧情)?(?:日期|时间)|Date|Time)\s*[:：]\s*(\d{1,2})[-月/.](\d{1,2})日?/i):null;
            let next=null;
            if(t)next=dateDay(`${t[1]}-${t[2].padStart(2,'0')}-${t[3].padStart(2,'0')}`);
            if(md)next=dateDay(`${dayDate(day).slice(0,4)}-${md[1].padStart(2,'0')}-${md[2].padStart(2,'0')}`);
            if(next!==null){if(next!==day)hour=null;day=next;}
            // Only scene-opening relative transitions, never mentions in dialogue.
            const relative=line===lines[0]?line.match(/^(?:第二天|次日|翌日|隔天|the next day|the following morning)|^([一二两三四五六七八九十\d]+)天后|^(\d+) days? later/i):null;
            if(relative&&day!==null){const n=relative[1]||relative[2];const count=n?(/^\d+$/.test(n)?+n:{一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10}[n]):1;if(count){day+=count;hour=null;}}
            const sceneLine=!!t||!!md||!!relative||/^(?:(?:当前|剧情|故事)?时间|Time|Scene time)\s*[:：]/i.test(line);
            if(sceneLine){
                const tm=line.match(/(?:\b|[T\s：:])(\d{1,2})[:：](\d{2})(?:\s*(AM|PM))?/i);
                if(tm&&+tm[1]<24&&+tm[2]<60){let h=+tm[1];if(tm[3]){h=h%12+(/pm/i.test(tm[3])?12:0);}hour=h+(+tm[2]/60);}
                else if(exact && /凌晨|半夜|晚上|夜晚|夜间|下午|午后|中午|正午|上午|早上|清晨|黎明|midnight|night|evening|afternoon|noon|morning|dawn/i.test(line))hour=null;
                else if(/凌晨|半夜|midnight/i.test(line))hour=2;
                else if(/晚上|夜晚|夜间|night|evening/i.test(line))hour=21;
                else if(/下午|午后|afternoon/i.test(line))hour=15;
                else if(/中午|正午|noon/i.test(line))hour=12;
                else if(/上午|早上|morning/i.test(line))hour=10;
                else if(/清晨|黎明|dawn/i.test(line))hour=7;
            }
        }
    }
    return {day,hour};
}

// Exact clock for elapsed-time policies: fuzzy morning/evening is not a time.
function exactStoryTime(chat) {
    const {day,hour}=readStoryClock(chat,null,{exact:true});
    return {date:dayDate(day),time:hour==null?'':String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0'),precision:'exact'};
}

// Stored story anchors are distinct from createdAt (local ordering only).
function storyTime(chat) {
    const {day,hour}=readStoryClock(chat);
    return {date:dayDate(day), time:hour==null?'':String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0'), precision:'scene'};
}
const displayStoryTime = item => /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(item?.storyTime?.time||'') ? item.storyTime.time : '—';

function displayStoryDate(date) {
    const day = dateDay(date);
    if (day === null) return '';
    const weekday = new Date(day * 86400000).getUTCDay();
    return date + ' 星期' + '日一二三四五六'[weekday];
}

// Shared display-name rules. Original names stay as aliases for identity lookup.
const CHINESE_NAME_RULE = '\n手机姓名显示规则（所有 App 共用）：电话簿、短信联系人、好友、关注列表及账号显示姓名一律用中文。外文姓名优先采用人物设定/人设/世界书中已经使用的中译名，完整照用，不擅自换译名；没有中译名才按原姓名音译成中文。同一人只保留一个中文姓名，不能中英文各返回一个联系人，也不要在显示姓名中附英文括号。人物或地点联系人的 name 填中文显示名，aliases 数组保留原文姓名及设定已有别名，供识别同一人物。地点联系人的名称也用中文。商品名、品牌名不属于此规则。此规则只控制姓名标签，不改变短信、帖子、对白等内容所遵循的酒馆预设语言；handle/@账号、内部 id 和 user 自己设置的网名保持原值，不翻译或改写。';

const key = s => String(s || '').normalize('NFKC').trim().toLowerCase().replace(/[\s·.・'’_-]/g,'');
const han = s => /\p{Script=Han}/u.test(s || '');
const nameAliases = item => [...new Set([item?.name,...(Array.isArray(item?.aliases) ? item.aliases : [])].filter(n => typeof n === 'string' && n.trim()).map(n => n.trim().slice(0,100)))];
function sameNamedPerson(a,b) {
    const keys = nameAliases(a).map(key);
    return nameAliases(b).some(n => keys.includes(key(n)));
}
function localizedPerson(item, context, existing = []) {
    const aliases = nameAliases(item), probe = {aliases};
    const cards = (context.characters || []).map((c,index) => ({c,index})).filter(({c}) => sameNamedPerson(probe,c));
    const card = cards.length === 1 ? cards[0] : null;
    const old = [...new Map(existing.filter(c => sameNamedPerson(probe,c)).map(c => [c.id,c])).values()];
    const known = old.length === 1 ? old[0] : null;
    const material = [context.powerUserSettings?.persona_description,...(context.characters || []).flatMap(c => {
        const d = c.data || c;
        return [c.name,d.description,d.personality,d.scenario,...(d.character_book?.entries || []).filter(e => e.enabled !== false).map(e => e.content)];
    })].filter(Boolean).join('\n');
    const chinese = aliases.filter(han);
    let name = (han(card?.c.name) ? card.c.name : null) || chinese.find(n => material.includes(n)) || (han(known?.name) ? known.name : null) || chinese[0] || aliases[0] || '';
    const complete = [...chinese, ...nameAliases(known).filter(han)].find(n => n.startsWith(name + '·') && (n === known?.name || material.concat('\n',context.name1 || '').includes(n.slice(name.length + 1))));
    if (complete) name = complete;
    return {name,aliases:[...new Set([...aliases,...nameAliases(known),...(card ? [card.c.name] : []),name])],cardIndex:card?.index ?? null,cardId:card ? 'card:' + (card.c.avatar || card.c.name) : null,existingId:known?.id ?? null};
}

function clampPosition(position, viewport, size = LAUNCHER_SIZE) {
    const margin = 8;
    const maxX = Math.max(margin, viewport.width - size - margin);

// Desktop Enter and mobile soft-keyboard line breaks share the same local action.
function bindComposerKeys(root,{queue,onError=()=>{},signal}) {
    const selector='textarea[data-sms-draft],textarea[data-snap-field="message"],textarea[data-chat-field="message"]';
    const composing=new WeakSet(),finishing=new WeakSet();
    let pending=false;
    const composer=event=>event.target?.matches?.(selector)?event.target:null;
    function submit(event) {
        const input=composer(event);if(!input||input.disabled)return;
        if(event.isComposing||event.keyCode===229||composing.has(input)||finishing.has(input))return;
        event.preventDefault();
        if(pending||!input.value.trim())return;
        pending=true;
        Promise.resolve().then(()=>queue(input)).catch(onError).finally(()=>{pending=false;});
    }
    root.addEventListener('compositionstart',e=>{const input=composer(e);if(input)composing.add(input);},{signal});
    root.addEventListener('compositionend',e=>{const input=composer(e);if(input){composing.delete(input);finishing.add(input);setTimeout(()=>finishing.delete(input),0);}},{signal});
    root.addEventListener('keydown',e=>{if(e.key==='Enter')submit(e);},{signal});
    root.addEventListener('beforeinput',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType)&&e.cancelable)submit(e);},{signal});
    // Some mobile keyboards deliver only a non-cancelable input event.
    root.addEventListener('input',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType))submit(e);},{signal});
}

// Keep native editing inside the phone's scroll areas without scrolling the host chat.
function bindInputViewport({ shadow, phone, content, signal }) {
    const viewport = window.visualViewport;
    let frame = 0, normalHeight = viewport?.height || window.innerHeight;
    const editable = () => {
        const element = shadow.activeElement;
        return element && phone.contains(element) && !element.disabled && !element.readOnly &&
            (element.matches('textarea, [contenteditable="true"]') || element.matches('input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="button"]):not([type="submit"])')) ? element : null;
    };
    function reveal(element) {
        // Work from the innermost scroll container outwards, never the document.
        for (let parent = element.parentElement; parent && phone.contains(parent); parent = parent.parentElement) {
            if (parent.scrollHeight <= parent.clientHeight || !/auto|scroll/.test(getComputedStyle(parent).overflowY)) continue;
            const field = element.getBoundingClientRect(), box = parent.getBoundingClientRect();
            const top = box.top + 10, bottom = box.bottom - 10;
            // Long editors scroll internally; do not bounce between their two edges.
            if (field.height > bottom - top) {
                if (field.top > bottom - 40 || field.bottom < top + 40) parent.scrollTop += field.top - top;
            } else if (field.bottom > bottom) parent.scrollTop += field.bottom - bottom;
            else if (field.top < top) parent.scrollTop -= top - field.top;
        }
    }
    function update() {
        frame = 0;
        if (signal.aborted) return;
        const field = editable(), height = viewport?.height || window.innerHeight, top = viewport?.offsetTop || 0;
        if (!field) normalHeight = Math.max(height, window.innerHeight);
        const compact = !!field && ((normalHeight - height > 120) || (window.innerWidth <= 600 && height < 520));
        phone.dataset.editing = String(!!field);
        phone.dataset.keyboard = String(compact);
        phone.style.setProperty('--pp-visible-height', height + 'px');
        phone.style.setProperty('--pp-visible-top', top + 'px');
        if (field && !phone.hidden) reveal(field);
    }
    function schedule() {
        if (!frame && !signal.aborted) frame = requestAnimationFrame(update);
    }
    for (const name of ['focusin', 'focusout', 'input']) shadow.addEventListener(name, schedule, { signal });
    window.addEventListener('resize', schedule, { signal });
    viewport?.addEventListener('resize', schedule, { signal });
    viewport?.addEventListener('scroll', schedule, { signal });
    signal.addEventListener('abort', () => cancelAnimationFrame(frame), { once:true });
    return { update: schedule };
}

        persistent: () => persisted,

        text() { return (entries.length ? '当前运行版本：榴莲手机 ' + version + '\n（以下每条版本为报错发生时的版本；更新插件后请刷新酒馆页面。）\n\n' : '') + entries.slice().reverse().map(e=>'['+e.time+'] 榴莲手机 '+e.version+' · '+e.source+'\n'+e.message).join('\n\n'); },
    };
}

// Independent OpenAI-compatible requests go through the existing ST backend.
// Never overwrite the host's connection settings or borrow its provider keys.
function normalizeApiUrl(value) {
    let url;
    try { url = new URL(String(value ?? '').trim()); } catch { throw new Error('请填写完整 API 地址，例如 https://example.com/v1'); }
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('API 地址仅支持 HTTP/HTTPS，不要在地址里填写密钥或查询参数。');
    url.pathname = url.pathname.replace(/\/(?:chat\/completions|models)\/?$/, '').replace(/\/+$/, '') || '/v1';
    return url.toString().replace(/\/$/, '');
}

function createKeyStore(storage) {
    if (arguments.length === 0) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const prefix = 'durian_phone_api_key:';
    return {
        get(url, profileId = '') { try { return storage?.getItem(prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url)) ?? ''; } catch { return ''; } },
        secrets() {
            try { return Array.from({length: storage?.length || 0}, (_, i) => storage.key(i)).filter(k => k?.startsWith(prefix)).map(k => storage.getItem(k)).filter(Boolean); } catch { return []; }
        },
        set(url, key, profileId = '') {
            if (!storage) throw new Error('当前浏览器不能保存密钥，请检查浏览器存储设置。');
            const name = prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url);
            try { key ? storage.setItem(name, key) : storage.removeItem(name); }
            catch { throw new Error('密钥保存失败，请检查浏览器存储空间或权限。'); }
        },
    };
}

function failure(message, retryable = false) { return Object.assign(new Error(message), { retryable }); }
function apiError(status, data) {
    // ST's OpenAI proxy may wrap upstream failures as HTTP 200 and keep only
    // error.message (HTTP statusText) plus quota_error. Do not discard those.
    // Classify locally; never echo arbitrary provider text, codes or credentials.
    const raw = data?.error;
    const nested = raw && typeof raw === 'object' ? raw : {};
    const code = [nested.code, nested.type, nested.status].filter(v => typeof v === 'string').join(' ').slice(0, 1000).toLowerCase();
    const message = (typeof raw === 'string' ? raw : typeof nested.message === 'string' ? nested.message : typeof data?.message === 'string' ? data.message : '').slice(0, 4000).toLowerCase();
    const labels = { 'bad request':400, unauthorized:401, forbidden:403, 'not found':404, 'request timeout':408,
        'request entity too large':413, 'payload too large':413, 'unprocessable entity':422, 'too many requests':429,
        'internal server error':500, 'bad gateway':502, 'service unavailable':503, 'gateway timeout':504 };
    const declared = Number(nested.status ?? nested.status_code ?? nested.code);
    const reported = Number.isInteger(declared) && declared >= 400 && declared <= 599 ? declared : Object.hasOwn(labels, message.trim()) ? labels[message.trim()] : null;
    const effective = reported || status;
    let reason = '未识别', hint = '请核对酒馆服务端同一时刻的错误记录（分享前去除密钥和正文）。';
    if (data?.quota_error === true || /insufficient_quota|quota_exceeded|resource_exhausted/.test(code)) { reason='额度不足';hint='请检查服务额度。'; }
    else if ([401,403].includes(effective) || /authentication|invalid_api_key/.test(code)) { reason='认证失败';hint='请检查这个地址对应的 API 密钥和访问权限。'; }
    else if (effective===429 || /rate_limit/.test(code)) { reason='请求过于频繁';hint='请稍后手动重试。'; }
    else if (effective===404 || /model_not_found/.test(code)) { reason='找不到接口或模型';hint='请检查 API 地址及模型 ID。'; }
    else if (effective===413 || /context_length|max_tokens|token_limit/.test(code) || /context length|context window|too many tokens/.test(message)) { reason='上下文或输出长度超限';hint='请核对模型长度限制与预设参数。'; }
    else if (effective===408 || effective===504 || /timeout|timed.?out/.test(code+' '+message)) { reason='上游等待超时';hint='请核对中转或执行器记录，再手动重试。'; }
    else if (effective===503 || /overloaded|server_busy|no available.*executor|executor.*offline/.test(code+' '+message)) { reason='服务繁忙或执行器不可用';hint='请检查服务或执行器状态，再手动重试。'; }
    else if (effective===502 || /econnrefused|econnreset|enotfound/.test(code+' '+message)) { reason='转发连接失败';hint='请检查中转服务或执行器的对应请求记录，再手动重试。'; }
    else if (effective===400 || effective===422 || /invalid_request|invalid_argument/.test(code)) { reason='请求被接口拒绝';hint='请核对服务支持的模型与预设参数；具体拒绝原因需查看酒馆服务端记录。'; }
    else if (effective>=500) { reason='服务内部错误';hint='请核对中转服务记录，再手动重试。'; }
    const prefix = status>=200&&status<300 ? '酒馆接口已响应（HTTP '+status+'），但返回了错误结果，未取得模型回复。' : 'API 请求失败'+(status?'（HTTP '+status+'）':'')+'。';
    const error = failure(prefix+(reason==='未识别'?'':reason+'。')+hint, status===429 && data?.quota_error!==true);
    error.diagnostic = '错误分类：'+reason+'；错误体报告状态：'+(reported??'未提供')
        +'；错误结构：'+(raw===null?'null':Array.isArray(raw)?'array':typeof raw)
        +'；含错误说明：'+(message?'是':'否')+'；额度标记：'+(data?.quota_error===true?'是':'否');
    return error;
}

function extractApiText(data) {
    if (data?.error) throw apiError(0, data);
    const choices = Array.isArray(data?.choices) ? data.choices : [];
    const choice = choices[0], message = choice?.message, content = message?.content;
    const shape = value => value === undefined ? '缺失' : value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
    const nonempty = value => typeof value === 'string' ? !!value.trim() : Array.isArray(value) && value.length > 0;
    const reasoning = nonempty(message?.reasoning_content) || nonempty(message?.reasoning) || nonempty(message?.reasoning_details);
    const tools = Array.isArray(message?.tool_calls) ? message.tool_calls.length : message?.function_call ? 1 : 0;
    const refusal = nonempty(message?.refusal);
    const finish = ['stop','length','content_filter','tool_calls','function_call'].includes(choice?.finish_reason) ? choice.finish_reason : choice?.finish_reason == null ? '未提供' : '其他';
    const textParts = Array.isArray(content) ? content.filter(p => p?.type === 'text' && typeof p.text === 'string') : [];
    const tokenCount = value => Number.isSafeInteger(value) && value >= 0 ? value : '未提供';
    const fail = (code, reason) => {
        const error = failure(reason);
        error.code = code;
        // Only known shapes/counts/enums: no response excerpts, reasoning or arbitrary field names.
        error.diagnostic = '错误代码：'+code+'；响应结构：'+shape(data)+'；choices：'+shape(data?.choices)+'；候选数：'+choices.length
            +'；message：'+shape(message)+'；content：'+shape(content)+'；文本片段数：'+textParts.length+'；旧式text：'+shape(choice?.text)
            +'；结束原因：'+finish+'；含推理内容：'+(reasoning?'是':'否')+'；工具调用数：'+tools+'；含拒答标记：'+(refusal?'是':'否')
            +'；含流式片段：'+(choice?.delta?'是':'否')+'；输出token用量：'+tokenCount(data?.usage?.completion_tokens)
            +'；推理token用量：'+tokenCount(data?.usage?.completion_tokens_details?.reasoning_tokens);
        throw error;
    };
    if (finish === 'length') fail('API_OUTPUT_TRUNCATED','接口标记模型输出被截断，本次未保存回复。');
    if (finish === 'content_filter' || refusal) fail('API_OUTPUT_FILTERED','接口返回内容过滤或拒答标记，本次未取得可用回复。');
    if (finish === 'tool_calls' || finish === 'function_call') fail('API_OUTPUT_TOOLS','接口返回了工具调用，未完成本次所需的文字回复。');
    // Support the legacy completion text used by compatible gateways, but never
    // treat reasoning, tool arguments or an unfinished streaming delta as a reply.
    let text = typeof content === 'string' ? content : textParts.map(p => p.text).join('');
    if (!text.trim() && content == null && !reasoning && !tools && typeof choice?.text === 'string') text = choice.text;
    if (!text.trim()) {
        if (!choices.length || !choice || typeof choice !== 'object') fail('API_RESPONSE_SHAPE','接口返回中没有有效的回复候选，无法读取文字；需核对返回格式。');
        if (reasoning) fail('API_REASONING_ONLY','模型没有返回文字：接口只提供了推理内容，没有最终回复。本次未保存。');
        if (tools) fail('API_OUTPUT_TOOLS','接口只提供了工具调用，没有最终文字回复。');
        if (choice.delta) fail('API_UNEXPECTED_DELTA','非流式请求收到了流式片段，无法确认完整回复；需核对中转返回格式。');
        if (content != null && typeof content !== 'string' && !(Array.isArray(content) && content.every(p => p?.type==='text' && typeof p.text==='string'))) {
            fail('API_CONTENT_SHAPE','接口返回了无法识别的内容格式，未读取到回复文字。');
        }
        fail('API_EMPTY_OUTPUT','接口返回的最终回复文字为空。本次未保存；空回复本身不能说明是 token 上限问题。');
    }
    return text.trim();
}

function createApiClient({ getContext, getSettings, getKey, prepareRequest, fetchImpl = globalThis.fetch }) {
    const active = new Set();
    let cancelEpoch = 0;
    let preparation = null;
    async function post(path, config, key, extra, isCurrent = () => true, onProgress = () => {}) {
        if (getSettings().enabled === false) throw failure('榴莲手机已停用，请先勾选「启用榴莲手机」。');
        const endpoint = normalizeApiUrl(config.baseUrl);
        const host = getContext();
        if (typeof host?.getRequestHeaders !== 'function') throw failure('当前酒馆缺少请求接口，请更新酒馆后使用独立 API。');
        if (/\r|\n/.test(key)) throw failure('密钥不能包含换行，请重新粘贴。');
        if (!isCurrent()) throw failure('本次操作已取消。');
        const controller = new AbortController(); active.add(controller);
        let timedOut = false;
        const started = Date.now();
        let stage = '提交酒馆转发接口，等待响应', status = null, bodyLength = 0;
        const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, config.timeout * 1000);
        const watcher = setInterval(() => { if (!isCurrent()) controller.abort(); }, 150);
        try {
            const body = JSON.stringify({ chat_completion_source: 'openai', reverse_proxy: endpoint, proxy_password: key, ...extra });
            bodyLength = body.length;
            onProgress(stage);
            const response = await fetchImpl('/api/backends/chat-completions/' + path, {
                method: 'POST', headers: host.getRequestHeaders(), credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
                body,
            });
            if (!isCurrent()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            status = Number.isInteger(response.status) ? response.status : null;
            stage = '酒馆接口已响应，正在读取返回内容';
            onProgress(stage);
            let data;
            try { data = await response.json(); } catch {
                if (!response.ok) throw apiError(response.status, null);
                throw failure('接口没有返回有效 JSON，请检查 API 地址和酒馆版本。');
            }
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (!response.ok || data?.error) throw apiError(response.status, data);
            if (path === 'generate') {
                stage = '正在读取模型回复文字';
                onProgress(stage);
                return extractApiText(data);
            }
            return data;
        } catch (error) {
            let result;
            if (timedOut) result = failure('等待酒馆转发结果超时（' + config.timeout + ' 秒），本次已停止等待，不会自动重发。请核对中转或执行器记录后手动重试。');
            else if (controller.signal.aborted || !isCurrent()) result = failure('本次操作已取消。');
            else if (error && typeof error === 'object' && 'retryable' in error) result = error;
            // Provider error bodies can echo credentials: never display them.
            else result = failure('未能完成酒馆转发请求，请检查酒馆服务端网络与服务地址；本次不会自动重发。');
            result.diagnostic = (result.diagnostic ? result.diagnostic + '\n' : '') + '请求环节：' + stage + '；等待耗时：' + Math.round((Date.now() - started) / 1000) + ' 秒；超时设置：' + config.timeout + ' 秒'
                + '；HTTP：' + (status ?? '尚未收到') + '；请求字符数：' + bodyLength
                + '；上下文消息数：' + (Array.isArray(extra.messages) ? extra.messages.length : 0)
                + '；回复上限：' + (extra.max_completion_tokens ?? extra.max_tokens ?? '由服务决定')
                + '\n此处记录的是浏览器与酒馆接口的往返，不能据此确认上游执行器已收到请求。';
            throw result;
        } finally { clearTimeout(timeout); clearInterval(watcher); active.delete(controller); }
    }
    async function complete(config, key, messages, isCurrent) {
        if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
        return post('generate', config, key, { model: config.model.trim(), messages, stream: false,
            max_tokens: config.maxTokens }, isCurrent);
    }
    return {
        async generate(prompt, contact, isCurrent, onProgress = () => {}, options = {}) {
            if (getSettings().enabled === false) throw failure('榴莲手机已停用，请先勾选「启用榴莲手机」。');
            const config = structuredClone(getSettings().api);
            normalizeApiUrl(config.baseUrl);
            if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
            const key = getKey(config.baseUrl);
            const fingerprint = JSON.stringify(config), epoch = cancelEpoch;
            const current = () => epoch === cancelEpoch && isCurrent() && fingerprint === JSON.stringify(getSettings().api) && key === getKey(config.baseUrl);
            onProgress('正在整理正文、预设与记忆，尚未提交独立 API');
            // The host uses shared prompt hooks. Release this queue before the network call.
            const prepare = async () => {
                if (!current()) throw failure('本次操作已取消。');
                return prepareRequest(getContext(), prompt, contact, current);
            };
            const handoff = preparation ? preparation.then(prepare) : prepare();
            const tail = handoff.catch(() => {});
            preparation = tail;
            let prepared;
            try { prepared = await handoff; }
            finally { if (preparation === tail) preparation = null; }
            if (!current()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            const payload = independentPayload(prepared, config);
            // Only the caller's task contract is appended, after preset hooks.
            // Keep all roleplay context and portable settings intact.
            if (typeof options.finalOutputContract === 'string' && options.finalOutputContract.trim()) {
                payload.messages = [...payload.messages, { role: 'system', content: options.finalOutputContract }];
            }
            try { return await post('generate', config, key, payload, current, onProgress); }
            catch (error) {
                if (error.diagnostic) {
                    const sizes=payload.messages.map(m=>JSON.stringify(m).length);
                    error.diagnostic+='\n手机任务提示字符数：'+prompt.length+'；最终各条消息字符数（按发送顺序，含结构）：'+sizes.join('、');
                }
                throw error;
            }
        },
        async models(config, key, isCurrent) {
            const data = await post('status', config, key, {}, isCurrent);
            if (!Array.isArray(data?.data)) throw failure('服务没有返回模型列表，请手动填写模型 ID。');
            return [...new Set(data.data.map(item => item?.id).filter(id => typeof id === 'string' && id.length < 300))].sort();
        },
        test(config, key, isCurrent) {
            return complete({ ...config, maxTokens: Math.max(128, Math.min(config.maxTokens, 1024)) }, key,
                [{ role: 'user', content: 'Connection test. Reply only: OK' }], isCurrent);
        },
        cancel() { cancelEpoch++; for (const controller of active) controller.abort(); },
    };
}

// Keep prompt contents and portable preset parameters. Never forward the host's
// URL, authorization headers, custom endpoint configuration or account fields.
function independentPayload(prepared, config) {
    const fields = ['messages','temperature','frequency_penalty','presence_penalty','top_p','top_k','min_p','top_a','typical_p',
        'max_tokens','max_completion_tokens','stop','seed','logit_bias','logprobs','top_logprobs',
        'include_reasoning','reasoning_effort','verbosity','custom_prompt_post_processing','user_name','char_name','group_names',
        'tools','tool_choice','response_format','json_schema'];
    if (!Array.isArray(prepared?.messages) || !prepared.messages.length) throw failure('酒馆没有提供有效的生成内容。');
    const payload = Object.fromEntries(fields.filter(k => prepared[k] !== undefined).map(k => [k, prepared[k]]));
    return { ...payload, model: config.model.trim(), stream: false, type: 'quiet' };
}

const apiEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

                    const next = config(action === 'test');

                    try {
                        const result = await adapter.api[action](next, key, () => token === id);

                        else { statusKind = 'success'; status = '连接成功，模型已返回文字。请保存设置后使用。'; }
                    } catch (error) { if (token === id) { adapter.diagnostics?.add(error,'API '+action,[key]); statusKind = 'error'; status = error.message; } }

                }
            } catch (error) { adapter.diagnostics?.add(error,'API 设置',[key]); statusKind = 'error'; status = error.message; }
            redraw();
        },
        destroy() { token++; key = ''; draft = null; },
    };
}

// Small, chat-local event journal. It stores phone changes, never a copy of prose.
const JOURNAL_KEY = 'durian_phone_history';
const COLLECTIONS = ['profiles', 'contacts', 'calls', 'messages', 'snapchat', 'whatsapp', 'wechat', 'x', 'orders', 'assets', 'daily', 'smsContext', 'commContext', 'business', 'location', 'weather'];
const SCHEMA = 1;
const EMPTY_REVISION = 'root';
const copy = value => JSON.parse(JSON.stringify(value));
const record = value => value && typeof value === 'object' && !Array.isArray(value);

const isMemoryHidden = message => message?.extra?.qianqianjieAutoHide?.schemaVersion === 1 && typeof message.extra.qianqianjieAutoHide.chatId === 'string' && !message.extra.type;

function messageSignatures(chat, legacy = false) {
    return chat.map(message => JSON.stringify([
        String(message.mes ?? ''), String(message.name ?? ''), Boolean(message.is_user),
        Boolean(message.is_system && (legacy || !isMemoryHidden(message))), message.send_date ?? null, message.swipe_id ?? null,
    ]));
}

async function revisionsFor(signatures) {
    const encoder = new TextEncoder();
    const revisions = [];
    let previous = EMPTY_REVISION;
    for (const signature of signatures) {
        const hash = await crypto.subtle.digest('SHA-256', encoder.encode(previous + '\n' + signature));
        previous = Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
        revisions.push(previous);
    }
    return revisions;
}

function validateChanges(changes) {
    if (!Array.isArray(changes) || !changes.length) throw new Error('手机记录缺少变更内容。');
    for (const change of changes) {
        if (!record(change) || !COLLECTIONS.includes(change.collection) || typeof change.key !== 'string' || !change.key.length ||
            ['__proto__', 'constructor', 'prototype'].includes(change.key) || !(change.value === null || record(change.value))) {
            throw new Error('手机记录格式不正确，原数据已保留。');
        }
    }
}

function readJournal(raw) {
    if (raw === undefined) return { schema: SCHEMA, events: [] };
    if (!record(raw) || raw.schema !== SCHEMA || !Array.isArray(raw.events)) {
        throw new Error('暂时无法读取此聊天的手机记录，原数据已保留。');
    }
    const ids = new Set();
    for (const event of raw.events) {
        if (!record(event) || typeof event.id !== 'string' || !event.id || ids.has(event.id) ||
            !record(event.source) || !Number.isInteger(event.source.index) || event.source.index < 0 ||
            typeof event.source.revision !== 'string') throw new Error('手机记录来源不完整，原数据已保留。');
        ids.add(event.id);
        validateChanges(event.changes);
    }
    return copy(raw);
}

function reconcileJournal(raw, revisions, legacyRevisions = null) {
    const journal = readJournal(raw);
    const before = journal.events.length;
    // A chained revision binds an event to its entire narrative prefix, not just
    // its floor number. Editing an earlier floor invalidates later changes too.
    let migrated = false;
    for (const event of journal.events) {
        if (!event.source.visibilityNormalized && legacyRevisions && event.source.revision === legacyRevisions[event.source.index] && revisions[event.source.index]) {
            event.source.revision = revisions[event.source.index]; event.source.visibilityNormalized = true; migrated = true;
        }
    }
    journal.events = journal.events.filter(event => revisions[event.source.index] === event.source.revision);
    return { journal, removed: before - journal.events.length, migrated };
}

function appendChange(journal, revisions, changes, id = crypto.randomUUID()) {
    if (!revisions.length) throw new Error('请先开始一段聊天。');
    validateChanges(changes);
    const next = readJournal(journal);
    if (next.events.some(event => event.id === id)) return next; // Safe retry of the same operation.
    next.events.push({ id, source: { index: revisions.length - 1, revision: revisions.at(-1), visibilityNormalized: true }, changes: copy(changes) });
    return next;
}

function replayJournal(journal) {
    const maps = Object.fromEntries(COLLECTIONS.map(name => [name, new Map()]));
    const messagePositions = new Map();
    for (const event of readJournal(journal).events) {
        for (const change of event.changes) {
            // First creation anchors chronology. Edits/read flags must not move
            // old SMS; late imports still belong to their original story floor.
            if (change.collection === 'messages' && change.value !== null && !messagePositions.has(change.key)) {
                messagePositions.set(change.key, { floor: event.source.index, order: messagePositions.size });
            }
            if (change.value === null) maps[change.collection].delete(change.key);
            else {
                const value = copy(change.value), records = maps[change.collection];
                const publication = (change.collection === 'x' && value.type === 'post') ||
                    (change.collection === 'snapchat' && ['story','clip'].includes(value.type));
                if (publication) value.sourceIndex = records.get(change.key)?.sourceIndex ?? value.sourceIndex ?? event.source.index;
                records.set(change.key, value);
            }
        }
    }
    maps.messages = new Map([...maps.messages].sort(([a], [b]) => {
        const left = messagePositions.get(a), right = messagePositions.get(b);
        return left.floor - right.floor || left.order - right.order;
    }));
    return Object.fromEntries(COLLECTIONS.map(name => [name, Object.fromEntries(maps[name])]));
}

// A manual erase is permanent for this phone history, unlike a story action.
// Keep event IDs/source anchors with null changes so imports cannot resurrect it.
// Unified timing/shown sidecar rows follow their record: deleting the record
// also erases `commContext` rows keyed to it, including element entries.
function eraseMessageFromJournal(raw, messageId) {
    const journal = readJournal(raw);
    for (const event of journal.events) for (const change of event.changes) {
        if (['messages','smsContext'].includes(change.collection) && change.key === messageId) change.value = null;
        else if (change.collection === 'messages' && change.value?.replyTo === messageId) delete change.value.replyTo;
        else if (change.collection === 'commContext' && change.key === 'sms:' + messageId) change.value = null;
    }
    return journal;
}

function eraseRecordFromJournal(raw, collection, recordId) {
    if (collection === 'messages') return eraseMessageFromJournal(raw, recordId);
    const journal = readJournal(raw);
    const sidecar = collection + ':' + recordId;
    for (const event of journal.events) for (const change of event.changes) {
        if (change.collection === collection && change.key === recordId) change.value = null;
        else if (change.collection === 'commContext' &&
            (change.key === sidecar || change.key.startsWith(sidecar + '#'))) change.value = null;
    }
    return journal;
}

                (editing?.id===message.id?'<form data-sms-edit-form class="pp-sms-edit-form"><textarea data-sms-edit-text maxlength="6000" aria-label="修改消息">'+smsEscape(editing.text)+'</textarea><button type="submit"'+(busy?' disabled':'')+'>保存</button><button type="button" data-sms-edit-cancel>取消</button></form>':'')+
                (message.id === latestUserId && message.replyStatus === 'failed' ? '<button type="button" class="pp-text-button" data-sms-retry="' + smsEscape(message.id) + '"' + (busy || blocked || cannotReply ? ' disabled' : '') + '>重试回复</button>' : '') + '</div>').join('') : '<p class="pp-sms-empty-thread">发送第一条短信</p>') + '</div>' +
            (busy ? '<p class="pp-phone-progress" role="status">' + smsEscape(progress || '正在处理，请稍候…') + '</p>' : '') + errorHTML +
            (phoneOnly ? '<p class="pp-footnote">此号码不支持短信。</p>' : '') +
            (contact.replyable===false ? '<p class="pp-footnote">这条短信没有可用的回复地址。</p>' : '') +
            (blocked ? '<p class="pp-footnote">此人的短信已被拉黑，取消后才能继续交流。</p>' : '') +
            '<form data-sms-form class="pp-sms-compose"><label for="pp-sms-input">短信内容</label><textarea id="pp-sms-input" data-sms-draft enterkeyhint="enter" rows="2" maxlength="6000" placeholder="短信…"' + (busy || blocked || cannotReply ? ' disabled' : '') + '>' + smsEscape(drafts[contact.id] || '') + '</textarea><button type="submit" aria-label="发送短信"' + (busy || blocked || cannotReply ? ' disabled' : '') + '>'+icon('send')+'</button></form></div>';
    }
    let entries = Object.values(picking ? contacts : participants);
    const recency = new Map(Object.values(messages ?? {}).map((message, index) => [message.contactId, index]));
    if (picking) entries.sort((a, b) => a.name.localeCompare(b.name));
    else entries = entries.filter(item => recency.has(item.id)).sort((a, b) => recency.get(b.id) - recency.get(a.id));
    return '<div class="pp-sms-list"><div class="pp-phone-toolbar"><h2>' + (picking ? '选择联系人' : '短信') + '</h2><button type="button" class="pp-text-button" ' + (picking ? 'data-sms-back' : 'data-sms-new') + '>' + (picking ? '取消' : '新建短信') + '</button>' + (picking ? '<button type="button" class="pp-text-button" data-sms-sync' + (busy ? ' disabled' : '') + '>新增联系人</button><button type="button" class="pp-text-button" data-contact-bulk' + (busy ? ' disabled' : '') + '>一键新增</button>' : '') + (!picking ? '<button type="button" class="pp-text-button" data-sms-blocklist>黑名单</button>' : '') + '</div>' +
        (busy ? '<p class="pp-phone-progress" role="status">' + smsEscape(progress || '正在处理，请稍候…') + '</p>' : '') + errorHTML + (contactStatus && picking ? '<p class="pp-contact-status" role="status">' + smsEscape(contactStatus) + '</p>' : '') +
        (entries.length ? entries.map(item => {
            const last = threadMessages(messages, item.id).at(-1);

        }).join('') : '<div class="pp-empty"><h2>' + (picking ? '暂无联系人' : '暂无短信') + '</h2><p>' + (picking ? '点击「新增联系人」添加。' : '点击「新建短信」，选择联系人开始交流。') + '</p></div>') +
        '</div>';
}

// Fictional Snapchat: all media/calls are text roleplay; no real social API,
// microphone, camera, geolocation, payment or media hosting is used.
const snapItems = (state, type) => Object.values(state.snapchat || {}).filter(item => item.type === type);
const snapProfile = (state, name = 'user') => ({id:'profile',type:'profile',alias:name,location:'',sharing:false,...state.snapchat?.profile,currency:walletCurrency(state)});
const snapExpired = (item, now = Date.now()) => now - item.createdAt >= 86400000;
const snapUnread = state => snapItems(state,'message').filter(m=>m.role==='assistant'&&!m.read).length + snapItems(state,'account').filter(a=>a.friend==='incoming').length;
// The journal rolls both the floor marker and story checks back with their source floor.
function snapStoryRefreshState(state, revision = state.revision) {
    const refreshed = state.snapchat?.storyRefresh?.revision === (revision ?? 'root');
    const pending = snapItems(state,'story').filter(s=>s.author==='user'&&!s.reactionsChecked&&!snapExpired(s));
    return {refreshed,pending,allowed:!refreshed||pending.length>0};
}


const snapEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const snapKind = {text:'文字',voice:'语音',image:'照片',video:'视频'};
const snapMoney = item => item.currency + ' ' + majorAmount(item.amountMinor,item.currency);
const snapTime = item => displayStoryTime(item);

function createSnapPanel({adapter,getView,redraw,notice}) {

    const select=(name,options,fallback)=>'<select name="'+name+'" data-snap-field="'+name+'" aria-label="内容类型">'+options.map(k=>'<option value="'+k+'"'+(value(name,fallback)===k?' selected':'')+'>'+snapKind[k]+'</option>').join('')+'</select>';
    const form=(name,body,label)=>'<form class="pp-snap-form" data-snap-form="'+name+'">'+body+'<div class="pp-compose-actions"><button class="pp-snap-primary" type="submit"'+disabled()+'>'+label+'</button></div></form>';
    const empty=text=>'<p class="pp-snap-empty">'+text+'</p>';
    function accountsHTML(state) {

        for(const id of selectedAccounts){const a=state.snapchat?.[id];if(!a||a.blocked||['friends','incoming'].includes(a.friend))selectedAccounts.delete(id);}

            return '<article class="pp-snap-card pp-snap-account"><div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+' · '+label+(unread?' · '+unread+' 条未读':'')+'</small></div></div><div class="pp-snap-actions">'+
                (a.blocked?button('thread','聊天记录',a.id)+button('unblock','解除拉黑',a.id):a.friend==='friends'?button('thread','聊天',a.id):a.friend==='incoming'?button('accept','接受邀请',a.id)+button('decline','拒绝',a.id):'<label class="pp-snap-check"><input type="checkbox" data-snap-select="'+snapEsc(a.id)+'" aria-label="选择 '+snapEsc(a.name)+'"'+(selectedAccounts.has(a.id)?' checked':'')+disabled()+'>选择添加</label>')+(!a.blocked?button('block','拉黑',a.id):'')+'</div></article>';
        }).join('')+(accounts.length?'':empty('还没有 Snapchat 联系人。点「新增联系人」查找账号。'));
    }
    function transferHTML(t,blocked) {
        return '<article class="pp-snap-cash"><strong>Snapcash · '+(t.direction==='incoming'?'对方转来':'你转出')+'</strong><b>'+snapMoney(t)+'</b><p>'+snapEsc(t.memo)+'</p><small>'+({pending:'待收款',accepted:'已收款',declined:'已拒收／取消'})[t.status]+'</small><div class="pp-snap-actions">'+(t.status==='pending'?(blocked?'':button('settle',t.direction==='incoming'?'收款':'查看收款回应',t.id))+button('cancel',t.direction==='incoming'?'拒收':'取消转账',t.id):'')+'</div></article>';
    }
    function threadHTML(state,a) {
        const items=Object.values(state.snapchat||{}).filter(i=>i.accountId===a.id&&['message','call','transfer'].includes(i.type)).sort((a,b)=>a.createdAt-b.createdAt);
        const active=items.find(i=>i.type==='call'&&i.status==='connected');
        const chat=items.map(i=>{
            if(i.type==='transfer')return transferHTML(i,a.blocked);
            if(i.type==='call')return '<article class="pp-snap-card"><strong>'+snapKind[i.mode]+'通话 · '+({connected:'通话中',ended:'已结束',no_answer:'未接听'})[i.status]+'</strong>'+i.turns.map(t=>'<p class="pp-snap-copy"><b>'+(t.role==='user'?'你':snapEsc(a.name))+'：</b>'+snapEsc(t.text)+'</p>').join('')+'</article>';
            return '<article class="pp-snap-message '+(i.role==='user'?'is-user':'')+'" data-press="snap-message" data-snap-id="'+snapEsc(i.id)+'"><small>'+(i.role==='user'?'你':snapEsc(a.name))+' · '+snapKind[i.kind]+' · '+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p>'+(editingId===i.id?form('edit-message',textarea('editText','修改消息'),'保存')+button('cancel-edit','取消'):'')+(i.status==='queued'?'<small>未发送</small>':'')+(['failed','pending'].includes(i.status)?button('retry','重试回复',i.id):i.status==='no_reply'?'<small>对方暂未回复</small>':'')+'</article>';
        }).join('');
        return button('list','‹ 聊天列表')+'<div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+'</small></div></div><div class="pp-snap-actions">'+(!a.blocked?button('voice','语音通话',a.id)+button('video','视频通话',a.id)+button('cash','转账',a.id)+(a.identityKnown?'':button('reveal','自我介绍',a.id))+button('block','拉黑',a.id):button('unblock','解除拉黑',a.id))+'</div><div class="pp-snap-thread">'+chat+'</div>'+
            (a.blocked?empty('已拉黑，不能发送消息或通话。'):page==='cash'?form('cash',field('amount','金额','','number')+'<input type="hidden" name="currency" value="'+(walletCurrency(state)||'')+'"><p>'+(walletCurrency(state)||'请先在小榴莲建立账本')+'</p>'+field('memo','附言'),'发送转账')+button('thread','返回聊天',a.id):active?form('call',textarea('call','通话内容'),'说话')+button('hangup','挂断',active.id):form('message',select('kind',['text','voice','image','video'],'text')+textarea('message','消息内容'),'发送'));
    }
    function postHTML(item) {
        return '<article class="pp-snap-card '+(item.type==='clip'?'pp-snap-clip':'pp-snap-story')+'"><header><strong>'+snapEsc(item.name)+'</strong><small>'+snapKind[item.kind]+(item.type==='story'?' · <span data-snap-expiry="'+item.createdAt+'">'+(snapExpired(item)?'已过期':'24 小时内')+'</span>':'')+'</small></header><div class="pp-snap-media"><span aria-hidden="true">'+(item.kind==='video'?'▷':'▧')+'</span><p class="pp-snap-copy">'+snapEsc(item.text)+'</p></div><div class="pp-snap-actions">'+button('like',item.liked?'♥ 已赞':'♡ 点赞',item.id)+button('comment','评论',item.id)+'</div>'+(item.friendLikes?.length?'<p class="pp-snap-copy">♥ '+snapEsc(item.friendLikes.map(id=>getView().snapchat?.[id]?.name||'好友').join('、'))+' 赞了这条故事</p>':'')+(item.comments||[]).map(c=>'<p class="pp-snap-copy"><b>'+snapEsc(c.name)+'：</b>'+snapEsc(c.text)+'</p>').join('')+(page==='comment:'+item.id?form('comment',textarea('comment','评论内容'),'发送评论'):'')+'</article>';
    }
    function feedsHTML(state) {
        if(tab==='stories'){const refresh=snapStoryRefreshState(state);return form('story',select('storyKind',['image','video'],'image')+textarea('story','故事内容'),'发布故事')+button('refresh',refresh.refreshed?(refresh.allowed?'查看新故事互动':'本回合已刷新'):'刷新好友故事','',refresh.allowed?'':'disabled')+snapItems(state,'story').slice().reverse().filter(i=>i.author==='user'||!state.snapchat[i.author]?.blocked).map(postHTML).join('');}
        if(tab==='spotlight')return button('refresh','加载短视频')+'<div class="pp-snap-clips">'+snapItems(state,'clip').slice().reverse().map(postHTML).join('')+'</div>'+empty('上下滑动浏览更多视频。');
        const p=profile();const locations=snapItems(state,'location').filter(i=>!state.snapchat[i.author]?.blocked).slice().reverse();
        return button('refresh','刷新共享位置与动态')+'<div class="pp-snap-map"><strong>Snap Map</strong><p>朋友分享的位置 · 世界动态</p><div class="pp-snap-pins">'+(p.sharing&&p.location?'<span>⌖ 你 · '+snapEsc(p.location)+'</span>':'')+locations.slice(0,6).map(i=>'<span>⌖ '+snapEsc(i.name)+' · '+snapEsc(i.place)+'</span>').join('')+'</div></div>'+(!p.sharing?empty('你的位置未共享，可在「我的账号」开启。'):'')+locations.map(i=>'<article class="pp-snap-card"><strong>'+snapEsc(i.name)+' · '+snapEsc(i.place)+'</strong><small>'+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p></article>').join('');
    }
    function html() {
        const state=getView();if(accountId&&!state.snapchat?.[accountId]){accountId=null;page='';}
        const a=state.snapchat?.[accountId];const p=profile();
        let body=page==='profile'?button('list','‹ 返回')+form('profile',field('alias','网名',p.alias)+field('location','我分享的位置',p.location)+'<label class="pp-snap-check"><input name="sharing" data-snap-field="sharing" type="checkbox"'+(value('sharing',p.sharing)?' checked':'')+'>向好友共享此位置</label>','保存个人设置'):tab==='chat'?(a?threadHTML(state,a):accountsHTML(state)):feedsHTML(state);
        return '<div class="pp-snap pp-snapchat" data-snap-tab="'+tab+'"><header class="pp-snap-top"><span class="pp-snap-brand">'+icon('snapchat')+'<b>'+({chat:'聊天',stories:'故事',spotlight:'聚光灯',map:'地图'})[tab]+'</b></span>'+button('profile','我的账号')+'</header><div class="pp-snap-body" data-snap-page="'+snapEsc([tab,accountId||'',page].join(':'))+'" data-snap-count="'+(a?snapItems(state,'message').filter(m=>m.accountId===a.id).length:0)+'"><p class="pp-snap-status" role="status">'+snapEsc(state.busy?'正在处理…':state.errorKind==='snapchat'&&state.error?state.error:status)+'</p>'+body+'</div><nav class="pp-snap-tabs" aria-label="Snapchat 页面">'+[['chat','聊天','messages'],['stories','故事','stories'],['spotlight','聚光灯','video'],['map','地图','map']].map(([id,label,glyph])=>'<button type="button" data-snap-action="tab" data-snap-id="'+id+'" aria-pressed="'+(tab===id)+'">'+icon(glyph)+'<span>'+label+'</span></button>').join('')+'</nav></div>';
    }
    async function perform(method,args=[],message='') {
        if(!adapter.snapchat){notice('请在酒馆内使用 Snapchat。');return null;}
        if(posting||getView().busy)return null;
        const token=epoch;posting=true;redraw();
        try {const result=await adapter.snapchat[method](...args);if(token!==epoch)return null;if(result?.ok){status=message;return result;}status=result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){if(token===epoch)status=error.message;return null;}
        finally{if(token===epoch)posting=false;redraw();}
    }
    async function queueCurrent(){
        const token=epoch,selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(!message.trim())return;
        const result=await perform('queueMessage',[selected,kind,message]);
        if(token===epoch&&result?.ok&&drafts[draftKey]===message)delete drafts[draftKey];
        redraw();return result;
    }
    async function sendCurrent(){
        const token=epoch,selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(message.trim()) {const added=await perform('queueMessage',[selected,kind,message]);if(token!==epoch||!added?.ok)return;if(drafts[draftKey]===message)delete drafts[draftKey];}
        await perform('flushMessages',[selected]);redraw();
    }
    function back() {
        if(editingId){editingId=null;redraw();return true;}
        if(page==='cash'){page='';redraw();return true;}
        if(!page&&!accountId)return false;
        accountId=null;page='';redraw();return true;
    }
    const api = {
        html, queueCurrent, back,
        reset(){selectedAccounts.clear();epoch++;posting=false;editingId=null;tab='chat';accountId=null;page='';drafts=Object.create(null);status='';},
        input(target){if(target.dataset.snapSelect){if(posting||getView().busy)return;target.checked?selectedAccounts.add(target.dataset.snapSelect):selectedAccounts.delete(target.dataset.snapSelect);redraw();return;}if(target.dataset.snapField)drafts[key(target.dataset.snapField)]=target.type==='checkbox'?target.checked:target.value;},
        async readVisible(){if(reading||posting||getView().busy||!accountId||page==='profile'||!adapter.snapchat)return;if(!snapItems(getView(),'message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;reading=true;try{await adapter.snapchat.markRead(accountId);}finally{reading=false;}},
        async action(action,id) {
            if(action==='add-selected'){const token=epoch,ids=[...selectedAccounts];const result=await perform('inviteMany',[ids]);if(token===epoch&&result?.ok){ids.forEach(id=>selectedAccounts.delete(id));const r=result.value;status='已添加 '+r.friends+' 人，等待通过 '+r.pending+' 人，未通过 '+r.declined+' 人。';redraw();}return;}
            if(action==='edit-message'){editingId=id;drafts[key('editText')]=getView().snapchat[id]?.text||'';redraw();return;}
            if(action==='cancel-edit'){editingId=null;redraw();return;}
            if(action==='reroll-message'){await perform('rerollMessage',[id]);return;}
            if(action==='delete-message'){
                if(!window.confirm('删除这条消息？删除后不会再出现在聊天记录中。'))return;
                await perform('deleteMessage',[id],'已删除消息');return;
            }
            if(action==='tab'){editingId=null;tab=id;accountId=null;page='';status='';redraw();return;}
            if(action==='profile'){editingId=null;page='profile';redraw();return;}
            if(action==='list'){editingId=null;accountId=null;page='';redraw();return;}
            if(action==='thread'){editingId=null;accountId=id;page='';redraw();return;}
            if(action==='cash'){editingId=null;page='cash';redraw();return;}
            if(action==='comment'){editingId=null;page='comment:'+id;redraw();return;}
            const handlers={invite:['invite',[id]],accept:['accept',[id,true]],decline:['accept',[id,false]],block:['block',[id,true]],unblock:['block',[id,false]],reveal:['reveal',[id]],voice:['call',[id,'voice']],video:['call',[id,'video']],hangup:['hangup',[id]],retry:['retryMessage',[id]],refresh:['refresh',[tab]],like:['like',[id]],settle:['settle',[id,true]],cancel:['settle',[id,false]]};
            if(handlers[action])await perform(...handlers[action]);
        },
        async submit(formElement) {
            const data=Object.fromEntries(new FormData(formElement));const formName=formElement.dataset.snapForm;
            const initialKey=key(''),token=epoch;const draftKey=name=>initialKey+name;let result;
            if(formName==='search'){result=await perform('discover',[data.query]);if(token===epoch&&result?.ok)status='搜索完成，新增 '+result.value.added+' 个账号。';}
            if(formName==='profile')result=await perform('saveProfile',[{...data,sharing:data.sharing==='on'}],'已保存个人设置');
            if(formName==='message'){await sendCurrent();return;}
            if(formName==='edit-message'){result=await perform('editMessage',[editingId,data.editText]);if(token===epoch&&result?.ok)editingId=null;}
            if(formName==='story'){result=await perform('publish',[data.storyKind,data.story],'故事已发布');if(token===epoch&&result?.ok)delete drafts[draftKey('story')];}
            if(formName==='comment'){result=await perform('comment',[page.slice(8),data.comment]);if(token===epoch&&result?.ok){delete drafts[draftKey('comment')];page='';}}
            if(formName==='call'){const active=snapItems(getView(),'call').find(c=>c.accountId===accountId&&c.status==='connected');if(active){result=await perform('call',[accountId,active.mode,data.call,active.id]);if(token===epoch&&result?.ok)delete drafts[draftKey('call')];}}
            if(formName==='cash'){
                result=await perform('transfer',[accountId,data.amount,data.currency,data.memo]);
                if(token===epoch&&result?.ok){for(const name of ['amount','memo'])delete drafts[draftKey(name)];page='';await perform('settle',[result.value,true]);}
            }
            redraw();
        },
        press(element){
            const id=element.dataset.snapId,item=getView().snapchat?.[id];
            if(!item||item.type!=='message')return [];
            const busy=!!(posting||getView().busy),actions=[];
            if(item.role==='assistant'){
                actions.push({icon:'edit',label:'修改消息',disabled:busy,run:()=>api.action('edit-message',id)});
                actions.push({icon:'refresh',label:'重新生成消息',disabled:busy,run:()=>api.action('reroll-message',id)});
            }
            actions.push({icon:'delete',label:'删除消息',danger:true,disabled:busy,run:()=>api.action('delete-message',id)});
            return actions;
        },
    };
    return api;
}


const CHAT_APPS = {whatsapp:'WhatsApp',wechat:'微信'};
const chatItems = (state,app,type) => Object.values(state[app]||{}).filter(i=>i.type===type);
const chatUnread = (state,app) => chatItems(state,app,'message').filter(m=>m.role==='assistant'&&!m.read).length;

// A short name is scoped to this request, never saved as a global identity alias.
function matchesFriendName(person,query){
    if(sameNamedPerson(person,{name:query}))return true;
    const short=query.normalize('NFKC').trim().toLowerCase();
    return nameAliases(person).some(alias=>{
        const full=alias.normalize('NFKC').trim().toLowerCase();
        const parts=full.split(/[\s·・•]+/u);
        if(parts.length>1)return parts.includes(short);
        // Unseparated Chinese full name with a single- or double-character surname.
        return /^[\p{Script=Han}]{2,4}$/u.test(full)&&/^[\p{Script=Han}]{1,2}$/u.test(short)
            &&full.endsWith(short)&&[1,2].includes(full.length-short.length);
    });
}
function friendTarget(context,existing,query){
    const members=context.groups?.find(g=>String(g.id)===String(context.groupId))?.members||[];
    const active=(context.characters||[]).filter((c,i)=>context.groupId!=null&&context.groupId!==''?members.includes(c.avatar):context.characterId!=null&&context.characterId!==''&&i===Number(context.characterId));
    const candidates=[...existing,...active].filter(a=>matchesFriendName(a,query));
    if(active.filter(c=>matchesFriendName(c,query)).length>1)throw Error('有多位角色符合这个名字，请输入可区分的姓名。');
    const first=candidates[0];
    if(candidates.some(a=>!sameNamedPerson(first,a)&&!(a.characterId&&a.characterId==='card:'+first.avatar)&&!(first.characterId&&first.characterId==='card:'+a.avatar)))
        throw Error('有多位人物符合这个名字，请补充姓氏或完整姓名。');
    return first||null;
}

    function html() {

        let body='';
        if(page==='add')body='<div class="pp-chat-settings">'+form('add',field('name','好友姓名')+(wc?'':'<small>添加多个好友可以用、间隔名字</small>'),'发送好友申请')+button('bulk','一键添加好友','','',disabled())+'</div>';
        else if(a&&page==='info')body='<div class="pp-chat-settings"><div class="pp-chat-profile">'+avatar(a.name)+'<h2>'+chatEsc(a.name)+'</h2>'+(a.number?'<p>'+chatEsc(a.number)+'</p>':'')+'</div>'+(!wc&&!a.blocked&&a.friend==='friends'?button('cash','转账',a.id,'',disabled()):'')+(!a.identityKnown?button('reveal','自我介绍',a.id,'',disabled()):'')+button(a.blocked?'unblock':'block',a.blocked?'解除拉黑':'加入黑名单',a.id,'',disabled())+'</div>';

    async function perform(method,args=[],message='') {
        if(!adapter[app]){notice('请在酒馆内使用'+label+'。');return null;}
        if(posting||getView().busy)return null;
        const token=epoch;posting=true;redraw();
        try{const result=await adapter[app][method](...args);if(token!==epoch)return null;status=result?.ok?message:result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){if(token===epoch)status=error.message;return null;}
        finally{if(token===epoch)posting=false;redraw();}
    }
    async function queueCurrent(){
        const token=epoch,id=accountId,draftKey=key('message'),text=value('message');
        if(!wc&&value('kind','text')==='transfer'){drafts[key('kind')]='text';page='cash';redraw();return;}
        if(!text.trim())return;
        const result=await perform('queueMessage',[id,value('kind','text'),text]);
        if(token===epoch&&result?.ok&&drafts[draftKey]===text)delete drafts[draftKey];redraw();return result;
    }
    function back(){
        if(editingId){editingId=null;redraw();return true;}
        if(page){page='';redraw();return true;}
        if(accountId){accountId=null;redraw();return true;}
        return false;
    }
    async function bulk(){const token=epoch,result=await perform('addEstablished');if(token===epoch&&result?.ok){status='已添加 '+result.value.added+' 位好友'+(result.value.updated?'，更新 '+result.value.updated+' 位':'')+'。';redraw();}}
    const api={html,back,queueCurrent,
        reset(){epoch++;posting=false;reading=false;tab='chats';accountId=null;page='';editingId=null;status='';drafts=Object.create(null);},
        input(target){const name=target.dataset.chatField;if(name){const changed=value(name)!==target.value;drafts[key(name)]=target.value;
            if(name==='kind'&&!wc&&target.value==='transfer'&&accountId){drafts[key(name)]='text';page='cash';editingId=null;redraw();return;}
            if(name==='filter'&&changed)redraw();}},
        async readVisible(){if(reading||posting||getView().busy||page||!accountId||!adapter[app]||!records('message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;const token=epoch;reading=true;try{await adapter[app].markRead(accountId);}finally{if(token===epoch)reading=false;}},
        async action(action,id){
            if(action==='back'){back();return;}
            if(action==='tab'||action==='contacts'){tab=action==='contacts'?'contacts':id;accountId=null;page='';editingId=null;status='';redraw();return;}
            if(action==='thread'){accountId=id;page='';editingId=null;status='';redraw();return;}
            if(['add','info','cash'].includes(action)){page=action;editingId=null;redraw();return;}
            if(action==='edit'){editingId=id;drafts[key('editText')]=getView()[app]?.[id]?.text||'';redraw();return;}
            if(action==='cancel-edit'){editingId=null;redraw();return;}
            if(action==='later-request'){accountId=null;page='';redraw();return;}
            if(action==='delete'){
                if(!window.confirm('删除这条消息？删除后不会再出现在聊天记录中。'))return;
                await perform('deleteMessage',[id],'已删除消息');return;
            }
            if(action==='bulk'){await bulk();return;}
            const handlers={'accept-request':['accept',[id,true]],'decline-request':['accept',[id,false]],reroll:['rerollMessage',[id]],retry:['retryMessage',[id]],block:['block',[id,true]],unblock:['block',[id,false]],reveal:['reveal',[id]],voice:['call',[id,'voice']],video:['call',[id,'video']],hangup:['hangup',[id]],settle:['settle',[id,true]],cancel:['settle',[id,false]]};
            if(handlers[action])await perform(...handlers[action]);
        },
        async submit(element){
            const data=Object.fromEntries(new FormData(element)),name=element.dataset.chatForm,token=epoch,id=accountId,prefix=key('');
            if(name==='add'){const result=await perform('addByName',[data.name]);if(token===epoch&&result?.ok){status=result.value.details?result.value.details.map(r=>r.name+'：'+r.status).join('；'):result.value.added?'已添加 '+result.value.added+' 位好友。':result.value.already?'对方已经是好友。':'对方未通过好友申请。';redraw();}return;}
            if(name==='profile'){await perform('saveProfile',[{...profile(),alias:data.alias}],'已保存个人设置');return;}
            if(name==='edit'){const result=await perform('editMessage',[editingId,data.editText]);if(token===epoch&&result?.ok)editingId=null;redraw();return;}
            if(name==='message'){
                if(!wc&&value('kind','text')==='transfer'){drafts[key('kind')]='text';page='cash';redraw();return;}
                const text=value('message');
                if(text.trim()){const queued=await perform('queueMessage',[id,value('kind','text'),text]);if(token!==epoch||!queued?.ok)return;if(drafts[prefix+'message']===text)delete drafts[prefix+'message'];}

// Missing replyTo (older direct replies) and null (ambient samples) both
// mean the post itself. Distinct parents, authors and intentional user posts
// keep their own IDs. A child of an old duplicate follows the surviving row.
function xCommentKey(postId, author, text, parent = null) {
    return JSON.stringify([postId, author, parent || null, String(text || '').trim().normalize('NFC').replace(/\s+/gu, ' ')]);
}

function xComments(state) {
    const comments = [], first = new Map(), redirects = new Map();
    for (const row of Object.values(state.x || {})) {
        if (row.type !== 'comment') continue;
        const parent = redirects.get(row.replyTo) || row.replyTo || null;
        const key = xCommentKey(row.postId, row.author, row.text, parent);
        if (row.author !== 'user' && first.has(key)) {
            redirects.set(row.id, first.get(key));
            continue;
        }
        first.set(key, row.id);
        comments.push(parent === (row.replyTo || null) ? row : {...row, replyTo: parent});
    }
    return comments;
}

const X_COMMENT_LIMIT=15;
function visibleXComments(comments) {
    if(comments.length<=X_COMMENT_LIMIT)return comments;
    const byId=new Map(comments.map(c=>[c.id,c])),selected=new Set();
    // Keep recent direct conversations visible together with their parents.
    const recent=[...comments].reverse();
    for(const comment of [...recent.filter(c=>!c.ambient),...recent.filter(c=>c.ambient)]){
        if(selected.size===X_COMMENT_LIMIT)break;
        const chain=new Set();
        for(let c=comment;c&&!selected.has(c.id)&&!chain.has(c.id);c=byId.get(c.replyTo))chain.add(c.id);
        if(selected.size+chain.size<=X_COMMENT_LIMIT)for(const id of chain)selected.add(id);
    }
    return comments.filter(c=>selected.has(c.id));
}

function resolveEdits(state,fields,edits){

const metric = n => Number.isFinite(Number(n)) ? Math.min(Number.MAX_SAFE_INTEGER,Math.max(0,Math.floor(Number(n)))) : 0;
function xCounts(state,post) {
    const comments=xItems(state,'comment').filter(c=>c.postId===post.id);
    const direct = comments.filter(c=>!c.ambient).length, ambient = comments.length-direct;
    const aggregate = metric(post.metrics?.replies);

const shopText=(s,n=2000)=>typeof s==='string'?s.trim().slice(0,n):'';
const shopItems=(state,type)=>Object.values(state.orders||{}).filter(x=>x.type===type);
const shopMoney=(minor,currency)=>formatMoney(minor,currency)+' '+currency;

const DELIVERY_KEY='durian_phone_delivery';
const deliverySafe=value=>JSON.stringify(value).replace(/\{\{/g,'\\u007b\\u007b');
function orderClock(order,chat){return readStoryClock((chat||[]).slice(order.sourceIndex+1),{day:order.createdDay,hour:order.createdHour});}
function deliveryReceipt(order,chat){
    let clock={day:order.createdDay,hour:order.createdHour};
    for(let i=order.sourceIndex+1;i<(chat||[]).length;i++){
        const m=chat[i];clock=readStoryClock([m],clock);if(m.is_user||(m.is_system&&!isMemoryHidden(m)))continue;
        if(clock.day<order.dueDay||clock.hour===null||clock.hour<9||clock.hour>=18)continue;
        const text=String(m.mes||'').replace(/```[\s\S]*?```/g,'').replace(/<(think|thinking|script|style)[^>]*>[\s\S]*?<\/\1>/gi,'');
        for(const match of text.matchAll(/<!--\s*durian-delivery\s*:\s*([\s\S]*?)-->/g)){
            try{const receipt=JSON.parse(match[1]);
                // A delivery marker naming this order with arrived:true is the
                // receipt itself; arrival quotes are no longer required.
                if(receipt.id===order.id&&receipt.arrived===true)return {index:i,date:dayDate(clock.day)};
            }catch{/* An incomplete generated marker is not a receipt. */}
        }
    }
    return null;
}
function deliveryStatus(order,chat){
    const receipt=deliveryReceipt(order,chat);if(receipt)return {label:'已送达',delivered:true,receipt};
    const clock=orderClock(order,chat);
    return {label:clock.day>order.createdDay?'运输中':'待发货',delivered:false,clock};
}
function dueOrders(state,chat){return Object.values(state.orders||{}).filter(o=>{
    if(o.type!=='order'||deliveryReceipt(o,chat))return false;
    const clock=orderClock(o,chat);return clock.day>=o.dueDay&&clock.hour!==null&&clock.hour>=9&&clock.hour<18;
});}

const assetRows = (state, type) => Object.values(state.assets || {}).filter(x => x.type === type);

const assetText = (s, max = 180) => typeof s === 'string' ? s.trim().slice(0, max) : '';
function moneyMinor(value, signed = false, currency = 'USD') {
    const digits = currencyDigits(currency);
    const match = /^(-?)(\d{1,12})(?:\.(\d+))?$/.exec(String(value));
    if (!match || (!signed && match[1]) || (match[3] || '').replace(/0+$/,'').length > digits) throw Error('账本金额格式不正确。');
    const n = (match[1] ? -1 : 1) * (Number(match[2]) * unitScale(currency) + Number((match[3] || '').slice(0,digits).padEnd(digits,'0')));

        .reduce((sum, t) => sum + t.deltaMinor, wallet.openingMinor);

}

    const balance = cashBalance(state);

    if (assetRows(state, 'story_event').some(e => e.kind === 'expense' && !e.processed)) throw Error('还有待结算的支出，请先在小榴莲点击「一键更新」。');

// Payday covers [previous month's 15th, this month's 15th). Partial employment
// earns the corresponding fraction; all calculations use fictional UTC dates.
function salaryPayments(state, throughDay) {
    const wallet = state.assets?.wallet;
    if (!wallet || !Number.isInteger(throughDay) || throughDay < wallet.startDay) return [];
    const changes = [];
    const first = new Date(wallet.startDay * 86400000);
    let year = first.getUTCFullYear(), month = first.getUTCMonth();
    const end = new Date(throughDay * 86400000);
    for (; year < end.getUTCFullYear() || year === end.getUTCFullYear() && month <= end.getUTCMonth(); month++) {
        if (month === 12) { year++; month = 0; }
        const due = dateDay(`${year}-${String(month + 1).padStart(2, '0')}-15`);
        if (due > throughDay) break;
        if (due <= wallet.startDay) continue;
        const prevYear = month === 0 ? year - 1 : year, prevMonth = month === 0 ? 12 : month;
        const from = dateDay(`${prevYear}-${String(prevMonth).padStart(2, '0')}-15`);
        const groups = new Map();
        for (const job of assetRows(state, 'job')) {
            if (job.monthlyMinor === null || job.monthlyMinor === undefined) continue;
            const days = Math.max(0, Math.min(due, job.endDay ?? due) - Math.max(from, job.startDay, wallet.startDay));
            if (!days) continue;
            const group = groups.get(job.employer) || { amount: 0, name: job.name };
            group.amount += job.monthlyMinor * days / (due - from);
            groups.set(job.employer, group);
        }
        for (const [employer, group] of groups) {
            const id = 'salary:' + employer + ':' + dayDate(due);
            const explicit = assetRows(state, 'cash_transaction').filter(t => t.currency === walletCurrency(state) && t.salaryEmployer === employer && t.payDate === dayDate(due) && t.id !== id)
                .reduce((sum, t) => sum + Math.max(0, t.deltaMinor), 0);
            const amount = Math.max(0, Math.round(group.amount) - explicit);
            if (!state.assets[id]) changes.push(assetSet(cashRecord(id, amount, group.name + ' · ' + dayDate(due) + ' 工资', { currency:walletCurrency(state), source: 'salary', salaryEmployer: employer, payDate: dayDate(due), day: due })));
        }
    }
    return changes;
}

function recentCash(state) {
    return assetRows(state, 'cash_transaction').map((t, index) => ({ t, index })).filter(({ t }) => t.deltaMinor !== 0)
        .sort((a, b) => (b.t.createdAt || 0) - (a.t.createdAt || 0) || b.index - a.index).slice(0, 6).map(({ t }) => t);
}
function debtEpisode(state) {
    if (cashBalance(state) === null) return null;
    const wallet = state.assets.wallet, ignored = new Set(wallet.included || []);

    for (const t of assetRows(state, 'cash_transaction').filter(t => t.currency === walletCurrency(state) && !ignored.has(t.id))) {

        if (balance >= 0) id = null;
        else if (prior >= 0) id = 'debt:' + t.id;
    }
    return id;
}

const normalize = value => String(value ?? '').normalize('NFKC')

function financialEvidenceMatches(prose, evidence) {
    if (typeof evidence !== 'string') return false;
    const source = normalize(prose), quote = normalize(evidence);
    if (quote.length < 4) return false;
    if (source.includes(quote)) return true;
    const parts = quote.split(/(?:\.{3,}|…+|⋯+)/u);
    if (parts.length < 2 || parts.some(p => p.length < 8) || parts.join('').length < 24) return false;
    let cursor = 0;
    for (const part of parts) {
        const at = source.indexOf(part, cursor);
        if (at < 0) return false;
        cursor = at + part.length;
    }
    return true;
}

const nameKey = name => assetText(name).normalize('NFKC').replace(/\s+/g, '').toLowerCase();

// a known real city is real unless the world declares itself fictional (an
// explicit fictional marker beside the city name or a world-level declaration),
// a city named in the world setting is fictional, and anything else stays
// unconfirmed — never silently borrowing a same-named real city's climate.
function locationKind(city, context) {
    const name = normCity(city);
    if (!name) return 'unconfirmed';
    const material = typeof context === 'object' && context ? worldMaterial(context) : [];
    if (CITY_TABLE[name]) {
        const nearCity = material.some(text => text.includes(city) && /架空|虚构|异世界/.test(text));
        const worldDeclared = /架空世界|异世界|平行世界|另一个世界/.test(material.join('\n'));
        return nearCity || worldDeclared ? 'fictional' : 'real';
    }
    return material.some(text => text.includes(city)) ? 'fictional' : 'unconfirmed';

function worldMaterial(context) {
    return establishedSources(context || {}).map(source => String(source.text || '')).filter(Boolean);

    ['am', ['季风', '雨季漫长']],

const hash32 = text => { let h = 2166136261; for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

// City tags are hidden markers; no evidence field is required or accepted.
function locationAnnotations(message) {
    if (message?.is_user || (message?.is_system && !isMemoryHidden(message))) return [];
    const text = String(message?.mes || '').replace(/```[\s\S]*?```/g, '').replace(/<(think|thinking|analysis|script|style)[^>]*>[\s\S]*?<\/\1>/gi, '');
    const rows = [];
    for (const match of text.matchAll(/<!--\s*durian-location\s*:\s*([\s\S]*?)-->/g)) {
        try {
            const row = JSON.parse(match[1]);
            const city = typeof row?.city === 'string' ? row.city.trim() : '';
            if (city && city.length <= 60 && !/[\r\n<>]/.test(city)) rows.push({ city });
        } catch { /* an incomplete marker never moves the location */ }
    }
    return rows;
}

// The single authoritative location record: one journal event per narrative
// city change, so floor rollback restores the previous city automatically.
function importStoryLocation(raw, revisions, chat, context) {
    let journal = raw, state = replayJournal(raw), changed = false;
    for (let index = 0; index < chat.length; index++) {
        if (!effectiveReply(chat[index])) continue;
        const id = 'story-location:' + revisions[index];
        if (journal?.events.some(event => event.id === id)) continue;
        const row = locationAnnotations(chat[index]).at(-1);
        if (!row) continue;
        const current = state.location?.current;
        if (current && norm(current.city) === norm(row.city)) continue;
        journal = appendChange(journal, revisions.slice(0, index + 1), [{ collection: 'location', key: 'current', value: { city: row.city, sourceIndex: index } }], id);
        state = replayJournal(journal);
        changed = true;
    }
    // Shared importer contract: {journal, changed}, like every other importer.
    return { journal, changed };
}
