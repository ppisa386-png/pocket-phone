</style></head><body><main><small>POCKET PHONE · 0.24.3</small><h1>榴莲手机，先从这里开始。</h1><p>这是离线界面预览，可以查看桌面、设置及 Snapchat 页面。模型互动需安装到酒馆后使用。</p><div class="actions"><button id="preview-open">打开手机</button><button id="preview-settings">打开设置</button></div><div class="card"><strong>悬浮入口</strong><label><input id="preview-visibility" type="checkbox">显示悬浮入口</label><button id="preview-reset">重置悬浮位置</button><p style="font-size:12px;margin-bottom:0">安装到酒馆后，这组控制位于扩展栏的「榴莲手机」条目中。</p></div><ol><li>检查手机窗口是否挡住操作、字号是否合适。</li><li>在「设置 → App 管理」关闭、重新开启应用。</li><li>修改提示词和重试次数，刷新后检查是否保留。</li></ol><p id="storage-note" hidden>当前打开方式不支持保存预览设置；本次修改只在页面关闭前保留。可换用浏览器打开。</p><footer>预览数据独立于酒馆。本文件无需联网，不请求模型。</footer></main><script>// Read scene timestamps locally. No wall-clock fallback and no model calls.
function dateDay(value) {
    const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;
    const d=new Date(0);d.setUTCFullYear(+m[1],+m[2]-1,+m[3]);d.setUTCHours(0,0,0,0);
    return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]?Math.floor(d.getTime()/86400000):null;
}
const dayDate = day => Number.isInteger(day)?new Date(day*86400000).toISOString().slice(0,10):'';
function readStoryClock(chat, seed=null, { exact = false } = {}) {
    let day=seed?.day??null,hour=seed?.hour??null;
    for(const m of chat||[]){
        if(m.is_system&&!m.extra?.qianqianjieAutoHide)continue;
        const text=String(m.mes||'').replace(/```[\s\S]*?```/g,'').replace(/<(script|style|think|thinking)[^>]*>[\s\S]*?<\/\1>/gi,'')
            .replace(/<!--\s*SDC-(?:start|end)\s*\|([\s\S]*?)-->/gi,(_,body)=>{
                const date=body.match(/(?:^|\|)\s*date\s*=\s*([^|]+)/i)?.[1]?.trim();
                const time=body.match(/(?:^|\|)\s*time\s*=\s*(\d{1,2}:\d{2})/i)?.[1];
                return date?'\n'+date+(time?' '+time:'')+'\n':'';
            }).replace(/<!--[\s\S]*?-->/g,'').replace(/<[^>]*>/g,'\n');
        const lines=text.split('\n').map(s=>s.replace(/^[\s*#|]+|[\s*|]+$/g,'')).filter(Boolean);
        for(const line of lines){
            const t=line.match(/^(?:(?:当前|剧情|故事)?(?:日期|时间)|Date|Time|Scene time)?\s*[:：]?\s*(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?:\s|$|[T,，|])/i);
            const md=!t&&day!==null?line.match(/^(?:(?:当前|剧情)?(?:日期|时间)|Date|Time)\s*[:：]\s*(\d{1,2})[-月/.](\d{1,2})日?/i):null;
            let next=null;
            if(t)next=dateDay(`${t[1]}-${t[2].padStart(2,'0')}-${t[3].padStart(2,'0')}`);
            if(md)next=dateDay(`${dayDate(day).slice(0,4)}-${md[1].padStart(2,'0')}-${md[2].padStart(2,'0')}`);
            if(next!==null){if(next!==day)hour=null;day=next;}
            // Only scene-opening relative transitions, never mentions in dialogue.
            const relative=line===lines[0]?line.match(/^(?:第二天|次日|翌日|隔天|the next day|the following morning)|^([一二两三四五六七八九十\d]+)天后|^(\d+) days? later/i):null;
            if(relative&&day!==null){const n=relative[1]||relative[2];const count=n?(/^\d+$/.test(n)?+n:{一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10}[n]):1;if(count){day+=count;hour=null;}}
            const sceneLine=!!t||!!md||!!relative||/^(?:(?:当前|剧情|故事)?时间|Time|Scene time)\s*[:：]/i.test(line);
            if(sceneLine){
                const tm=line.match(/(?:\b|[T\s：:])(\d{1,2})[:：](\d{2})(?:\s*(AM|PM))?/i);
                if(tm&&+tm[1]<24&&+tm[2]<60){let h=+tm[1];if(tm[3]){h=h%12+(/pm/i.test(tm[3])?12:0);}hour=h+(+tm[2]/60);}
                else if(exact && /凌晨|半夜|晚上|夜晚|夜间|下午|午后|中午|正午|上午|早上|清晨|黎明|midnight|night|evening|afternoon|noon|morning|dawn/i.test(line))hour=null;
                else if(/凌晨|半夜|midnight/i.test(line))hour=2;
                else if(/晚上|夜晚|夜间|night|evening/i.test(line))hour=21;
                else if(/下午|午后|afternoon/i.test(line))hour=15;
                else if(/中午|正午|noon/i.test(line))hour=12;
                else if(/上午|早上|morning/i.test(line))hour=10;
                else if(/清晨|黎明|dawn/i.test(line))hour=7;
            }
        }
    }
    return {day,hour};
}

// Stored story anchors are distinct from createdAt (local ordering only).
function storyTime(chat) {
    const {day,hour}=readStoryClock(chat);
    return {date:dayDate(day), time:hour==null?'':String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0'), precision:'scene'};
}
const displayStoryTime = item => /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(item?.storyTime?.time||'') ? item.storyTime.time : '—';

// Shared display-name rules. Original names stay as aliases for identity lookup.
const CHINESE_NAME_RULE = '\n手机姓名显示规则（所有 App 共用）：电话簿、短信联系人、好友、关注列表及账号显示姓名一律用中文。外文姓名优先采用人物设定/人设/世界书中已经使用的中译名，完整照用，不擅自换译名；没有中译名才按原姓名音译成中文。同一人只保留一个中文姓名，不能中英文各返回一个联系人，也不要在显示姓名中附英文括号。人物或地点联系人的 name 填中文显示名，aliases 数组保留原文姓名及设定已有别名，供识别同一人物。地点联系人的名称也用中文。商品名、品牌名不属于此规则。此规则只控制姓名标签，不改变短信、帖子、对白等内容所遵循的酒馆预设语言；handle/@账号、内部 id 和 user 自己设置的网名保持原值，不翻译或改写。';

const key = s => String(s || '').normalize('NFKC').trim().toLowerCase().replace(/[\s·.・'’_-]/g,'');
const han = s => /\p{Script=Han}/u.test(s || '');
const nameAliases = item => [...new Set([item?.name,...(Array.isArray(item?.aliases) ? item.aliases : [])].filter(n => typeof n === 'string' && n.trim()).map(n => n.trim().slice(0,100)))];
function sameNamedPerson(a,b) {
    const keys = nameAliases(a).map(key);
    return nameAliases(b).some(n => keys.includes(key(n)));
}
function localizedPerson(item, context, existing = []) {
    const aliases = nameAliases(item), probe = {aliases};
    const cards = (context.characters || []).map((c,index) => ({c,index})).filter(({c}) => sameNamedPerson(probe,c));
    const card = cards.length === 1 ? cards[0] : null;
    const old = [...new Map(existing.filter(c => sameNamedPerson(probe,c)).map(c => [c.id,c])).values()];
    const known = old.length === 1 ? old[0] : null;
    const material = [context.powerUserSettings?.persona_description,...(context.characters || []).flatMap(c => {
        const d = c.data || c;
        return [c.name,d.description,d.personality,d.scenario,...(d.character_book?.entries || []).filter(e => e.enabled !== false).map(e => e.content)];
    })].filter(Boolean).join('\n');
    const chinese = aliases.filter(han);
    let name = (han(card?.c.name) ? card.c.name : null) || chinese.find(n => material.includes(n)) || (han(known?.name) ? known.name : null) || chinese[0] || aliases[0] || '';
    const complete = [...chinese, ...nameAliases(known).filter(han)].find(n => n.startsWith(name + '·') && (n === known?.name || material.concat('\n',context.name1 || '').includes(n.slice(name.length + 1))));
    if (complete) name = complete;
    return {name,aliases:[...new Set([...aliases,...nameAliases(known),...(card ? [card.c.name] : []),name])],cardIndex:card?.index ?? null,cardId:card ? 'card:' + (card.c.avatar || card.c.name) : null,existingId:known?.id ?? null};
}

const PROMPTS = {

    storyContact: {name:'正文来电与短信',text:'正文决定实际发生的通信，小手机只保存记录。结合人设、关系、世界观、当前场景和已经发生的手机交流判断联系动机与获取号码的合理途径，不限恋人或既有好友，不要求专门的交换号码情节。日常问候、追求、打听消息、分享或事务都可以，也可以不联系。接听或拒接依正文的扮演规则与当前剧情决定，不凭空替 user 作决定。只记录本次 user 确实发出或收到的短信及拨出或接到的电话，不记录其他人物之间的通信，不重演旧记录、不以记录指令代替正文。'},

    incoming: { name: '主动来电', text: '依据角色性格、双方关系、剧情时间和已有通信决定是否来电。想念、关心、分享生活、异地伴侣的日常联络都是合理动机，不必等危机或新任务；也不因恋人标签强制每次联系。角色必须有已知 user 号码或可用获取途径的依据，可核对正文、人设、当前角色卡及当前聊天的有效记忆。设定中已建立正常电话联络的亲友无需重新交换号码；仅单向知晓、暗恋、匿名关系或知名度不等于已知号码，失联、秘密身份、无法通信等当前设定优先。共友需有依据且确实能提供号码；公开渠道需可访问。不打断面对面交流，不重复正文已发生的联系。' },

const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);

function normalizeApiSettings(value) {

}

function normalizeSettings(value) {
    const raw = isRecord(value) ? value : {};
    const { contactInterval, unansweredInterval, contactEvents, contactExceptions, ...current } = raw;
    const oldApps = isRecord(raw.apps) ? raw.apps : {};

    const oldPrompts = isRecord(raw.prompts) ? raw.prompts : {};
    return {
        ...current,
        schemaVersion: 1,
        api: normalizeApiSettings(api),
        apiProfiles,
        apiProfileId: apiProfiles.some(p => p.id === raw.apiProfileId) ? raw.apiProfileId : '',
        launcherVisible: typeof raw.launcherVisible === 'boolean' ? raw.launcherVisible : true,
        position: isRecord(raw.position) ? { x: numeric(raw.position.x, 0, 1, 1), y: numeric(raw.position.y, 0, 1, 0.8) } : null,

    };

function clampPosition(position, viewport, size = LAUNCHER_SIZE) {
    const margin = 8;
    const maxX = Math.max(margin, viewport.width - size - margin);
    const maxY = Math.max(margin, viewport.height - size - margin);
    return {
        x: Math.min(maxX, Math.max(margin, position?.x ?? maxX)),
        y: Math.min(maxY, Math.max(margin, position?.y ?? Math.max(margin, maxY * 0.8))),
    };
}

// Desktop Enter and mobile soft-keyboard line breaks share the same local action.
function bindComposerKeys(root,{queue,onError=()=>{},signal}) {
    const selector='textarea[data-sms-draft],textarea[data-snap-field="message"]';
    const composing=new WeakSet(),finishing=new WeakSet();
    let pending=false;
    const composer=event=>event.target?.matches?.(selector)?event.target:null;
    function submit(event) {
        const input=composer(event);if(!input||input.disabled)return;
        if(event.isComposing||event.keyCode===229||composing.has(input)||finishing.has(input))return;
        event.preventDefault();
        if(pending||!input.value.trim())return;
        pending=true;
        Promise.resolve().then(()=>queue(input)).catch(onError).finally(()=>{pending=false;});
    }
    root.addEventListener('compositionstart',e=>{const input=composer(e);if(input)composing.add(input);},{signal});
    root.addEventListener('compositionend',e=>{const input=composer(e);if(input){composing.delete(input);finishing.add(input);setTimeout(()=>finishing.delete(input),0);}},{signal});
    root.addEventListener('keydown',e=>{if(e.key==='Enter')submit(e);},{signal});
    root.addEventListener('beforeinput',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType)&&e.cancelable)submit(e);},{signal});
    // Some mobile keyboards deliver only a non-cancelable input event.
    root.addEventListener('input',e=>{if(['insertLineBreak','insertParagraph'].includes(e.inputType))submit(e);},{signal});
}

// Local, bounded error history. Never persist request bodies, responses or keys.
function createDiagnostics({storage, version = '', getSecrets = () => []} = {}) {
    if (storage === undefined) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const key = 'durian_phone_errors_v1';
    let entries = [];
    const clean = (value, secrets = []) => {
        let text = String(value ?? '');
        for (const secret of [...getSecrets(), ...secrets].filter(s=>typeof s==='string'&&s).sort((a,b)=>b.length-a.length)) text=text.split(secret).join('[已隐藏]');
        return text.replace(/\bBearer\s+[^\s"',;]+/gi,'Bearer [已隐藏]')
            .replace(/((?:api[_-]?key|proxy_password|authorization|access_token|密钥)["']?\s*[:=]\s*["']?)[^\s"',;}&]+/gi,'$1[已隐藏]')
            .replace(/\bsk-[a-zA-Z0-9_-]+/g,'[已隐藏]')
            .replace(/https?:\/\/[^\s<>"']+/g, url => { try { const u=new URL(url);u.username='';u.password='';u.search='';u.hash='';return u.toString(); } catch { return '[地址已隐藏]'; } })
            .slice(0,1500);
    };
    try {
        const saved=JSON.parse(storage?.getItem(key)||'[]');
        if(Array.isArray(saved))entries=saved.filter(e=>e&&typeof e.message==='string').slice(-100).map(e=>({time:clean(e.time),version:clean(e.version),source:clean(e.source),message:clean(e.message)}));
    } catch { /* A malformed log must never block the phone. */ }
    let persisted = true;
    function save() { try { if(!storage)throw Error();storage.setItem(key,JSON.stringify(entries));persisted=true; } catch { persisted=false; } }
    return {
        add(error, source = '运行', secrets = []) {
            const message=clean(error?.message ?? error ?? '未知错误',secrets)+(typeof error?.diagnostic==='string'?'\n'+clean(error.diagnostic,secrets):'');
            entries.push({time:new Date().toISOString(),version,source:clean(source,secrets),message});
            entries=entries.slice(-100);save();
        },
        list: () => structuredClone(entries).reverse(),
        persistent: () => persisted,
        clear() { entries=[];save(); },
        text() { return (entries.length ? '当前运行版本：榴莲手机 ' + version + '\n（以下每条版本为报错发生时的版本；更新插件后请刷新酒馆页面。）\n\n' : '') + entries.slice().reverse().map(e=>'['+e.time+'] 榴莲手机 '+e.version+' · '+e.source+'\n'+e.message).join('\n\n'); },
    };
}

// Independent OpenAI-compatible requests go through the existing ST backend.
// Never overwrite the host's connection settings or borrow its provider keys.
function normalizeApiUrl(value) {
    let url;
    try { url = new URL(String(value ?? '').trim()); } catch { throw new Error('请填写完整 API 地址，例如 https://example.com/v1'); }
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('API 地址仅支持 HTTP/HTTPS，不要在地址里填写密钥或查询参数。');
    url.pathname = url.pathname.replace(/\/(?:chat\/completions|models)\/?$/, '').replace(/\/+$/, '') || '/v1';
    return url.toString().replace(/\/$/, '');
}

function createKeyStore(storage) {
    if (arguments.length === 0) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const prefix = 'durian_phone_api_key:';
    return {
        get(url, profileId = '') { try { return storage?.getItem(prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url)) ?? ''; } catch { return ''; } },
        secrets() {
            try { return Array.from({length: storage?.length || 0}, (_, i) => storage.key(i)).filter(k => k?.startsWith(prefix)).map(k => storage.getItem(k)).filter(Boolean); } catch { return []; }
        },
        set(url, key, profileId = '') {
            if (!storage) throw new Error('当前浏览器不能保存密钥，请检查浏览器存储设置。');
            const name = prefix + (profileId ? 'profile:' + profileId + ':' : '') + normalizeApiUrl(url);
            try { key ? storage.setItem(name, key) : storage.removeItem(name); }
            catch { throw new Error('密钥保存失败，请检查浏览器存储空间或权限。'); }
        },
    };
}

function failure(message, retryable = false) { return Object.assign(new Error(message), { retryable }); }
function apiError(status, data) {
    const code = String(data?.error?.code || data?.error?.type || '').toLowerCase();
    if (status === 401 || status === 403 || /authentication|invalid_api_key/.test(code)) return failure('认证失败，请检查这个地址对应的 API 密钥和访问权限。');
    if (status === 429 || /quota|rate_limit/.test(code)) return failure('服务额度不足或请求过于频繁，请稍后重试。', status === 429);
    if (status === 404 || /model_not_found/.test(code)) return failure('找不到接口或模型，请检查 API 地址及模型 ID。');
    if (/context_length/.test(code)) return failure('请求超出模型上下文，请减少读取的正文楼数。');
    return failure('API 请求失败' + (status ? '（HTTP ' + status + '）' : '') + '，请检查服务地址、模型与酒馆服务端连接。', status >= 500);
}

function extractApiText(data) {
    if (data?.error) throw apiError(0, data);
    if (data?.choices?.[0]?.finish_reason === 'length') throw failure('模型输出被截断，请提高回复 token 上限。');
    const content = data?.choices?.[0]?.message?.content;
    const text = typeof content === 'string' ? content : Array.isArray(content) ? content.filter(p => p.type === 'text').map(p => p.text).join('') : '';
    if (!text.trim()) throw failure('模型没有返回文字，请检查模型是否支持 Chat Completions，或提高回复 token 上限。');
    return text.trim();
}

function createApiClient({ getContext, getSettings, getKey, prepareRequest, fetchImpl = globalThis.fetch }) {
    const active = new Set();
    let cancelEpoch = 0;
    async function post(path, config, key, extra, isCurrent = () => true) {
        const endpoint = normalizeApiUrl(config.baseUrl);
        const host = getContext();
        if (typeof host?.getRequestHeaders !== 'function') throw failure('当前酒馆缺少请求接口，请更新酒馆后使用独立 API。');
        if (/\r|\n/.test(key)) throw failure('密钥不能包含换行，请重新粘贴。');
        if (!isCurrent()) throw failure('本次操作已取消。');
        const controller = new AbortController(); active.add(controller);
        let timedOut = false;
        const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, config.timeout * 1000);
        const watcher = setInterval(() => { if (!isCurrent()) controller.abort(); }, 150);
        try {
            const response = await fetchImpl('/api/backends/chat-completions/' + path, {
                method: 'POST', headers: host.getRequestHeaders(), credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
                body: JSON.stringify({ chat_completion_source: 'openai', reverse_proxy: endpoint, proxy_password: key, ...extra }),
            });
            if (!isCurrent()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            let data;
            try { data = await response.json(); } catch { throw failure('接口没有返回有效 JSON，请检查 API 地址和酒馆版本。'); }
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (!response.ok || data?.error) throw apiError(response.status, data);
            return data;
        } catch (error) {
            if (timedOut) throw failure('API 请求超时，可调整超时时间后重试。', true);
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (error && typeof error === 'object' && 'retryable' in error) throw error;
            // Provider error bodies can echo credentials: never display them.
            throw failure('无法连接 API，请检查酒馆服务端网络与服务地址。', true);
        } finally { clearTimeout(timeout); clearInterval(watcher); active.delete(controller); }
    }
    async function complete(config, key, messages, isCurrent) {
        if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
        return extractApiText(await post('generate', config, key, { model: config.model.trim(), messages, stream: false,
            max_tokens: config.maxTokens }, isCurrent));
    }
    return {
        async generate(prompt, contact, isCurrent) {
            const config = structuredClone(getSettings().api);
            normalizeApiUrl(config.baseUrl);
            if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
            const key = getKey(config.baseUrl);
            const fingerprint = JSON.stringify(config), epoch = cancelEpoch;
            const current = () => epoch === cancelEpoch && isCurrent() && fingerprint === JSON.stringify(getSettings().api) && key === getKey(config.baseUrl);
            const prepared = await prepareRequest(getContext(), prompt, contact, current);
            if (!current()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            return extractApiText(await post('generate', config, key, independentPayload(prepared, config), current));
        },
        async models(config, key, isCurrent) {
            const data = await post('status', config, key, {}, isCurrent);
            if (!Array.isArray(data?.data)) throw failure('服务没有返回模型列表，请手动填写模型 ID。');
            return [...new Set(data.data.map(item => item?.id).filter(id => typeof id === 'string' && id.length < 300))].sort();
        },
        test(config, key, isCurrent) {
            return complete({ ...config, maxTokens: Math.max(128, Math.min(config.maxTokens, 1024)) }, key,
                [{ role: 'user', content: 'Connection test. Reply only: OK' }], isCurrent);
        },
        cancel() { cancelEpoch++; for (const controller of active) controller.abort(); },
    };
}

// Keep prompt contents and portable preset parameters. Never forward the host's
// URL, authorization headers, custom endpoint configuration or account fields.
function independentPayload(prepared, config) {
    const fields = ['messages','temperature','frequency_penalty','presence_penalty','top_p','top_k','min_p','top_a','typical_p',
        'max_tokens','max_completion_tokens','stop','seed','logit_bias','logprobs','top_logprobs',
        'include_reasoning','reasoning_effort','verbosity','custom_prompt_post_processing','user_name','char_name','group_names',
        'tools','tool_choice','response_format','json_schema'];
    if (!Array.isArray(prepared?.messages) || !prepared.messages.length) throw failure('酒馆没有提供有效的生成内容。');
    const payload = Object.fromEntries(fields.filter(k => prepared[k] !== undefined).map(k => [k, prepared[k]]));
    return { ...payload, model: config.model.trim(), stream: false, type: 'quiet' };
}

const apiEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function createApiPanel({ adapter, getSettings, persist, redraw }) {
    let selectedProfile = '', profileName = '';
    const profiles = () => getSettings().apiProfiles || [];
    const activeId = () => getSettings().apiProfileId || '';
    let draft = null, key = '', tab = 'connection', models = [], status = '', statusKind = '', busy = false, token = 0;
    function init() { if (!draft) { draft = structuredClone(getSettings().api); key = adapter.keyStore?.get(draft.baseUrl, activeId()) || ''; } }
    function field(id, label, type = 'text', extra = '') {
        const value = id === 'key' ? key : draft[id];
        return '<label class="pp-field"><span>' + label + '</span><input data-api-field="' + id + '" type="' + type + '" value="' + apiEscape(value) + '" ' + extra + (busy ? ' disabled' : '') + '></label>';
    }
    function config(requireModel = true) {
        init();
        const value = { ...draft, baseUrl: normalizeApiUrl(draft.baseUrl), model: draft.model.trim() };
        if (requireModel && !value.model) throw new Error('请填写或选择模型 ID。');
        for (const [id, min, max] of [['timeout', 15, 300]]) {
            if (!Number.isInteger(value[id]) || value[id] < min || value[id] > max) throw new Error('请在参数页填写范围内的整数。');
        }
        if (/\r|\n/.test(key)) throw new Error('密钥不能包含换行。');
        return value;
    }
    return {
        html() {
            init();
            const disabled = busy ? ' disabled' : '';
            let body = '';
            const activeName = profiles().find(p => p.id === activeId())?.name || '未命名配置';
            if (tab === 'connection') {
                body = '<div class="pp-card pp-form"><label class="pp-field"><span>手机模型连接</span><select data-api-field="mode"' + disabled + '><option value="host"' + (draft.mode === 'host' ? ' selected' : '') + '>跟随酒馆</option><option value="independent"' + (draft.mode === 'independent' ? ' selected' : '') + '>独立 API（OpenAI 兼容）</option></select></label>';
                if (draft.mode === 'independent') body += field('baseUrl', 'API 地址', 'url', 'placeholder="https://example.com/v1" autocomplete="off" spellcheck="false"') +
                    field('key', 'API 密钥', 'password', 'autocomplete="off" spellcheck="false" placeholder="无需密钥的本地服务可留空"') +
                    field('model', '模型 ID', 'text', 'autocomplete="off" spellcheck="false" placeholder="填写服务商提供的模型 ID"') +
                    (models.length ? '<label class="pp-field"><span>已获取的模型</span><select data-api-field="modelChoice"' + disabled + '><option value="">选择模型</option>' + models.map(id => '<option value="' + apiEscape(id) + '"' + (draft.model === id ? ' selected' : '') + '>' + apiEscape(id) + '</option>').join('') + '</select></label>' : '') +
                    '<div class="pp-api-actions"><button type="button" class="pp-text-button" data-api-action="models"' + disabled + '>获取模型</button><button type="button" class="pp-text-button" data-api-action="test"' + disabled + '>测试连接</button><button type="button" class="pp-text-button" data-api-action="clear-key"' + disabled + '>清除密钥</button></div>';
                else body += '<p class="pp-footnote">使用酒馆当前模型连接和完整生成流程。</p>';
                body += '</div><p class="pp-footnote">独立 API 不修改酒馆正文连接。支持 OpenAI 兼容的 Chat Completions 接口；原生 Claude/Gemini 接口需使用兼容地址。</p><p class="pp-footnote">密钥按方案和地址仅保存在当前浏览器，不进入聊天记录或插件设置导出。更换浏览器需重新填写。切换地址不会沿用原地址的密钥。</p>';
            } else if (tab === 'profiles') {
                body = '<p class="pp-footnote">当前使用：' + apiEscape(activeName) + '</p><div class="pp-card pp-form"><label class="pp-field"><span>已保存方案</span><select data-api-field="selectedProfile"' + disabled + '><option value="">选择方案</option>' + profiles().map(p => '<option value="' + apiEscape(p.id) + '"' + (selectedProfile === p.id ? ' selected' : '') + '>' + apiEscape(p.name) + '</option>').join('') + '</select></label><div class="pp-api-actions"><button type="button" class="pp-text-button" data-api-action="profile-use"' + disabled + '>使用方案</button><button type="button" class="pp-text-button" data-api-action="profile-delete"' + disabled + '>删除方案</button></div></div>' +
                    '<div class="pp-card pp-form"><label class="pp-field"><span>新方案名称</span><input data-api-field="profileName" maxlength="80" value="' + apiEscape(profileName) + '"' + disabled + '></label><button type="button" class="pp-text-button" data-api-action="profile-save"' + disabled + '>另存为新方案</button></div><p class="pp-footnote">另存当前连接、参数和记忆设置。使用方案后立即生效；修改后点击下方保存，会更新当前方案。各方案密钥分别保存在当前浏览器。</p>';
            } else if (tab === 'parameters') {
                body = '<div class="pp-card pp-form">' + field('timeout', '超时秒数（15—300）', 'number', 'min="15" max="300" step="1"') + '</div><p class="pp-footnote">预设、上下文范围和回复长度跟随酒馆。超时只用于独立 API；失败重试次数在设置的「失败重试」页调整。</p>';
            } else if (tab === 'memory') {
                const source = draft.memorySource || 'qqj';
                const report = adapter.memoryStatus?.({ ...getSettings(), api: draft });
                body = '<div class="pp-card pp-form"><label class="pp-field"><span>记忆来源</span><select data-api-field="memorySource"' + disabled + '><option value="qqj"' + (source === 'qqj' ? ' selected' : '') + '>千千结</option><option value="none"' + (source === 'none' ? ' selected' : '') + '>关闭</option></select></label></div>' +
                    '<p class="pp-footnote" data-memory-status>' + apiEscape(report?.message || '请在酒馆内查看接口状态。') + '</p><button type="button" class="pp-text-button" data-api-action="memory-refresh">刷新状态</button>' +
                    '<p class="pp-footnote">读取当前聊天已准备的召回与前情，不额外调用模型。没有材料时使用正文与手机记录；先完成一次正文召回后可再读。隐藏楼层不等于删除。删改楼层后不用旧材料，待千千结重新准备。</p>';
            } else {
                body = '<div class="pp-card pp-info"><p>两种模式均使用酒馆的完整生成流程；独立 API 只更换接收请求的接口和模型。独立模式需要酒馆使用「聊天补全」连接类型。</p><p>内容语言跟随已启用的预设文本。测试连接仅发送简短测试消息，不携带角色或剧情，会消耗少量 token；获取模型失败时仍可手填模型 ID。</p><p>短信、电话及后续 App 的使用记录继续随聊天保存与删楼回退。API 配置不随删楼改变；聊天变化后旧请求结果不会写入记录。</p><p>允许主动联系时，正文完成和拒接等操作可能调用模型；可在「主动联系」页暂停。</p></div>';
            }
            return '<div class="pp-page"><nav class="pp-api-tabs" aria-label="API 设置分页">' + [['connection','连接'],['profiles','方案'],['parameters','参数'],['memory','记忆'],['help','说明']].map(([id,label]) => '<button type="button" class="pp-text-button" data-api-action="tab:' + id + '" aria-pressed="' + (tab === id) + '">' + label + '</button>').join('') + '</nav>' + body +
                '<div class="pp-api-savebar"><div class="pp-api-actions"><button type="button" class="pp-call-retry" data-api-action="save"' + disabled + '>保存 API 设置</button>' + (busy ? '<button type="button" class="pp-text-button" data-api-action="cancel">取消请求</button>' : '') + '</div><p class="pp-api-status" data-api-status data-kind="' + statusKind + '" role="status">' + apiEscape(status || '修改后点击保存才会用于手机通信。') + '</p></div></div>';
        },
        input(id, value) {
            init();
            if (id === 'selectedProfile') { selectedProfile = value; return; }
            if (id === 'profileName') { profileName = value; return; }
            token++; statusKind = ''; status = '尚未保存。';
            if (id === 'key') key = value.trim();
            else if (id === 'baseUrl') { draft.baseUrl = value; key = adapter.keyStore?.get(value, activeId()) || ''; models = []; }
            else if (id === 'modelChoice') { draft.model = value; redraw(); }
            else draft[id] = ['maxTokens', 'timeout', 'historyLimit'].includes(id) ? Number(value) : value;
            if (id === 'mode' || id === 'memorySource') redraw();
        },
        keyValue: () => key,
        async action(action) {
            init();
            if (action.startsWith('tab:')) { tab = action.slice(4); redraw(); return; }
            if (action === 'memory-refresh') { redraw(); return; }
            if (action === 'cancel') { token++; busy = false; status = '已取消请求。'; redraw(); return; }
            if (busy) return;
            statusKind = '';
            try {
                if (action === 'profile-use') {
                    const saved = profiles().find(p => p.id === selectedProfile);
                    if (!saved) throw new Error('请先选择方案。');
                    if (!persist({api:{...saved.api,revision:getSettings().api.revision+1},apiProfileId:saved.id})) throw new Error('方案切换失败。');
                    draft=structuredClone(getSettings().api);key=adapter.keyStore?.get(draft.baseUrl,saved.id)||'';models=[];token++;statusKind='success';status='已切换到「'+saved.name+'」。';
                } else if (action === 'profile-delete') {
                    const saved=profiles().find(p=>p.id===selectedProfile);
                    if(!saved)throw new Error('请先选择方案。');
                    // Deleting a preset keeps the active connection as an unnamed copy.
                    const wasActive=activeId()===saved.id;
                    const currentApi=getSettings().api;
                    const previousDefault=adapter.keyStore?.get(currentApi.baseUrl)||'';
                    if(wasActive&&currentApi.mode==='independent')adapter.keyStore?.set(currentApi.baseUrl,adapter.keyStore.get(currentApi.baseUrl,saved.id));
                    if(!persist({apiProfiles:profiles().filter(p=>p.id!==saved.id),...(wasActive?{apiProfileId:'',api:{...currentApi,revision:currentApi.revision+1}}:{})})) {
                        if(wasActive&&currentApi.mode==='independent')adapter.keyStore?.set(currentApi.baseUrl,previousDefault);
                        throw new Error('方案删除失败。');
                    }
                    if(saved.api.baseUrl)adapter.keyStore?.set(saved.api.baseUrl,'',saved.id);
                    selectedProfile='';token++;statusKind='success';status='方案已删除。';
                } else if (action === 'save' || action === 'profile-save') {
                    const next = draft.mode === 'independent' ? config() : { ...draft };
                    const creating=action==='profile-save';
                    const name=profileName.trim().slice(0,80);
                    if(creating&&!name)throw new Error('请填写方案名称。');
                    if(creating&&profiles().some(p=>p.name===name))throw new Error('已有同名方案，请换一个名称。');
                    const id=creating?crypto.randomUUID():activeId();
                    const previousKey = next.baseUrl ? adapter.keyStore?.get(next.baseUrl,id) : '';
                    if (draft.mode === 'independent') {
                        if (!adapter.keyStore) throw new Error('离线预览不保存 API 密钥。');
                        adapter.keyStore.set(next.baseUrl, key,id);
                    }
                    const nextApi={...next,revision:getSettings().api.revision+1};
                    const nextProfiles=creating?[...profiles(),{id,name,api:nextApi}]:profiles().map(p=>p.id===id?{...p,api:nextApi}:p);
                    if (!persist({ api: nextApi, apiProfiles:nextProfiles, apiProfileId:id })) {
                        if (draft.mode === 'independent') adapter.keyStore.set(next.baseUrl, previousKey,id);
                        throw new Error('API 设置保存失败。');
                    }
                    draft = structuredClone(getSettings().api); if(creating){selectedProfile=id;profileName='';} token++; statusKind = 'success'; status = '已保存，手机将使用' + (draft.mode === 'independent' ? '独立 API。' : '酒馆当前连接。');
                } else if (action === 'clear-key') {
                    adapter.keyStore?.set(normalizeApiUrl(draft.baseUrl), '',activeId()); key = ''; token++;
                    status = '此地址的本地密钥已清除。';
                } else if (action === 'models' || action === 'test') {
                    if (!adapter.api) throw new Error('离线预览不能连接 API，请在酒馆内测试。');
                    const next = config(action === 'test');
                    const id = ++token; busy = true; status = action === 'models' ? '正在获取模型…' : '正在测试连接…'; redraw();
                    try {
                        const result = await adapter.api[action](next, key, () => token === id);
                        if (token !== id) return;
                        if (action === 'models') { models = result; status = result.length ? '已获取 ' + result.length + ' 个模型，请选择后保存。' : '服务返回空列表，请手动填写模型 ID。'; }
                        else { statusKind = 'success'; status = '连接成功，模型已返回文字。请保存设置后使用。'; }
                    } catch (error) { if (token === id) { adapter.diagnostics?.add(error,'API '+action,[key]); statusKind = 'error'; status = error.message; } }
                    finally { if (token === id) busy = false; }
                }
            } catch (error) { adapter.diagnostics?.add(error,'API 设置',[key]); statusKind = 'error'; status = error.message; }
            redraw();
        },
        destroy() { token++; key = ''; draft = null; },
    };
}

// Small, chat-local event journal. It stores phone changes, never a copy of prose.
const JOURNAL_KEY = 'durian_phone_history';
const COLLECTIONS = ['profiles', 'contacts', 'calls', 'messages', 'snapchat', 'x', 'orders', 'assets', 'daily'];
const SCHEMA = 1;
const EMPTY_REVISION = 'root';
const copy = value => JSON.parse(JSON.stringify(value));
const record = value => value && typeof value === 'object' && !Array.isArray(value);

const isMemoryHidden = message => message?.extra?.qianqianjieAutoHide?.schemaVersion === 1 && typeof message.extra.qianqianjieAutoHide.chatId === 'string' && !message.extra.type;

function messageSignatures(chat, legacy = false) {
    return chat.map(message => JSON.stringify([
        String(message.mes ?? ''), String(message.name ?? ''), Boolean(message.is_user),
        Boolean(message.is_system && (legacy || !isMemoryHidden(message))), message.send_date ?? null, message.swipe_id ?? null,
    ]));
}

async function revisionsFor(signatures) {
    const encoder = new TextEncoder();
    const revisions = [];

            (blocked ? '<p class="pp-footnote">此人的短信已被拉黑，取消后才能继续交流。</p>' : '') +
            '<form data-sms-form class="pp-sms-compose"><label for="pp-sms-input">短信内容</label><textarea id="pp-sms-input" data-sms-draft enterkeyhint="enter" rows="2" maxlength="6000" placeholder="短信…"' + (busy || blocked || phoneOnly ? ' disabled' : '') + '>' + smsEscape(drafts[contact.id] || '') + '</textarea><button type="submit" aria-label="发送短信"' + (busy || blocked || phoneOnly ? ' disabled' : '') + '>'+icon('send')+'</button></form></div>';
    }
    let entries = Object.values(picking ? contacts : participants);
    if (picking) entries.sort((a, b) => a.name.localeCompare(b.name));
    else entries = entries.filter(item => threadMessages(messages, item.id).length).sort((a, b) => threadMessages(messages, b.id).at(-1).createdAt - threadMessages(messages, a.id).at(-1).createdAt);
    return '<div class="pp-sms-list"><div class="pp-phone-toolbar"><h2>' + (picking ? '选择联系人' : '短信') + '</h2><button type="button" class="pp-text-button" ' + (picking ? 'data-sms-back' : 'data-sms-new') + '>' + (picking ? '取消' : '新建短信') + '</button>' + (picking ? '<button type="button" class="pp-text-button" data-sms-sync' + (busy ? ' disabled' : '') + '>新增联系人</button><button type="button" class="pp-text-button" data-contact-bulk' + (busy ? ' disabled' : '') + '>一键新增</button>' : '') + (!picking ? '<button type="button" class="pp-text-button" data-sms-blocklist>黑名单</button>' : '') + '</div>' +
        (busy ? '<p class="pp-phone-progress" role="status">正在处理，请稍候…</p>' : '') + errorHTML + (contactStatus && picking ? '<p class="pp-contact-status" role="status">' + smsEscape(contactStatus) + '</p>' : '') +
        (entries.length ? entries.map(item => {
            const last = threadMessages(messages, item.id).at(-1);
            const unread = unreadMessages(messages, item.id);
            return '<button type="button" class="pp-sms-row" data-sms-contact="' + smsEscape(item.id) + '"><span class="pp-contact-avatar">' + icon('person') + '</span><span class="pp-sms-row-text"><strong>' + smsEscape(item.name) + '</strong>' + (picking ? (item.number ? '<small>' + smsEscape(item.number) + '</small>' : '') : '<small>' + smsEscape(last.text) + '</small>') + '</span>' + (!picking ? '<span class="pp-sms-row-meta"><time>'+smsTime(last)+'</time>' : '<span class="pp-sms-row-meta">') + (unread && !picking ? '<span class="pp-unread-count">' + unread + '</span>' : '') + icon('chevron') + '</span></button>';
        }).join('') : '<div class="pp-empty"><h2>' + (picking ? '暂无联系人' : '暂无短信') + '</h2><p>' + (picking ? '点击「新增联系人」添加。' : '点击「新建短信」，选择联系人开始交流。') + '</p></div>') +
        '</div>';
}

// Fictional Snapchat: all media/calls are text roleplay; no real social API,
// microphone, camera, geolocation, payment or media hosting is used.
const snapItems = (state, type) => Object.values(state.snapchat || {}).filter(item => item.type === type);
const snapProfile = (state, name = 'user') => state.snapchat?.profile || { id:'profile',type:'profile',alias:name,currency:'USD',location:'',sharing:false };
const snapExpired = (item, now = Date.now()) => now - item.createdAt >= 86400000;
const snapUnread = state => snapItems(state,'message').filter(m=>m.role==='assistant'&&!m.read).length + snapItems(state,'account').filter(a=>a.friend==='incoming').length;


const snapEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const snapKind = {text:'文字',voice:'语音',image:'照片',video:'视频'};
const snapMoney = item => item.currency + ' ' + (item.amountMinor / 100).toFixed(2);
const snapTime = item => displayStoryTime(item);

function createSnapPanel({adapter,getView,redraw,notice}) {
    let editingId=null;
    let tab='chat', accountId=null, page='', drafts=Object.create(null), status='', reading=false, posting=false;
    const profile=()=>snapProfile(getView(),adapter.userName?.()||'user');
    const key=name=>[tab,accountId||'',page,name].join(':');

    const disabled=()=>getView().busy||posting?' disabled':'';
    const button=(action,label,id='',extra='')=>'<button type="button" class="pp-snap-button" data-snap-action="'+action+'" data-snap-id="'+snapEsc(id)+'" '+extra+disabled()+'>'+snapEsc(label)+'</button>';
    const messageTools=i=>'<div class="pp-message-tools"><button type="button" class="pp-icon-button" data-snap-action="edit-message" data-snap-id="'+snapEsc(i.id)+'" aria-label="修改消息"'+disabled()+'>'+icon('edit')+'</button><button type="button" class="pp-icon-button" data-snap-action="reroll-message" data-snap-id="'+snapEsc(i.id)+'" aria-label="重新生成消息"'+disabled()+'>'+icon('retry')+'</button></div>';
    const field=(name,label,fallback='',type='text')=>'<label class="pp-field"><span>'+label+'</span><input data-snap-field="'+name+'" name="'+name+'" type="'+type+'" value="'+snapEsc(value(name,fallback))+'" '+(type==='number'?'min="0.01" step="0.01"':'maxlength="200"')+'></label>';
    const textarea=(name,label)=>'<label class="pp-field"><span>'+label+'</span><textarea data-snap-field="'+name+'" name="'+name+'" enterkeyhint="enter" rows="3" maxlength="6000">'+snapEsc(value(name))+'</textarea></label>';
    const select=(name,options,fallback)=>'<select name="'+name+'" data-snap-field="'+name+'" aria-label="内容类型">'+options.map(k=>'<option value="'+k+'"'+(value(name,fallback)===k?' selected':'')+'>'+snapKind[k]+'</option>').join('')+'</select>';
    const form=(name,body,label)=>'<form class="pp-snap-form" data-snap-form="'+name+'">'+body+'<div class="pp-compose-actions"><button class="pp-snap-primary" type="submit"'+disabled()+'>'+label+'</button></div></form>';
    const empty=text=>'<p class="pp-snap-empty">'+text+'</p>';
    function accountsHTML(state) {
        const accounts=snapItems(state,'account');
        return form('search',field('query','姓名或账号（可留空）'),'新增联系人')+accounts.map(a=>{
            const unread=snapItems(state,'message').filter(m=>m.accountId===a.id&&m.role==='assistant'&&!m.read).length;
            const label=a.blocked?'已拉黑':({none:'尚未添加',incoming:'邀请你成为好友',pending:'等待通过',declined:'邀请未通过',friends:'好友'})[a.friend];
            return '<article class="pp-snap-card"><div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+' · '+label+(unread?' · '+unread+' 条未读':'')+'</small></div></div><div class="pp-snap-actions">'+
                (a.blocked?button('thread','聊天记录',a.id)+button('unblock','解除拉黑',a.id):a.friend==='friends'?button('thread','聊天',a.id):a.friend==='incoming'?button('accept','接受邀请',a.id)+button('decline','拒绝',a.id):button('invite',a.friend==='pending'?'查看邀请回应':'添加好友',a.id))+(!a.blocked?button('block','拉黑',a.id):'')+'</div></article>';
        }).join('')+(accounts.length?'':empty('还没有 Snapchat 联系人。点「新增联系人」查找账号。'));
    }
    function transferHTML(t,blocked) {
        return '<article class="pp-snap-cash"><strong>Snapcash · '+(t.direction==='incoming'?'对方转来':'你转出')+'</strong><b>'+snapMoney(t)+'</b><p>'+snapEsc(t.memo)+'</p><small>'+({pending:'待收款',accepted:'已收款',declined:'已拒收／取消'})[t.status]+'</small><div class="pp-snap-actions">'+(t.status==='pending'?(blocked?'':button('settle',t.direction==='incoming'?'收款':'查看收款回应',t.id))+button('cancel',t.direction==='incoming'?'拒收':'取消转账',t.id):'')+'</div></article>';
    }
    function threadHTML(state,a) {
        const items=Object.values(state.snapchat||{}).filter(i=>i.accountId===a.id&&['message','call','transfer'].includes(i.type)).sort((a,b)=>a.createdAt-b.createdAt);
        const active=items.find(i=>i.type==='call'&&i.status==='connected');
        const chat=items.map(i=>{
            if(i.type==='transfer')return transferHTML(i,a.blocked);
            if(i.type==='call')return '<article class="pp-snap-card"><strong>'+snapKind[i.mode]+'通话 · '+({connected:'通话中',ended:'已结束',no_answer:'未接听'})[i.status]+'</strong>'+i.turns.map(t=>'<p class="pp-snap-copy"><b>'+(t.role==='user'?'你':snapEsc(a.name))+'：</b>'+snapEsc(t.text)+'</p>').join('')+'</article>';
            return '<article class="pp-snap-message '+(i.role==='user'?'is-user':'')+'"><small>'+(i.role==='user'?'你':snapEsc(a.name))+' · '+snapKind[i.kind]+' · '+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p>'+(i.role==='assistant'?messageTools(i)+(editingId===i.id?form('edit-message',textarea('editText','修改消息'),'保存')+button('cancel-edit','取消'):''):'')+(i.status==='queued'?'<small>未发送</small>':'')+(['failed','pending'].includes(i.status)?button('retry','重试回复',i.id):i.status==='no_reply'?'<small>对方暂未回复</small>':'')+'</article>';
        }).join('');
        return button('list','‹ 聊天列表')+'<div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+'</small></div></div><div class="pp-snap-actions">'+(!a.blocked?button('voice','语音通话',a.id)+button('video','视频通话',a.id)+button('cash','转账',a.id)+(a.identityKnown?'':button('reveal','自我介绍',a.id))+button('block','拉黑',a.id):button('unblock','解除拉黑',a.id))+'</div><div class="pp-snap-thread">'+chat+'</div>'+
            (a.blocked?empty('已拉黑，不能发送消息或通话。'):page==='cash'?form('cash',field('amount','金额','','number')+'<input type="hidden" name="currency" value="USD"><p>美元 USD</p>'+field('memo','附言'),'发送转账')+button('thread','返回聊天',a.id):active?form('call',textarea('call','通话内容'),'说话')+button('hangup','挂断',active.id):form('message',select('kind',['text','voice','image','video'],'text')+textarea('message','消息内容'),'发送'));
    }
    function postHTML(item) {
        return '<article class="pp-snap-card '+(item.type==='clip'?'pp-snap-clip':'')+'"><header><strong>'+snapEsc(item.name)+'</strong><small>'+snapKind[item.kind]+(item.type==='story'?' · <span data-snap-expiry="'+item.createdAt+'">'+(snapExpired(item)?'已过期':'24 小时内')+'</span>':'')+'</small></header><div class="pp-snap-media"><span aria-hidden="true">'+(item.kind==='video'?'▷':'▧')+'</span><p class="pp-snap-copy">'+snapEsc(item.text)+'</p></div><div class="pp-snap-actions">'+button('like',item.liked?'♥ 已赞':'♡ 点赞',item.id)+button('comment','评论',item.id)+'</div>'+(item.comments||[]).map(c=>'<p class="pp-snap-copy"><b>'+snapEsc(c.name)+'：</b>'+snapEsc(c.text)+'</p>').join('')+(page==='comment:'+item.id?form('comment',textarea('comment','评论内容'),'发送评论'):'')+'</article>';
    }
    function feedsHTML(state) {
        if(tab==='stories')return form('story',select('storyKind',['image','video'],'image')+textarea('story','故事内容'),'发布故事')+button('refresh','刷新好友故事')+snapItems(state,'story').slice().reverse().filter(i=>i.author==='user'||!state.snapchat[i.author]?.blocked).map(postHTML).join('');
        if(tab==='spotlight')return button('refresh','加载短视频')+'<div class="pp-snap-clips">'+snapItems(state,'clip').slice().reverse().map(postHTML).join('')+'</div>'+empty('上下滑动浏览更多视频。');
        const p=profile();const locations=snapItems(state,'location').filter(i=>!state.snapchat[i.author]?.blocked).slice().reverse();
        return button('refresh','刷新共享位置与动态')+'<div class="pp-snap-map"><strong>Snap Map</strong><p>朋友分享的位置 · 世界动态</p><div class="pp-snap-pins">'+(p.sharing&&p.location?'<span>⌖ 你 · '+snapEsc(p.location)+'</span>':'')+locations.slice(0,6).map(i=>'<span>⌖ '+snapEsc(i.name)+' · '+snapEsc(i.place)+'</span>').join('')+'</div></div>'+(!p.sharing?empty('你的位置未共享，可在「我的账号」开启。'):'')+locations.map(i=>'<article class="pp-snap-card"><strong>'+snapEsc(i.name)+' · '+snapEsc(i.place)+'</strong><small>'+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p></article>').join('');
    }
    function html() {
        const state=getView();if(accountId&&!state.snapchat?.[accountId]){accountId=null;page='';}
        const a=state.snapchat?.[accountId];const p=profile();
        let body=page==='profile'?button('list','‹ 返回')+form('profile',field('alias','网名',p.alias)+'<input type="hidden" name="currency" value="USD">'+field('location','我分享的位置',p.location)+'<label class="pp-snap-check"><input name="sharing" data-snap-field="sharing" type="checkbox"'+(value('sharing',p.sharing)?' checked':'')+'>向好友共享此位置</label>','保存个人设置'):tab==='chat'?(a?threadHTML(state,a):accountsHTML(state)):feedsHTML(state);
        return '<div class="pp-snap"><header class="pp-snap-top"><b>Snapchat</b>'+button('profile','我的账号')+'</header><p class="pp-snap-status" role="status">'+snapEsc(state.busy?'正在处理…':state.errorKind==='snapchat'&&state.error?state.error:status)+'</p>'+body+'<nav class="pp-snap-tabs" aria-label="Snapchat 页面">'+[['chat','聊天'],['stories','故事'],['spotlight','聚光灯'],['map','地图']].map(([id,label])=>'<button type="button" data-snap-action="tab" data-snap-id="'+id+'" aria-pressed="'+(tab===id)+'">'+label+'</button>').join('')+'</nav></div>';
    }
    async function perform(method,args=[],message='') {
        if(!adapter.snapchat){notice('请在酒馆内使用 Snapchat。');return null;}
        if(posting||getView().busy)return null;
        posting=true;redraw();
        try {const result=await adapter.snapchat[method](...args);if(result?.ok){status=message;return result;}status=result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){status=error.message;return null;}
        finally{posting=false;redraw();}
    }
    async function queueCurrent(){
        const selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(!message.trim())return;
        const result=await perform('queueMessage',[selected,kind,message]);
        if(result?.ok&&drafts[draftKey]===message)delete drafts[draftKey];
        redraw();return result;
    }
    async function sendCurrent(){
        const selected=accountId,draftKey=key('message'),message=value('message'),kind=value('kind','text');
        if(message.trim()) {const added=await perform('queueMessage',[selected,kind,message]);if(!added?.ok)return;if(drafts[draftKey]===message)delete drafts[draftKey];}
        await perform('flushMessages',[selected]);redraw();
    }
    return {
        html, queueCurrent,
        reset(){editingId=null;tab='chat';accountId=null;page='';drafts=Object.create(null);status='';},
        input(target){if(target.dataset.snapField)drafts[key(target.dataset.snapField)]=target.type==='checkbox'?target.checked:target.value;},
        async readVisible(){if(reading||posting||getView().busy||!accountId||page==='profile'||!adapter.snapchat)return;if(!snapItems(getView(),'message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;reading=true;try{await adapter.snapchat.markRead(accountId);}finally{reading=false;}},
        async action(action,id) {
            if(action==='edit-message'){editingId=id;drafts[key('editText')]=getView().snapchat[id]?.text||'';redraw();return;}
            if(action==='cancel-edit'){editingId=null;redraw();return;}
            if(action==='reroll-message'){await perform('rerollMessage',[id]);return;}
            if(action==='tab'){tab=id;accountId=null;page='';status='';redraw();return;}
            if(action==='profile'){page='profile';redraw();return;}
            if(action==='list'){accountId=null;page='';redraw();return;}
            if(action==='thread'){accountId=id;page='';redraw();return;}
            if(action==='cash'){page='cash';redraw();return;}
            if(action==='comment'){page='comment:'+id;redraw();return;}
            const handlers={invite:['invite',[id]],accept:['accept',[id,true]],decline:['accept',[id,false]],block:['block',[id,true]],unblock:['block',[id,false]],reveal:['reveal',[id]],voice:['call',[id,'voice']],video:['call',[id,'video']],hangup:['hangup',[id]],retry:['retryMessage',[id]],refresh:['refresh',[tab]],like:['like',[id]],settle:['settle',[id,true]],cancel:['settle',[id,false]]};
            if(handlers[action])await perform(...handlers[action]);
        },
        async submit(formElement) {
            const data=Object.fromEntries(new FormData(formElement));const formName=formElement.dataset.snapForm;
            const initialKey=key('');const draftKey=name=>initialKey+name;let result;
            if(formName==='search'){result=await perform('discover',[data.query]);if(result?.ok)status='搜索完成，新增 '+result.value.added+' 个账号。';}
            if(formName==='profile')result=await perform('saveProfile',[{...data,sharing:data.sharing==='on'}],'已保存个人设置');
            if(formName==='message'){await sendCurrent();return;}
            if(formName==='edit-message'){result=await perform('editMessage',[editingId,data.editText]);if(result?.ok)editingId=null;}
            if(formName==='story'){result=await perform('publish',[data.storyKind,data.story],'故事已发布');if(result?.ok)delete drafts[draftKey('story')];}
            if(formName==='comment'){result=await perform('comment',[page.slice(8),data.comment]);if(result?.ok){delete drafts[draftKey('comment')];page='';}}
            if(formName==='call'){const active=snapItems(getView(),'call').find(c=>c.accountId===accountId&&c.status==='connected');if(active){result=await perform('call',[accountId,active.mode,data.call,active.id]);if(result?.ok)delete drafts[draftKey('call')];}}
            if(formName==='cash'){
                result=await perform('transfer',[accountId,data.amount,data.currency,data.memo]);
                if(result?.ok){for(const name of ['amount','memo'])delete drafts[draftKey(name)];page='';await perform('settle',[result.value,true]);}
            }
            redraw();
        },
    };
}

// Story-local X simulation. No real social-network API or account is used.
const xItems = (state,type) => Object.values(state.x || {}).filter(item=>item.type===type);
const xProfile = (state,name='user') => state.x?.profile || {id:'profile',type:'profile',alias:name,bio:''};
const xUnread = state => xItems(state,'message').filter(m=>m.role==='assistant'&&!m.read).length + xItems(state,'comment').filter(c=>c.author!=='user'&&!c.read&&!c.ambient).length;
const metric = n => Number.isFinite(Number(n)) ? Math.min(1000000000,Math.max(0,Math.floor(Number(n)))) : 0;
function xCounts(state,post) {
    const comments=xItems(state,'comment').filter(c=>c.postId===post.id);
    return {likes:metric(post.metrics?.likes)+(post.liked?1:0),reposts:metric(post.metrics?.reposts)+(post.reposted?1:0),
        replies:Math.max(metric(post.metrics?.replies),comments.filter(c=>c.ambient).length)+comments.filter(c=>!c.ambient).length};
}

const xEscape = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function createXPanel({adapter,getView,redraw,notice}) {

    function injectionButton(p,state) {

function orderClock(order,chat){return readStoryClock((chat||[]).slice(order.sourceIndex+1),{day:order.createdDay,hour:order.createdHour});}
function deliveryReceipt(order,chat){
    let clock={day:order.createdDay,hour:order.createdHour};
    for(let i=order.sourceIndex+1;i<(chat||[]).length;i++){
        const m=chat[i];clock=readStoryClock([m],clock);if(m.is_user||(m.is_system&&!isMemoryHidden(m)))continue;
        if(clock.day<order.dueDay||clock.hour===null||clock.hour<9||clock.hour>=18)continue;
        const text=String(m.mes||'').replace(/```[\s\S]*?```/g,'').replace(/<(think|thinking|script|style)[^>]*>[\s\S]*?<\/\1>/gi,'');
        const prose=text.replace(/<!--[\s\S]*?-->/g,'').trim();
        for(const match of text.matchAll(/<!--\s*durian-delivery\s*:\s*([\s\S]*?)-->/g)){
            try{const receipt=JSON.parse(match[1]);
                if(receipt.id===order.id&&receipt.arrived===true&&typeof receipt.evidence==='string'&&receipt.evidence.trim().length>=6&&prose.includes(receipt.evidence.trim())&&
                    !/尚未|没有送达|还没|未到|将会|预计|明天|will (?:arrive|be delivered)|not (?:yet )?(?:arrived|delivered)/i.test(receipt.evidence))return {index:i,date:dayDate(clock.day),evidence:receipt.evidence};
            }catch{/* An incomplete generated marker is not a receipt. */}
        }
    }
    return null;
}
function deliveryStatus(order,chat){
    const receipt=deliveryReceipt(order,chat);if(receipt)return {label:'已送达',delivered:true,receipt};
    const clock=orderClock(order,chat);
    return {label:clock.day>order.createdDay?'运输中':'待发货',delivered:false,clock};
}
function dueOrders(state,chat){return Object.values(state.orders||{}).filter(o=>{
    if(o.type!=='order'||deliveryReceipt(o,chat))return false;
    const clock=orderClock(o,chat);return clock.day>=o.dueDay&&clock.hour!==null&&clock.hour>=9&&clock.hour<18;
});}

const assetRows = (state, type) => Object.values(state.assets || {}).filter(x => x.type === type);
const assetSet = value => ({ collection: 'assets', key: value.id, value });
const dollars = minor => '$' + (minor / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const assetText = (s, max = 180) => typeof s === 'string' ? s.trim().slice(0, max) : '';
function moneyMinor(value, signed = false) {
    if (!new RegExp(signed ? '^-?\\d{1,12}(\\.\\d{1,2})?$' : '^\\d{1,12}(\\.\\d{1,2})?$').test(String(value))) throw Error('账本金额格式不正确。');
    const n = Math.round(Number(value) * 100);
    if (!Number.isSafeInteger(n)) throw Error('账本金额超出范围。');
    return n;
}
function cashBalance(state) {
    const wallet = state.assets?.wallet;
    if (!wallet) return null;
    const ignored = new Set(wallet.included || []);
    const amount = assetRows(state, 'cash_transaction').filter(t => t.currency === 'USD' && !ignored.has(t.id))
        .reduce((sum, t) => sum + t.deltaMinor, wallet.openingMinor);
    if (!Number.isSafeInteger(amount)) throw Error('账本金额超出范围。');
    return amount;
}
function reservedCash(state, except = '') {
    return Object.values(state.snapchat || {}).filter(t => t.type === 'transfer' && t.direction === 'outgoing' && t.status === 'pending' && t.currency === 'USD' && t.id !== except)
        .reduce((sum, t) => sum + t.amountMinor, 0);
}
function requireCash(state, minor, currency = 'USD', except = '') {
    if (currency !== 'USD') throw Error('小榴莲统一使用美元，请使用 USD。');
    const balance = cashBalance(state);
    if (balance === null) throw Error('请先在小榴莲点击「一键更新」建立账本。');
    if (assetRows(state, 'story_event').some(e => e.kind === 'expense' && !e.processed)) throw Error('还有待结算的支出，请先在小榴莲点击「一键更新」。');
    if (balance - reservedCash(state, except) < minor) throw Error('可用余额不足。');
}
function cashRecord(id, deltaMinor, memo, fields = {}) {
    if (!Number.isSafeInteger(deltaMinor)) throw Error('账本金额超出范围。');
    return { id, type: 'cash_transaction', currency: 'USD', deltaMinor, memo: assetText(memo), createdAt: Date.now(), ...fields };
}

// Payday covers [previous month's 15th, this month's 15th). Partial employment
// earns the corresponding fraction; all calculations use fictional UTC dates.
function salaryPayments(state, throughDay) {
    const wallet = state.assets?.wallet;

    const changes = [];
