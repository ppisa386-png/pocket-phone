// Real cities use the table. Fictional and unconfirmed places never borrow a
// same-named real city's climate: fictional ones take any worldbook climate
// setting, then a stable locally derived profile saved with the first refresh.
function climateFor(cityName, cached = null, kind = 'real', context = null) {
    if (cached && ARCHETYPES[cached.archetype]) return cached;
    const key = normCity(cityName);
    if (kind !== 'real') {
        const world = worldClimate(cityName, context);
        if (world) return world;
    } else {
        const known = CITY_TABLE[key];
        if (known) return { archetype: known.archetype, offset: known.offset || 0, south: !!known.south };
    }
    const h = hash32(key);
    const derived = { archetype: ARCH_IDS[h % ARCH_IDS.length], offset: ((h >>> 8) % 13) - 6, south: ((h >>> 16) % 10) === 0, derived: true };
    return kind === 'fictional' ? { ...derived, fictional: true } : derived;
}

const monthOf = day => { const date = dayDate(day); return date ? +date.slice(5, 7) - 1 : null; };
const seasonOf = month => month === 11 || month <= 1 ? 'winter' : month <= 4 ? 'spring' : month <= 7 ? 'summer' : 'autumn';

function conditions(climate, day, hourOfDay) {
    const arch = ARCHETYPES[climate.archetype] || ARCHETYPES.cfb;
    const month = monthOf(day);
    // Southern-hemisphere cities read the monthly table shifted by six months.
    const effMonth = month == null ? null : (climate.south ? (month + 6) % 12 : month);
    const season = seasonOf(effMonth ?? 4);
    const rainProb = effMonth == null ? .35 : arch.rain[effMonth];
    const typhoonSeason = !!arch.typhoon && (climate.south ? (month === null || month >= 9 || month <= 2) : (month != null && month >= 5 && month <= 9));
    return {
        arch, month: effMonth ?? 4, season, rainProb,
        baseTemp: (effMonth == null ? 15 : arch.temp[effMonth]) + (climate.offset || 0),
        diurnal: arch.diurnal * Math.cos((hourOfDay - 14) / 24 * 2 * Math.PI),
        summer: season === 'summer', winter: season === 'winter',
        arid: !!arch.arid, typhoon: typhoonSeason,
    };
}

const RAIN_TO_SNOW = { drizzle: 'lightsnow', rain: 'snow', heavy: 'heavysnow', storm: 'blizzard', thunder: 'snow', severe: 'blizzard' };
const SNOW_TO_RAIN = { lightsnow: 'drizzle', sleet: 'drizzle', snow: 'rain', heavysnow: 'heavy', blizzard: 'storm' };
// Rain falls as snow once the air is cold enough, and snow falls as rain when
// it is too warm; both directions keep the same intensity level.
const snowAdjust = (type, temperature) => {
    if (temperature < .5 && RAIN_TO_SNOW[type]) return RAIN_TO_SNOW[type];
    if (temperature > 3 && SNOW_TO_RAIN[type]) return SNOW_TO_RAIN[type];
    if (temperature < .5 && type === 'sleet') return 'lightsnow';
    return type;
};

const pick = (weights, rng) => {
    let total = 0; for (const [, weight] of weights) total += weight;
    let roll = rng() * total;
    for (const [type, weight] of weights) { roll -= weight; if (roll <= 0) return type; }
    return weights.at(-1)[0];
};

function initialWeights(ctx, temperature) {
    const dry = 1 - ctx.rainProb, rp = ctx.rainProb, w = [];

    w.push(['drizzle', rp * .62], ['rain', rp * .38], ['heavy', rp * .13]);
    w.push(['thunder', ctx.summer ? rp * .15 : rp * .02]);
    w.push(['storm', rp * .022], ['severe', ctx.summer ? rp * .012 : .002]);
    if (ctx.summer) w.push(['heat', .013 + (ctx.arid ? .01 : 0)]);
    if (ctx.winter) w.push(['cold', .013]);
    if (ctx.arid) w.push(['dust', ctx.season === 'spring' ? .022 : .007]);
    if (!ctx.arid && ctx.rainProb < .3) w.push(['windy', .022]);
    return w;
}

// First sample at manual refresh. Weather types, not dates, drive randomness.
function initialWeather(climate, clock, rng) {
    const hourOfDay = Math.floor(clock.hour);
    const ctx = conditions(climate, clock.day, hourOfDay);
    const rawTemp = ctx.baseTemp + ctx.diurnal + (rng() * 2 - 1) * 3.2;
    const type = snowAdjust(pick(initialWeights(ctx, rawTemp), rng), rawTemp);
    return settle(type, ctx, rawTemp, rng);
}

function settle(type, ctx, temperature, rng) {
    const t = TYPES[type] || TYPES.partly;
    const temp = clamp(temperature + t.temp * (.6 + rng() * .8), -48, 52);
    const finalWind = clamp(Math.round(ctx.arch.wind + t.wind + (rng() * 3 - 1.4)), 0, 12);
    const finalHumidity = clamp(Math.round(ctx.arch.humid + t.humid * .5 + (rng() * 12 - 6)), 12, 99);
    return { type, temp: Math.round(temp * 2) / 2, wind: finalWind, humidity: finalHumidity };
}

function transitionWeights(from, ctx) {
    const t = TYPES[from], rp = ctx.rainProb, w = [];
    if (t.family === 'clear' || t.family === 'extreme' || t.family === 'wind') {
        w.push(['sunny', (1 - rp) * .34 + .04], ['partly', (1 - rp) * .3 + .08], ['overcast', rp * .5 + .1]);
        w.push(['drizzle', rp * .5], ['rain', rp * .28]);
        if (ctx.summer) w.push(['thunder', rp * .12], ['severe', rp * .012]);
    } else if (t.family === 'cloud') {
        w.push(['partly', .28], ['sunny', (1 - rp) * .28 + .04], ['overcast', .22]);
        w.push(['drizzle', rp * .68], ['rain', rp * .36], ['heavy', rp * .14]);
        if (ctx.summer) w.push(['thunder', rp * .16], ['severe', rp * .02]);
    } else if (t.family === 'rain') {
        if (t.level === 1) w.push(['overcast', .32], ['partly', .16], ['drizzle', .18], ['rain', rp * .5 + .14]);
        else if (t.level === 2) w.push(['drizzle', .3], ['heavy', rp * .36 + .06], ['overcast', .18], ['rain', .24], ['storm', rp * .04 + .008]);
        else if (t.level === 3) w.push(['rain', .32], ['heavy', .26], ['drizzle', .18], ['overcast', .1], ['storm', rp * .08 + .015]);
        else w.push(['heavy', .42], ['rain', .3], ['overcast', .12]);
        if (ctx.summer) w.push(['thunder', .09], ['severe', .03], ['hail', .008]);
    } else if (t.family === 'snow') {
        if (t.level === 1) w.push(['overcast', .34], ['partly', .18], ['lightsnow', .16], ['snow', rp * .5 + .12]);
        else if (t.level === 2) w.push(['lightsnow', .3], ['heavysnow', rp * .34 + .06], ['overcast', .2], ['snow', .24], ['blizzard', prevWindBoost()]);
        else if (t.level === 3) w.push(['snow', .32], ['heavysnow', .26], ['lightsnow', .18], ['overcast', .1]);
        else w.push(['heavysnow', .46], ['snow', .3], ['overcast', .12]);
    } else if (t.family === 'typhoon') {
        w.push(['heavy', .44], ['rain', .28], ['storm', .2]);
    }
    // Rare escalations into locally plausible extremes: never zero, never common.
    if (ctx.summer && t.family === 'rain' && t.level >= 3) w.push(['severe', .05], ['hail', .015]);
    if (ctx.winter && t.family === 'snow' && t.level >= 2) w.push(['blizzard', .03]);
    if (ctx.typhoon && ['rain', 'heavy', 'storm'].includes(from)) w.push(['typhoon', .012]);
    if (ctx.summer && t.family === 'clear' && ctx.rainProb < .3) w.push(['heat', .015]);
    if (ctx.winter && t.family === 'clear') w.push(['cold', .015]);
    if (ctx.arid && t.family === 'wind') w.push(['dust', ctx.season === 'spring' ? .12 : .01]);
    return w;
    function prevWindBoost() { return rp * .05 + .01; }
}

const DRIFT = { drizzle: ['drizzle', 'rain'], rain: ['drizzle', 'rain', 'heavy'], heavy: ['rain', 'heavy', 'storm'], storm: ['heavy', 'storm'], lightsnow: ['lightsnow', 'snow'], snow: ['lightsnow', 'snow', 'heavysnow'], heavysnow: ['snow', 'heavysnow', 'blizzard'], blizzard: ['heavysnow', 'blizzard'] };

// One story hour of evolution: the weather may persist, drift in intensity,
// or switch; temperature, wind and humidity move toward the type's regime.
function advanceWeather(previous, climate, absHour, rng) {
    const hourOfDay = absHour % 24, day = Math.floor(absHour / 24);
    const ctx = conditions(climate, day, hourOfDay);
    const current = TYPES[previous.type] || TYPES.partly;
    let type = previous.type;
    if (rng() <= current.keep) {
        const drift = DRIFT[previous.type];
        if (drift && rng() < .22) type = drift[Math.floor(rng() * drift.length)];
    } else type = snowAdjust(pick(transitionWeights(previous.type, ctx), rng), ctx.baseTemp + ctx.diurnal);

    // Morning mist and its clearing are seasonal and climate-bound.
    if (type === 'sunny' && hourOfDay >= 5 && hourOfDay <= 8 && rng() < .02 * (ctx.arch.humid >= 70 ? 3 : 1)) type = 'fog';
    if (type === 'fog' && (hourOfDay < 4 || hourOfDay > 10) && rng() < .6) type = 'partly';
    if (type === 'fog' && ctx.arid) type = 'partly';

    const t = TYPES[type] || TYPES.partly;
    const target = ctx.baseTemp + ctx.diurnal + t.temp;
    const temp = clamp(previous.temp + clamp(target - previous.temp, -2, 2) + (rng() * 1.4 - .7), -48, 52);
    type = snowAdjust(type, temp);
    const windTarget = ctx.arch.wind + (TYPES[type] || t).wind;
    const wind = clamp(Math.round(previous.wind + (windTarget - previous.wind) * .45 + (rng() * 2.4 - 1.2)), 0, 12);
    const humidityTarget = ctx.arch.humid + (TYPES[type] || t).humid;
    const humidity = clamp(Math.round(previous.humidity + (humidityTarget - previous.humidity) * .4 + (rng() * 10 - 5)), 12, 99);
    return { type, temp: Math.round(temp * 2) / 2, wind, humidity };
}

const weatherType = type => TYPES[type] ? TYPES[type].label : '未知';
const weatherExtreme = type => !!TYPES[type]?.extreme;
const weatherScene = type => TYPES[type]?.family || 'cloud';

const feelsLike = (temp, wind, humidity) => {
    if (temp <= 10 && wind >= 3) return Math.round(temp - (wind - 2) * 1.2);
    if (temp >= 28 && humidity >= 60) return Math.round(temp + (humidity - 60) * .15 + (temp - 28) * .1);
    return Math.round(temp);
};

const reportOf = (city, climate, state, absHour) => {
    const type = TYPES[state.type] ? state.type : 'partly';
    const t = TYPES[type];
    const day = Math.floor(absHour / 24);
    return {
        city, type, label: t.label, extreme: !!t.extreme,
        temp: state.temp, wind: state.wind, humidity: state.humidity,
        precip: Math.round(t.precip * (0.75 + Math.min(.6, state.humidity / 200)) * 10) / 10,
        feels: feelsLike(state.temp, state.wind, state.humidity),
        date: dayDate(day), time: String(absHour % 24).padStart(2, '0') + ':00',
        hour: absHour,
    };
};

const MAX_FOLD = 240;

const WEEKDAY_NAMES = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
const weekdayOf = day => WEEKDAY_NAMES[new Date(day * 86400000).getUTCDay()];
const monthDayOf = date => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date || '')); return m ? `${+m[2]}月${+m[3]}日` : String(date || ''); };
const STRENGTH_NAMES = ['', '较弱', '中等', '较强', '强烈'];

// Deterministic engine state at any absolute story hour: the saved sample at or
// before the refresh, a continuous evolution within MAX_FOLD hours of it, and a
// stable per-day re-anchor beyond that. Current weather, the prompt background
// and the seven-day forecast all walk this same chain, so today's actual
// weather always equals what the forecast chain predicted for this hour.
function stateAtHour(record, climate, key, absHour) {
    if (absHour <= record.hour) return record.state;
    if (absHour - record.hour <= MAX_FOLD) {
        let state = record.state;
        for (let hour = record.hour + 1; hour <= absHour; hour++) state = advanceWeather(state, climate, hour, rngAt(record.seed, key, hour));
        return state;
    }
    const day = Math.floor(absHour / 24);
    let state = initialWeather(climate, { day, hour: 0 }, rngAt(record.seed, key, day * 24));
    for (let hour = day * 24 + 1; hour <= absHour; hour++) state = advanceWeather(state, climate, hour, rngAt(record.seed, key, hour));
    return state;
}

const dayHours = (record, climate, key, day) => {
    const start = day * 24;
    const row = (state, h) => ({ hour: h, type: state.type, temp: state.temp, wind: state.wind, humidity: state.humidity });
    const hours = [];
    if (start - record.hour > MAX_FOLD) {
        // Stale record: anchor the day exactly like stateAtHour does, then walk it.
        let state = initialWeather(climate, { day, hour: 0 }, rngAt(record.seed, key, start));
        for (let h = 0; h < 24; h++) {
            if (h > 0) state = advanceWeather(state, climate, start + h, rngAt(record.seed, key, start + h));
            hours.push(row(state, h));
        }
        return hours;
    }
    let state = record.state, walkedTo = record.hour;
    for (let h = 0; h < 24; h++) {
        const abs = start + h;
        if (abs <= record.hour) { hours.push(row(record.state, h)); continue; }
        while (walkedTo < abs) {
            walkedTo++;
            state = advanceWeather(state, climate, walkedTo, rngAt(record.seed, key, walkedTo));
        }
        hours.push(row(state, h));
    }
    return hours;
};

const dominant = hours => {
    const counts = new Map();
    for (const row of hours) counts.set(row.type, (counts.get(row.type) || 0) + 1);
    let best = null, count = -1;
    for (const [type, n] of counts) if (n > count) { best = type; count = n; }
    return best;
};

const summarizeDay = (record, climate, key, day, today) => {
    const hours = dayHours(record, climate, key, day);
    const temps = hours.map(h => h.temp);
    const morning = dominant(hours.slice(0, 12)), afternoon = dominant(hours.slice(12));
    const type = dominant(hours);
    const extremeRows = hours.filter(h => TYPES[h.type]?.extreme);
    const span = !extremeRows.length ? '' : extremeRows.length >= 18 ? '全天'
        : `${String(extremeRows[0].hour).padStart(2, '0')}时至${String((extremeRows.at(-1).hour + 1) % 24).padStart(2, '0')}时`;
    return {
        day, date: dayDate(day), weekday: weekdayOf(day), today: !!today,
        type, scene: weatherScene(type),
        label: morning === afternoon ? weatherType(morning) : weatherType(morning) + '转' + weatherType(afternoon),
        hi: Math.max(...temps), lo: Math.min(...temps),
        wind: Math.max(...hours.map(h => h.wind)),
        precip: Math.round(hours.filter(h => (TYPES[h.type]?.precip || 0) > 0).length / 24 * 100),
        extreme: extremeRows.length > 0,
        extremeLabel: extremeRows.length ? [...new Set(extremeRows.map(h => TYPES[h.type].label))].join('及') : '',
        extremeStrength: extremeRows.length ? STRENGTH_NAMES[Math.max(...extremeRows.map(h => TYPES[h.type].level || 0))] || '显著' : '',
        extremeSpan: span,
        hours,
    };
};

// The seven-day window starting at the current story day. The forecast is a
// deterministic function of the saved record, so nothing re-rolls when the app
// is reopened, the chat is reloaded or the story rolls back; as story days pass
// the window slides by itself, tomorrow's prediction becomes today's actual
// weather on the same chain, and an extreme hour never disappears on rolling.
function buildForecast(record, clock) {
    if (!record || !record.state || typeof record.seed !== 'string' || !Number.isInteger(record.hour)) return null;
    if (clock?.day == null || clock?.hour == null) return null;
    const key = normCity(record.city);
    const climate = climateFor(record.city, record.climate);
    const days = [];
    for (let offset = 0; offset < 7; offset++) days.push(summarizeDay(record, climate, key, clock.day + offset, offset === 0));
    return { city: record.city, days };
}

// The saved seed plus a per-hour hash make the whole evolution reproducible:
// reloading, re-reading the same hour, or recomputing after rollback all give
// the same values, and no weather is ever re-rolled.
function weatherAt(record, clock) {
    if (!record || !record.state || typeof record.seed !== 'string' || !Number.isInteger(record.hour)) return null;
    if (clock.day == null || clock.hour == null) return null;
    const key = normCity(record.city);
    const climate = climateFor(record.city, record.climate);
    const current = clock.day * 24 + Math.floor(clock.hour);
    if (current <= record.hour) return reportOf(record.city, climate, record.state, record.hour);
    return reportOf(record.city, climate, stateAtHour(record, climate, key, current), current);
}

// Background block for every normal narrative generation. The narrative AI
// receives today, tomorrow and any extreme-day warnings from the seven-day
// window; it never generates or refreshes weather itself. Days three to seven
// stay local unless one of them carries an extreme event, which is then sent
// explicitly as a not-yet-happened forecast warning.
function weatherBackground(state, chat) {
    const location = state?.location?.current;
    if (!location?.city) return '';
    const record = state?.weather?.[normCity(location.city)];
    if (!record || normCity(record.city) !== normCity(location.city)) return '';
    const clock = readStoryClock(chat);
    const report = weatherAt(record, clock);
    if (!report) return '';
    const forecast = buildForecast(record, clock);
    if (!forecast) return '';
    const [today, tomorrow] = forecast.days;
    // An extreme inside today or tomorrow is already carried by its own day
    // line: keep the full warning detail inline there instead of repeating it
    // in the future-warnings block, which covers days three to seven only.
    const inlineWarning = day => day.extreme ? `；预计${day.extremeSpan}出现${day.extremeLabel}（${day.extremeStrength}）` : '';
    const lines = [
        `当前位置：${location.city}；当前剧情时间：${report.date} ${report.time}。`,
        `今天（${monthDayOf(today.date)}）：${today.label}，最高${today.hi}°C，最低${today.lo}°C，目前${Math.round(report.temp)}°C，风力${report.wind}级${inlineWarning(today)}。`,
        `明天（${monthDayOf(tomorrow.date)}）：${tomorrow.label}，最高${tomorrow.hi}°C，最低${tomorrow.lo}°C，降水概率${tomorrow.precip}%${inlineWarning(tomorrow)}。`,
    ];
    const warnings = forecast.days.filter((day, index) => day.extreme && index >= 2)
        .map(day => `${monthDayOf(day.date)}${day.extremeLabel}，强度${day.extremeStrength}，预计${day.extremeSpan}影响${forecast.city}`);
    if (warnings.length) lines.push('未来极端天气预警（尚未发生的预报）：' + warnings.join('；') + '。');
    lines.push('以上天气由手机本地生成：预报不代表已经发生，不得把未来天气写成当前正在发生；区分当前天气、明日天气与未来预警；角色是否知道天气预报取决于剧情中的信息接触，不默认全知；不因预警自动编造事故、伤亡或财产损失；天气仅作场景背景，按需自然体现，不要求每轮描写。');
    return lines.join('\n');
}

// Scene block appended to the story-phone prompt: the short location rule for
// the narrative AI plus, when a valid weather exists, the background line.
function sceneBackground(state, chat, settings) {
    const consumers = ['weather', 'daily', 'assets'].some(id => settings?.apps?.[id] !== false);
    if (!consumers) return '';
    const weather = settings?.apps?.weather === false ? '' : weatherBackground(state, chat);
    return [WEATHER_LOCATION_RULE, weather].filter(Boolean).join('\n');
}

function createWeather({ memory, phone, getContext }) {
    return {
        open: () => memory.read(),
        report(state) {
            const chat = getContext().chat || [];
            const clock = readStoryClock(chat);
            const location = state?.location?.current;
            if (!location?.city) return { status: 'no-location', clock };
            const record = state?.weather?.[normCity(location.city)];
            if (!record || normCity(record.city) !== normCity(location.city)) return { status: 'pending', city: location.city, clock };
            if (clock.day == null || clock.hour == null) return { status: 'unknown-time', city: location.city, weather: { ...record.state, label: weatherType(record.state.type) }, date: record.date, clock };
            return { status: 'ok', city: location.city, report: weatherAt(record, clock), forecast: buildForecast(record, clock), clock };
        },
        // Manual refresh is the only entry point for initial weather, it runs
        // fully locally and saves the sampled baseline with its seed.
        refresh: () => phone.appTask(async (view, current) => {
            const chat = getContext().chat || [];
            const clock = readStoryClock(chat);
            const location = view.state.location?.current;
            if (!location?.city) throw new Error('正文尚未标记当前位置，暂不能刷新天气。');
            if (clock.day == null || clock.hour == null) throw new Error('当前剧情没有明确的日期和时间，暂不能刷新天气。');
            const key = normCity(location.city);
            const kind = locationKind(location.city, getContext());
            const climate = climateFor(location.city, view.state.weather?.[key]?.climate, kind, getContext());
            const hour = clock.day * 24 + Math.floor(clock.hour);
            const seed = crypto.randomUUID();
            const state = initialWeather(climate, clock, rngAt(seed, key, hour));
            if (!current()) throw new Error('剧情或设置已变化，本次天气刷新未保存。');
            await memory.commit(await memory.begin(view), [{ collection: 'weather', key, value: { city: location.city, climate, kind, seed, hour, date: dayDate(clock.day), state, refreshedAt: Date.now() } }]);
            return { refreshed: true };
        }, 'weather'),
    };
}


const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Soft scene art per weather family; the page background follows the same key.
const SCENE_ICONS = {
    clear: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/>',
    cloud: '<path d="M7 18h10a3.6 3.6 0 1 0-1.2-7A5.2 5.2 0 0 0 5.4 13 2.8 2.8 0 0 0 7 18Z"/>',
    rain: '<path d="M7 15h10a3.6 3.6 0 1 0-1.2-7A5.2 5.2 0 0 0 5.4 10 2.8 2.8 0 0 0 7 15Z"/><path d="m8 18-1 3m4-3-1 3m5-3-1 3" stroke-width="1.8"/>',
    snow: '<path d="M7 15h10a3.6 3.6 0 1 0-1.2-7A5.2 5.2 0 0 0 5.4 10 2.8 2.8 0 0 0 7 15Z"/><path d="M8 19.5h.01M12 21.5h.01M16 19.5h.01" stroke-width="2.6"/>',
    wind: '<path d="M3 8h9a2.5 2.5 0 1 0-2.4-3.2M3 12h13a2.8 2.8 0 1 1-2.7 3.6M3 16h7"/>',
    typhoon: '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 1 1-7-7 5 5 0 1 0 5 5"/>',
    extreme: '<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5M12 17.5h.01" stroke-width="2"/>',
};

const sceneIcon = (scene, size = 72) => '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (SCENE_ICONS[scene] || SCENE_ICONS.cloud) + '</svg>';

const monthDay = date => { const m = /-(\d{2})-(\d{2})$/.exec(String(date || '')); return m ? +m[1] + '/' + +m[2] : ''; };

function createWeatherPanel({ adapter, getView, redraw }) {
    let working = false, status = '', epoch = 0;

    function html() {
        // getView() returns the flat phone snapshot (location/weather at the top
        // level, no .state wrapper) merged with runtime fields like busy.
        const view = getView(), state = view || {};
        const busy = working || view.busy;
        const info = adapter.weather?.report(state);
        if (!info) return '<section class="pp-weather" data-weather="cloud"><div class="pp-weather-pending"><span>☁</span><p>天气待刷新</p></div></section>';
        const city = escapeHtml(info.city || '');
        if (info.status === 'no-location') {
            return '<section class="pp-weather" data-weather="cloud"><header class="pp-weather-city"><small>当前位置</small><h2>尚未标记</h2></header>' +
                '<div class="pp-weather-pending"><span>☁</span><p>正文尚未明确当前城市。<br>等待剧情标记位置后可刷新天气。</p></div>' +
                actions(busy) + statusLine(status) + '</section>';
        }
        if (info.status === 'pending') {
            return '<section class="pp-weather" data-weather="cloud"><header class="pp-weather-city"><small>当前位置</small><h2>' + city + '</h2></header>' +
                '<div class="pp-weather-pending"><span>☁</span><p>天气待刷新</p><small>点击下方按钮，为' + city + '生成当前天气</small></div>' +
                actions(busy) + statusLine(status) + '</section>';
        }
        if (info.status === 'unknown-time') {
            const w = info.weather || {};
            const scene = weatherScene(w.type);
            return '<section class="pp-weather" data-weather="' + scene + '"><header class="pp-weather-city"><small>当前位置</small><h2>' + city + '</h2></header>' +
                hero(scene, w, weatherType(w.type)) +
                grid({ feels: null, precip: null, wind: w.wind, humidity: w.humidity }) +
                '<div class="pp-weather-clock">剧情时间不明确 · 显示刷新时的天气（' + escapeHtml(info.date || '') + '）</div>' +
                actions(busy) + statusLine(status) + '</section>';
        }
        const r = info.report || {};
        const scene = weatherScene(r.type);
        return '<section class="pp-weather" data-weather="' + scene + '"><header class="pp-weather-city"><small>当前位置</small><h2>' + city + '</h2></header>' +
            hero(scene, r, r.label) +
            grid({ feels: r.feels, precip: r.precip, wind: r.wind, humidity: r.humidity }) +
            (info.forecast ? hoursStrip(info.forecast) + forecastList(info.forecast) : '') +
            '<div class="pp-weather-clock">剧情时间 ' + escapeHtml((r.date || '').replaceAll('-', ' / ') + ' ' + (r.time || '')) + '</div>' +
            actions(busy) + statusLine(status) + '</section>';
    }

    function hoursStrip(forecast) {
        const today = forecast.days[0];
        return '<div class="pp-weather-hours">' + today.hours.map(h =>
            '<span class="pp-weather-hour"><i>' + String(h.hour).padStart(2, '0') + '</i><b>' + Math.round(h.temp) + '°</b></span>').join('') + '</div>';
    }

    function forecastList(forecast) {
        return '<div class="pp-weather-days">' + forecast.days.map(d =>
            '<div class="pp-weather-day' + (d.today ? ' pp-weather-day-now' : '') + '">' +
            '<span class="pp-weather-day-date"><b>' + (d.today ? '今天' : monthDay(d.date)) + '</b><i>' + d.weekday + '</i></span>' +

    function actions(busy) {
        return '<div class="pp-weather-actions"><button type="button" class="pp-weather-refresh" data-weather-action="refresh"' + (busy ? ' disabled' : '') + '>' + (busy ? '正在刷新…' : '刷新天气') + '</button></div>';
    }
    function statusLine(text) {
        return text ? '<p class="pp-weather-status" role="status">' + escapeHtml(text) + '</p>' : '';
    }

    async function action(name) {
        if (name !== 'refresh' || working || getView().busy) return;
        if (!adapter.weather) { status = '请在酒馆中使用天气。'; redraw(); return; }
        const token = epoch; working = true; status = ''; redraw();
        try {
            const result = await adapter.weather.refresh();
            if (token === epoch) status = result?.ok ? '已为当前位置抽取天气。' : (result?.error || '本次未能刷新，请重试。');
        } catch (e) {
            if (token === epoch) status = e.message;
        } finally {
            if (token === epoch) working = false;
            redraw();
        }
    }
    return { html, action, reset() { epoch++; working = false; status = ''; } };
}

    function renderPrompts() {
        content.innerHTML = '<div class="pp-page"><label class="pp-field pp-prompt-select"><span>功能</span><select data-prompt-selector>' + Object.entries(PROMPTS).filter(([id]) => !['snapchat','incoming','incomingMessages','storyContact'].includes(id)).map(([id, prompt]) => '<option value="' + id + '"' + (id === promptId ? ' selected' : '') + '>' + prompt.name + '</option>').join('') + '</select></label>' +
            '<label class="pp-editor-label" for="pp-prompt-editor">提示词内容</label><textarea id="pp-prompt-editor" class="pp-editor" data-prompt-editor spellcheck="false" maxlength="30000"></textarea><div class="pp-editor-footer"><span class="pp-save-status" aria-live="polite">修改后自动保存</span><button type="button" class="pp-text-button" data-action="reset-prompt">恢复此项默认</button></div><p class="pp-footnote">内容语言以酒馆预设为准。联系方式识别、电话、主动来电、主动短信、短信、WhatsApp、微信、X 和正文衔接提示词现已生效；其余用于后续功能。</p></div>';
        content.querySelector('[data-prompt-editor]').value = settings.prompts[promptId];

    function renderContactSettings() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card pp-form">' +
            selectField('proactiveEnabled', '允许主动联系', [['true', '开启'], ['false', '关闭']], String(settings.proactiveEnabled)) + (settings.proactiveEnabled?selectField('proactiveFrequency','主动联系频率',[['low','低'],['medium','中'],['high','高']],settings.proactiveFrequency):'') + '</div></div>';
    }

    function renderRetry() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card pp-form"><label class="pp-field"><span>失败后自动重试次数</span><input class="pp-number" type="number" inputmode="numeric" min="0" max="15" step="1" data-setting="retries" value="' + settings.retries + '" aria-describedby="pp-retry-help"></label></div><p id="pp-retry-help" class="pp-footnote">填写 0—15 的整数。0 表示不自动重试；次数不包含首次请求，成功后立即停止。</p><p class="pp-footnote">此设置用于联系人识别、来电判断、电话和短信回应的请求失败重试。</p></div>';
    }

    function contactSearchHTML() {
        return contactSearchOpen?'<form data-contact-search class="pp-card pp-form"><label class="pp-field"><span>联系人姓名</span><input data-contact-query value="'+esc(contactQuery)+'" maxlength="100" placeholder="姓名或部分名字" required></label><div class="pp-api-actions"><button type="submit" class="pp-text-button"'+(viewFor('contacts').busy?' disabled':'')+'>确认添加</button><button type="button" class="pp-text-button" data-contact-cancel>取消</button></div></form>':'';

    function openContactSearch(){contactSearchOpen=true;route==='app:phone'?renderPhone():renderMessages();content.querySelector('[data-contact-query]')?.focus();}
    function renderPhone() {
        const input = shadow.querySelector('[data-phone-draft]');
        const focused = input && shadow.activeElement === input;
        const selection = input ? [input.selectionStart, input.selectionEnd] : null;
        const scroll = content.scrollTop;
        content.innerHTML = renderPhoneScreen(viewFor('phone'), phoneTab, selectedCallId, callDraft);
        if(phoneTab==='contacts')content.querySelector('.pp-phone-toolbar')?.insertAdjacentHTML('afterend',contactSearchHTML());
        content.scrollTop = scroll;
        const next = shadow.querySelector('[data-phone-draft]');
        if (focused && next) { next.focus({ preventScroll: true }); next.setSelectionRange(...selection); }
        if (Object.values(phoneView.calls || {}).some(call => call.direction === 'incoming' && !call.read && ['ended', 'declined', 'missed', 'interrupted'].includes(call.status))) phoneAction(() => adapter.phone.markCallsRead());
    }
    function renderMessages() {
        pressMenu.close(true);
        const input = shadow.querySelector('[data-sms-draft]');
        const focused = input && shadow.activeElement === input;
        const selection = input ? [input.selectionStart, input.selectionEnd] : null;
        const scroll = (content.querySelector('.pp-sms-bubbles') || content).scrollTop;
        const count = Object.values(phoneView.messages || {}).filter(item => item.contactId === selectedSMSContactId).length;
        const key = selectedSMSContactId + ':' + count;
        content.innerHTML = renderMessagesScreen(viewFor('messages'), selectedSMSContactId, pickingSMSContact, smsDrafts, smsEditing);
        if(pickingSMSContact===true)content.insertAdjacentHTML('afterbegin',contactSearchHTML());
        const scroller = content.querySelector('.pp-sms-bubbles') || content;
        scroller.scrollTop = key === smsRenderKey ? scroll : scroller.scrollHeight;
        smsRenderKey = key;
        const next = shadow.querySelector('[data-sms-draft]');
        if (focused && next && !next.disabled) { next.focus({ preventScroll: true }); next.setSelectionRange(...selection); }
        if (opened && selectedSMSContactId && unreadMessages(phoneView.messages, selectedSMSContactId)) {
            phoneAction(() => adapter.phone.markMessagesRead(selectedSMSContactId));

    function phoneAction(action) {
        if (!adapter.phone) { notice('请在酒馆中连接 API 后使用通信功能。'); return; }
        Promise.resolve().then(action).catch(error => {adapter.diagnostics?.add(error,'手机操作');notice(error.message);});
    }

    function renderEmptyApp(id) {
        const app = visibleApps.find(item => item.id === id);
        const words = {
            phone: phoneTab === 'contacts' ? ['暂无联系人', '点击「新增联系人」添加。'] : ['暂无通话记录', '电话功能将在下一阶段接入。'],
            messages: ['暂无短信', '短信功能将在后续阶段接入。'],
            snapchat: ['Snapchat', '暂无内容。'],
            x: ['X', '暂无动态。'],
            amazon: ['Amazon', '暂无订单。'],
        };
        const [heading, detail] = words[id];
        content.innerHTML = '<div class="pp-empty-app"><div class="pp-empty"><span class="pp-empty-icon">' + icon(id === 'phone' && phoneTab === 'contacts' ? 'person' : app.id) + '</span><h2>' + heading + '</h2><p>' + detail + '</p></div>' +
            (id === 'phone' ? '<nav class="pp-phone-tabs" aria-label="电话页面"><button type="button" data-phone-tab="history" aria-pressed="' + (phoneTab === 'history') + '">' + icon('phone') + '<span>电话</span></button><button type="button" data-phone-tab="contacts" aria-pressed="' + (phoneTab === 'contacts') + '">' + icon('person') + '<span>联系人</span></button></nav>' : '') + '</div>';
    }

    function render() {
        if (destroyed) return;
        pressMenu.close(true);
        if (!settings.enabled && (route === 'home' || route.startsWith('app:'))) { route = 'settings'; history = []; }
        phone.dataset.home = String(route === 'home');
        phone.dataset.activeApp = route.startsWith('app:') ? route.slice(4) : '';
        shadow.querySelector('[data-action="back"]').hidden = route === 'home';
        const app = visibleApps.find(item => route === 'app:' + item.id);
        title.textContent = route === 'home' ? '' : route === 'settings' ? '设置' : app ? app.name : SECTIONS.find(section => section.id === route)?.name || '';
        if (route === 'home') renderHome();
        else if (route === 'settings') renderSettings();
        else if (route === 'appearance') renderAppearance();
        else if (route === 'api') renderAPI();
        else if (route === 'errors') renderErrors();
        else if (route === 'apps') renderApps();
        else if (route === 'prompts') renderPrompts();
        else if (route === 'contact') renderContactSettings();
        else if (route === 'retry') renderRetry();
        else if (app?.id === 'phone') renderPhone();
        else if (app?.id === 'messages') renderMessages();
        else if (chatPanels[app?.id]) renderChat(app.id);
        else if (app?.id === 'snapchat') renderSnapchat();
        else if (app?.id === 'x') renderX();
        else if (app?.id === 'daily') renderDaily();
        else if (app?.id === 'weather') renderWeather();
        else if (app?.id === 'assets') renderAssets();
        else if (app?.id === 'amazon') renderAmazon();
        else if (app) renderEmptyApp(app.id);
        content.scrollTop = route === 'app:messages' && selectedSMSContactId ? content.scrollHeight : 0;
        updateClock();
    }

    function navigate(next) {
        if (!settings.enabled && next.startsWith('app:')) return;
        if (next === route) return;
        history.push(route);
        route = next;
        render();
        shadow.querySelector('[data-action="back"]').focus({ preventScroll: true });
        if (next === 'app:phone') phoneAction(() => adapter.phone.open());
        if (next === 'app:messages') phoneAction(() => adapter.phone.openMessages());
        if (next === 'app:daily' && adapter.daily) phoneAction(() => adapter.daily.open());
        if (next === 'app:weather' && adapter.weather) phoneAction(() => adapter.weather.open());
        if (next === 'app:assets' && adapter.assets) phoneAction(() => adapter.assets.open());
        if (next === 'app:amazon' && adapter.amazon) phoneAction(() => adapter.amazon.open());
        if (next === 'app:x' && adapter.x) phoneAction(() => adapter.x.open());
        if (chatPanels[next.slice(4)] && adapter[next.slice(4)]) phoneAction(()=>adapter[next.slice(4)].open());
        if (next === 'app:snapchat' && adapter.snapchat) phoneAction(() => adapter.snapchat.open());
    }

    function open() {
        if (opened) return;
        lastFocused = document.activeElement;
        opened = true;
        route = 'home'; history = []; selectedSMSContactId = null; pickingSMSContact = false; smsEditing = null; contactSearchOpen = false;
        phone.hidden = false;
        if(windowPosition){const point={...windowPosition};phone.style.height='';phone.style.bottom='';phone.style.top='';movePhone(point.x,point.y);}
        launcher.setAttribute('aria-expanded', 'true');
        launcher.setAttribute('aria-label', '收起榴莲手机');
        render();
        shadow.querySelector('[data-action="close"]').focus({ preventScroll: true });
    }

    function close() {
        // Hiding the window does not own or cancel service/model lifetimes.
        opened = false;
        phone.hidden = true;
        launcher.setAttribute('aria-expanded', 'false');
        launcher.setAttribute('aria-label', '打开榴莲手机');
        if (settings.enabled && settings.launcherVisible) launcher.focus({ preventScroll: true });
        else if (lastFocused?.isConnected && lastFocused !== host) lastFocused.focus?.({ preventScroll: true });
    }

    function updateClock() {
        if (!opened) return;
        for(const el of content.querySelectorAll('[data-snap-expiry]'))el.textContent=Date.now()-Number(el.dataset.snapExpiry)>=86400000?'已过期':'24 小时内';
        const clockValue = storyTime(adapter.storyChat?.() || []);
        const time = clockValue.time || '—';
        shadow.querySelector('.pp-status-time').textContent = time;
        const clock = content.querySelector('.pp-big-time');
        if (clock) clock.textContent = time;
        const date = content.querySelector('.pp-date');
        if (date) date.textContent = displayStoryDate(clockValue.date);
    }

    shadow.addEventListener('pointerdown', () => { pendingLauncherClick = false; }, { capture: true, signal: lifetime.signal });
    shadow.addEventListener('click', event => {
        if (pendingLauncherClick && Date.now() < suppressClickUntil) {
            pendingLauncherClick = false; event.preventDefault(); event.stopImmediatePropagation();
        }
    }, { capture: true, signal: lifetime.signal });

    shadow.addEventListener('click', event => {
        const target = event.target.closest('button');
        if (!target) return;
        if(target.dataset.dailyAction){void dailyPanel.action(target.dataset.dailyAction,target.dataset.dailyId);return;}
        if(target.dataset.weatherAction){void weatherPanel.action(target.dataset.weatherAction);return;}
        if(target.dataset.assetAction){void assetPanel.action(target.dataset.assetAction,target.dataset.assetTab,content.querySelector('[data-asset-rate]')?.value);return;}
        if(target.dataset.shopAction){void shopPanel.action(target.dataset.shopAction,target.dataset.shopId);return;}
        if (target.dataset.xAction) { void xPanel.action(target.dataset.xAction,target.dataset.xId); return; }
        if (target.dataset.chatAction) { void currentChat()?.action(target.dataset.chatAction,target.dataset.chatId); return; }
        if (target.dataset.snapAction) { void snapPanel.action(target.dataset.snapAction,target.dataset.snapId); return; }
        if (target.dataset.apiAction) { void apiPanel.action(target.dataset.apiAction); return; }
        const action = target.dataset.action;
        if (action === 'copy-errors') void copyErrors();
        if (action === 'refresh-errors') renderErrors();
        if (action === 'clear-errors') {adapter.diagnostics?.clear();renderErrors();}
        if (action === 'close') { event.stopPropagation(); close(); }
        if (action === 'home') { route = 'home'; history = []; render(); }
        if (action === 'back') {
            if(contactSearchOpen){contactSearchOpen=false;render();}
            else if(route==='app:messages'&&(selectedSMSContactId||pickingSMSContact)){
                if(smsEditing){smsEditing=null;}else{selectedSMSContactId=null;pickingSMSContact=false;}
                renderMessages();
            }else if(currentChat()?.back()){return;}
            else if(route==='app:snapchat'&&snapPanel.back()){return;}
            else if(route==='app:x'&&xPanel.back()){return;}
            else if(route==='app:daily'&&dailyPanel.back()){return;}
            else if(route==='app:amazon'&&shopPanel.back()){return;}
            else if(route==='app:phone'&&selectedCallId){selectedCallId=null;phoneTab='history';renderPhone();}
            else {route = history.pop() || 'home'; render();}
        }
        if (target.dataset.app) navigate(target.dataset.app === 'settings' ? 'settings' : 'app:' + target.dataset.app);
        if (target.dataset.section) navigate(target.dataset.section);
        if (target.dataset.wallpaper && persist({ wallpaper: target.dataset.wallpaper })) {
            shadow.querySelectorAll('[data-wallpaper]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.wallpaper === settings.wallpaper)));
        }
        if (target.dataset.phoneTab) { phoneTab = target.dataset.phoneTab; selectedCallId = null; renderPhone(); }
        if (target.hasAttribute('data-phone-sync')) openContactSearch();
        if (target.hasAttribute('data-contact-bulk')) phoneAction(() => adapter.phone.addEstablishedContacts());
        if (target.dataset.phoneDial) phoneAction(() => adapter.phone.dial(target.dataset.phoneDial));
        if (target.dataset.phoneRecord) { selectedCallId = target.dataset.phoneRecord; callDraft = ''; renderPhone(); }
        if (target.hasAttribute('data-phone-list')) { selectedCallId = null; phoneTab = 'history'; renderPhone(); }
        if (target.hasAttribute('data-phone-hangup')) phoneAction(async () => { await adapter.phone.hangup(); selectedCallId = phoneView.activeCallId; phoneTab = 'history'; callDraft = ''; renderPhone(); });
        if (target.hasAttribute('data-phone-answer')) phoneAction(() => adapter.phone.answer());
        if (target.hasAttribute('data-phone-decline')) phoneAction(() => adapter.phone.decline());
        if (target.hasAttribute('data-phone-check-incoming')) phoneAction(() => adapter.phone.checkIncoming());
        if (target.hasAttribute('data-phone-retry')) phoneAction(() => adapter.phone.retry());
        if (target.hasAttribute('data-sms-new')) { pickingSMSContact = true; selectedSMSContactId = null; renderMessages(); }
        if (target.hasAttribute('data-sms-back')) { pickingSMSContact = false; selectedSMSContactId = null; renderMessages(); }
        if (target.hasAttribute('data-sms-blocklist')) { pickingSMSContact = 'blocked'; selectedSMSContactId = null; renderMessages(); }
        if (target.dataset.blockId) phoneAction(() => adapter.phone.setBlocked(target.dataset.blockId, target.dataset.blockChannel, target.dataset.blockValue === 'true'));
        if (target.dataset.smsContact) { selectedSMSContactId = target.dataset.smsContact; pickingSMSContact = false; renderMessages(); }
        if (target.hasAttribute('data-sms-sync')) openContactSearch();
        if(target.hasAttribute('data-contact-cancel')){contactSearchOpen=false;render();}
        if(target.hasAttribute('data-sms-edit-cancel')){smsEditing=null;renderMessages();}
        if (target.dataset.smsRetry) phoneAction(() => adapter.phone.retryMessage(target.dataset.smsRetry));
        if (action === 'reset-prompt' && persist({ prompts: { ...settings.prompts, [promptId]: PROMPTS[promptId].text } })) { renderPrompts(); notice('已恢复此项默认提示词'); }
    }, { signal: lifetime.signal });

    bindComposerKeys(shadow, {
        signal:lifetime.signal,
        async queue(input){
            if(viewFor('contacts').busy)return;
            if(input.hasAttribute('data-sms-draft')){
                const id=selectedSMSContactId,draft=input.value;
                if(!draft.trim()||!adapter.phone)return;
                const result=await adapter.phone.queueMessage(id,draft);
                if(result?.value?.saved&&smsDrafts[id]===draft)delete smsDrafts[id];
                if(opened&&route==='app:messages'&&selectedSMSContactId===id){renderMessages();content.querySelector('[data-sms-draft]')?.focus({preventScroll:true});}
            }else if(input.dataset.chatField==='message'){
                const app=route.slice(4);await chatPanels[app]?.queueCurrent();
                if(opened&&route==='app:'+app)content.querySelector('[data-chat-field="message"]')?.focus({preventScroll:true});
            }else{
                await snapPanel.queueCurrent();
                if(opened&&route==='app:snapchat')content.querySelector('[data-snap-field="message"]')?.focus({preventScroll:true});
            }
        },
        onError:error=>{adapter.diagnostics?.add(error,'消息输入');notice(error.message);},
    });

    shadow.addEventListener('submit', event => {
        if(event.target.hasAttribute('data-contact-search')){
            event.preventDefault();const query=contactQuery.trim();if(!query)return;
            phoneAction(async()=>{const result=await adapter.phone.scan(query);if(result?.ok){contactSearchOpen=false;render();}});return;
        }
        if(event.target.hasAttribute('data-sms-edit-form')){
            event.preventDefault();const edit=smsEditing;if(!edit)return;
            phoneAction(async()=>{const result=await adapter.phone.editMessage(edit.id,edit.text);if(result?.ok){smsEditing=null;renderMessages();}});return;
        }
        if(event.target.dataset.shopForm){event.preventDefault();void shopPanel.submit(event.target);return;}
        if(event.target.dataset.xForm){event.preventDefault();void xPanel.submit(event.target);return;}
        if(event.target.dataset.chatForm){event.preventDefault();void currentChat()?.submit(event.target);return;}
        if(event.target.dataset.snapForm){event.preventDefault();void snapPanel.submit(event.target);return;}
        if (event.target.hasAttribute('data-sms-form')) {
            event.preventDefault();
            const contactId = selectedSMSContactId;
            const draft = smsDrafts[contactId] || '';
            phoneAction(async () => {
                const result = await adapter.phone.flushMessages(contactId, draft);
                if (result?.value?.saved && smsDrafts[contactId] === draft) delete smsDrafts[contactId];
                if (opened && route === 'app:messages') renderMessages();
            });
            return;
        }
        if (!event.target.hasAttribute('data-phone-form')) return;
        event.preventDefault();
        const text = callDraft.trim();
        if (text) phoneAction(async () => { callDraft = ''; await adapter.phone.say(text); });
    }, { signal: lifetime.signal });

    shadow.addEventListener('change', event => {
        const target = event.target;
        if (target.hasAttribute('data-phone-enabled')) { persist({ enabled: target.checked }); render(); return; }
        if(target.dataset.shopField){shopPanel.input(target);return;}
        if(target.dataset.xField){xPanel.input(target);return;}
        if(target.dataset.chatField){currentChat()?.input(target);return;}
        if(target.dataset.snapField||target.dataset.snapSelect){snapPanel.input(target);return;}
        if (target.dataset.apiField && target.tagName === 'SELECT') { apiPanel.input(target.dataset.apiField, target.value); return; }
        if (target.dataset.enabled) persist({ apps: { ...settings.apps, [target.dataset.enabled]: target.checked } });
        if (target.hasAttribute('data-prompt-selector')) { promptId = target.value; renderPrompts(); }
        if (target.dataset.setting) {
            const key = target.dataset.setting;
            let value = target.value;
            if (['fontSize', 'phoneWidth', 'retries'].includes(key)) {
                value = Number(value);
                if (target.value.trim() === '' || !Number.isInteger(value) || !target.checkValidity()) {
                    target.value = settings[key];
                    notice(key === 'retries' ? '请填写 0—15 的整数' : '请填写有效数值');
                    return;
                }
            }
            if (['proactiveEnabled'].includes(key)) value = value === 'true';
            if (persist({ [key]: value })) {
                if(key==='proactiveEnabled')renderContactSettings();
                const output = shadow.querySelector('[data-output="' + key + '"]');
                if (output) output.textContent = settings[key];
            }
        }
    }, { signal: lifetime.signal });

    shadow.addEventListener('input', event => {
        if(event.target.hasAttribute('data-contact-query')){contactQuery=event.target.value;return;}
        if(event.target.hasAttribute('data-sms-edit-text')){if(smsEditing)smsEditing.text=event.target.value;return;}
        if(event.target.dataset.shopField){shopPanel.input(event.target);return;}
        if(event.target.dataset.xField){xPanel.input(event.target);return;}
        if(event.target.dataset.chatField){currentChat()?.input(event.target);return;}
        if(event.target.dataset.snapField){snapPanel.input(event.target);return;}
        if (event.target.dataset.apiField && event.target.tagName !== 'SELECT') {
            apiPanel.input(event.target.dataset.apiField, event.target.value);
            if (event.target.dataset.apiField === 'baseUrl') { const keyInput = shadow.querySelector('[data-api-field="key"]'); if (keyInput) keyInput.value = apiPanel.keyValue(); }
            const status = shadow.querySelector('[data-api-status]'); if (status) { status.textContent = '尚未保存。'; status.dataset.kind = ''; }
            return;
        }
        if (event.target.hasAttribute('data-sms-draft') && selectedSMSContactId) smsDrafts[selectedSMSContactId] = event.target.value;
        if (event.target.hasAttribute('data-phone-draft')) callDraft = event.target.value;
        if (event.target.hasAttribute('data-prompt-editor')) {
            const saved = persist({ prompts: { ...settings.prompts, [promptId]: event.target.value } });
            content.querySelector('.pp-save-status').textContent = saved ? '已更新' : '保存失败';
        }
        if (event.target.type === 'range') {
            const key = event.target.dataset.setting;
            const output = shadow.querySelector('[data-output="' + key + '"]');
            if (output) output.textContent = event.target.value;
        }
    }, { signal: lifetime.signal });

    launcher.addEventListener('click', event => {
        event.stopPropagation();
        if (Date.now() < suppressClickUntil) return;
        opened ? close() : open();
    }, { signal: lifetime.signal });

    launcher.addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.isPrimary === false) return;
        event.stopPropagation();
        const rect = launcher.getBoundingClientRect();
        dragging = { id: event.pointerId, x: event.clientX, y: event.clientY, left: rect.left, top: rect.top, moved: false, threshold: event.pointerType === 'touch' ? 12 : 6 };
        try { launcher.setPointerCapture(event.pointerId); } catch { /* Some embedded browsers reject capture. */ }
    }, { signal: lifetime.signal });

    launcher.addEventListener('pointermove', event => {
        if (!dragging || event.pointerId !== dragging.id) return;
        const dx = event.clientX - dragging.x;
        const dy = event.clientY - dragging.y;
        if (Math.hypot(dx, dy) > dragging.threshold) dragging.moved = true;

const PREVIEW_KEY = 'pocket_phone_preview_v010';
let storageAvailable = true;
let memory = {};
try { localStorage.setItem(PREVIEW_KEY + '_probe', '1'); localStorage.removeItem(PREVIEW_KEY + '_probe'); }
catch { storageAvailable = false; document.getElementById('storage-note').hidden = false; }
const adapter = {
    diagnostics: createDiagnostics({storage:null,version:VERSION}),
    load() { try { return storageAvailable ? JSON.parse(localStorage.getItem(PREVIEW_KEY) || '{}') : memory; } catch { return {}; } },
    save(settings) { if (storageAvailable) localStorage.setItem(PREVIEW_KEY, JSON.stringify(settings)); else memory = settings; },
    connectionName() { return '离线预览中不连接模型。'; },
    onChange(settings) { document.getElementById('preview-visibility').checked = settings.launcherVisible; },
};
const controller = mountPhone({ adapter, styles: PREVIEW_STYLES });
document.getElementById('preview-visibility').checked = controller.getSettings().launcherVisible;
document.getElementById('preview-visibility').addEventListener('change', event => controller.setLauncherVisible(event.target.checked));
document.getElementById('preview-open').addEventListener('click', () => controller.open());
document.getElementById('preview-settings').addEventListener('click', () => controller.openSettings());
document.getElementById('preview-reset').addEventListener('click', () => controller.resetPosition());
controller.open();
</script></body></html>
