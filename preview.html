<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>榴莲手机 · 界面预览</title>
<style>

</style></head><body><main><small>POCKET PHONE · 0.13.0</small><h1>榴莲手机，先从这里开始。</h1><p>这是离线界面预览，可以查看桌面、设置及 Snapchat 页面。模型互动需安装到酒馆后使用。</p><div class="actions"><button id="preview-open">打开手机</button><button id="preview-settings">打开设置</button></div><div class="card"><strong>悬浮入口</strong><label><input id="preview-visibility" type="checkbox">显示悬浮入口</label><button id="preview-reset">重置悬浮位置</button><p style="font-size:12px;margin-bottom:0">安装到酒馆后，这组控制位于扩展栏的「榴莲手机」条目中。</p></div><ol><li>检查手机窗口是否挡住操作、字号是否合适。</li><li>在「设置 → App 管理」关闭、重新开启应用。</li><li>修改提示词和重试次数，刷新后检查是否保留。</li></ol><p id="storage-note" hidden>当前打开方式不支持保存预览设置；本次修改只在页面关闭前保留。可换用浏览器打开。</p><footer>预览数据独立于酒馆。本文件无需联网，不请求模型。桌面暂时显示设备时间。</footer></main><script>const MODULE_KEY = 'personal_pocket_phone';
const LAUNCHER_SIZE = 36;
const VERSION = '0.13.0';
const APPS = [
    { id: 'phone', name: '电话', color: '#25ad75', dock: true },
    { id: 'messages', name: '短信', color: '#3289d9', dock: true },
    { id: 'snapchat', name: 'Snapchat', color: '#ffe34d' },
    { id: 'x', name: 'X', color: '#252733' },
    { id: 'amazon', name: 'Amazon', color: '#e89947' },
];
const PROMPTS = {
    contactEvent: { name: '联系事件与后续反应', text: '依据角色设定、当前剧情与 user 的反应，自行决定是否联系、继续联系、等待或结束。没有固定联系间隔，不预设拒接或沉默后必须停止，也不预设任何性格或分手情节必然导致纠缠。每步仅选择一次来电、一条短信、等待或结束；不能绕过拉黑，不替 user 发言，不预生成一串后续。' },
    incomingMessages: { name: '主动短信', text: '依据角色设定、双方关系、当前剧情和已有通信，自行判断是否主动发短信。可以联系，也可以等待或不联系；不设固定间隔，未回复时是否再次联系由角色当下动机决定。不得替 user 发言或绕过拉黑。消息语言与角色表达习惯遵循酒馆预设。' },
    incoming: { name: '主动来电', text: '只在剧情中有合理动机且角色有可用途径取得 user 号码时发起来电。必须核对正文依据，不能因为 user 知名就凭空知道号码，不能把 user 单方面知道角色号码当成双方交换。共友需要明确存在且确实能提供号码；公开渠道需要正文确认号码可被访问。不强行制造来电，不重复已在正文中完成的电话。' },
    continuity: { name: '通信与正文衔接', text: '以下是当前角色已经亲自参与的手机通信，作为有效剧情记忆供后续正文参考。继续当前剧情，不重演整段通信，不把记录原样贴回正文，不强行让角色提起。保持通信中的约定、已交换的信息和人物关系；措辞、叙事与语言仍遵循酒馆预设和角色设定。短信和电话绑定真实身份；其他角色没有自动获知这些私人交流。不要把电话中未见的画面补成已知事实。' },
    contacts: { name: '联系方式识别', text: 'user 点击「新增联系人」后，仅从本次提供的可见正文与 user 人设查找。正文需已实际得到号码或明确交换号码，单纯询问而未得到不算；user 人设中明确的既有亲人、朋友或伴侣，即使无交换号码剧情也可加入电话联系人。每项必须提供对应来源的连续逐字依据。未给出具体数字用 null，不编造号码或姓名。电话与短信共用联系人；这些关系不代表拥有任何社媒账号。' },
    general: { name: '通用', text: '这是 user 的个人手机，所有互动均为文字扮演。继承酒馆当前角色卡、相关世界书、有效剧情与预设中的内容语言要求。界面标签使用中文。不得替 user 编造消息或决定。仅使用对应角色有依据获知的信息；未获知的私人内容不得跨角色、跨平台传播。' },
    phone: { name: '电话', text: '通过文字表现电话交流，只描写对白、可听见的语气、停顿和背景声音。不得描写通话另一端不可见的表情、动作、服装或内心活动。电话对应真实身份。user 仅能拨打已保存的电话联系人，包括正文获得号码或人设中既有亲友。char 发起来电必须有获取 user 号码的有效途径和依据。' },
    messages: { name: '短信', text: '以短信内容进行交流，继承角色的表达习惯及酒馆预设的语言要求。短信号码与真实身份绑定。依据已保存的电话联系人互动，包括正文获得号码或 user 人设中的既有亲友，不凭空补全号码。不得替 user 发送短信。' },
    snapchat: { name: 'Snapchat', text: '生成 Snapchat 内的文字互动，区分好友邀请、私聊、Snap 与 Stories。遵守好友及内容可见范围。知道账号不代表知道真实身份；不得因为后台存在对应关系而认出匿名 user。已在有效剧情中确认的身份不会因改名而遗忘。' },
    x: { name: 'X', text: '生成 X 的帖子、回复或私信，遵循角色设定和酒馆预设的内容语言。char 默认使用真名账号。公开帖子可以被发现并互动，发现账号不等于知道账号背后的真实身份。私信遵守联系与可见范围。禁止把私人谈话直接当作公众已知信息。' },
    amazon: { name: 'Amazon', text: '生成故事世界中的虚拟商品及订单内容，使用已确定的剧情背景、商品和货币信息。所有订单均为故事内模拟，不进行真实购买。订单和地址是私人信息，未获知的角色不得自动知晓。' },
};

const LEGACY_PROACTIVE_PROMPTS = {"phone": "通过文字表现电话交流，只描写对白、可听见的语气、停顿和背景声音。不得描写通话另一端不可见的表情、动作、服装或内心活动。电话对应真实身份。user 仅能拨打在有效剧情中已获得的号码。char 发起来电必须有获取 user 号码的有效途径和依据。", "messages": "以短信内容进行交流，继承角色的表达习惯及酒馆预设的语言要求。短信号码与真实身份绑定。仅依据有效剧情中获取的联系方式互动，不凭空补全号码。不得替 user 发送短信。", "contacts": "仅记录正文中 user 已实际获得的电话号码或明确完成的交换号码事件。只有索取意图、尚未给出的请求、他人的私密号码、char 单方面得知 user 号码均不符合。给出连续的逐字正文证据，证据应同时指明对方身份和号码归属，不得仅摘一个号码。不同人物各只有一个电话号码，不编造获取渠道。", "contactEvent": "日常联系保持低频。仅当有效剧情中的具体冲突、紧急事件或正在进行的交流确实需要角色立即反应时，判断是否开启或继续同一联系事件。完全依据角色设定及当下反应，不能看到分手就默认纠缠，不能靠偏执或占有欲标签决定行为。每步只选择一次来电、一条短信、等待或结束；根据 user 的拒接、回复、沉默判断下一步，可改渠道但不得绕过拉黑。解决、放弃或转场时结束事件。不得替 user 发言，不预生成一串后续。", "incomingMessages": "默认不主动发短信。仅在需要兑现具体约定、告知新情况或处理确有时效的问题时，发送一条简洁短信。不以想念、闲聊、刷存在感反复打断正文。避免重复已经说过的内容；未收到回复时不要追发。消息语言与角色表达习惯遵循酒馆预设。"};

const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const numeric = (value, min, max, fallback) => typeof value === 'number' && Number.isFinite(value) ? Math.min(max, Math.max(min, value)) : fallback;

function normalizeSettings(value) {
    const raw = isRecord(value) ? value : {};
    const { contactInterval, unansweredInterval, contactEvents, contactExceptions, ...current } = raw;
    const oldApps = isRecord(raw.apps) ? raw.apps : {};
    const api = isRecord(raw.api) ? raw.api : {};
    const oldPrompts = isRecord(raw.prompts) ? raw.prompts : {};
    return {
        ...current,
        schemaVersion: 1,
        api: { memorySource: api.memorySource === 'none' ? 'none' : 'qqj', mode: api.mode === 'independent' ? 'independent' : 'host', baseUrl: typeof api.baseUrl === 'string' ? api.baseUrl : '', model: typeof api.model === 'string' ? api.model : '', maxTokens: Math.round(numeric(api.maxTokens, 128, 32768, 2048)), timeout: Math.round(numeric(api.timeout, 15, 300, 90)), historyLimit: Math.round(numeric(api.historyLimit, 1, 500, 80)), revision: Math.round(numeric(api.revision, 0, Number.MAX_SAFE_INTEGER, 0)) },
        launcherVisible: typeof raw.launcherVisible === 'boolean' ? raw.launcherVisible : true,
        position: isRecord(raw.position) ? { x: numeric(raw.position.x, 0, 1, 1), y: numeric(raw.position.y, 0, 1, 0.8) } : null,
        theme: ['dark', 'light'].includes(raw.theme) ? raw.theme : 'dark',
        wallpaper: ['violet', 'ocean', 'sand', 'graphite'].includes(raw.wallpaper) ? raw.wallpaper : 'violet',
        fontSize: Math.round(numeric(raw.fontSize, 14, 20, 15)),
        phoneWidth: Math.round(numeric(raw.phoneWidth, 300, 420, 360)),
        proactiveEnabled: typeof raw.proactiveEnabled === 'boolean' ? raw.proactiveEnabled : true,
        retries: Math.round(numeric(raw.retries, 0, 15, 2)),
        apps: Object.fromEntries(APPS.map(app => [app.id, typeof oldApps[app.id] === 'boolean' ? oldApps[app.id] : true])),
        prompts: Object.fromEntries(Object.entries(PROMPTS).map(([id, prompt]) => [id, typeof oldPrompts[id] === 'string' && oldPrompts[id] !== LEGACY_PROACTIVE_PROMPTS[id] ? oldPrompts[id] : prompt.text])),
    };
}

function clampPosition(position, viewport, size = LAUNCHER_SIZE) {
    const margin = 8;
    const maxX = Math.max(margin, viewport.width - size - margin);
    const maxY = Math.max(margin, viewport.height - size - margin);
    return {
        x: Math.min(maxX, Math.max(margin, position?.x ?? maxX)),
        y: Math.min(maxY, Math.max(margin, position?.y ?? Math.max(margin, maxY * 0.8))),
    };
}

// Independent OpenAI-compatible requests go through the existing ST backend.
// Never overwrite the host's connection settings or borrow its provider keys.
function normalizeApiUrl(value) {
    let url;
    try { url = new URL(String(value ?? '').trim()); } catch { throw new Error('请填写完整 API 地址，例如 https://example.com/v1'); }
    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('API 地址仅支持 HTTP/HTTPS，不要在地址里填写密钥或查询参数。');
    url.pathname = url.pathname.replace(/\/(?:chat\/completions|models)\/?$/, '').replace(/\/+$/, '') || '/v1';
    return url.toString().replace(/\/$/, '');
}

function createKeyStore(storage) {
    if (arguments.length === 0) { try { storage = globalThis.localStorage; } catch { storage = null; } }
    const prefix = 'durian_phone_api_key:';
    return {
        get(url) { try { return storage?.getItem(prefix + normalizeApiUrl(url)) ?? ''; } catch { return ''; } },
        set(url, key) {
            if (!storage) throw new Error('当前浏览器不能保存密钥，请检查浏览器存储设置。');
            const name = prefix + normalizeApiUrl(url);
            try { key ? storage.setItem(name, key) : storage.removeItem(name); }
            catch { throw new Error('密钥保存失败，请检查浏览器存储空间或权限。'); }
        },
    };
}

function failure(message, retryable = false) { return Object.assign(new Error(message), { retryable }); }
function apiError(status, data) {
    const code = String(data?.error?.code || data?.error?.type || '').toLowerCase();
    if (status === 401 || status === 403 || /authentication|invalid_api_key/.test(code)) return failure('认证失败，请检查这个地址对应的 API 密钥和访问权限。');
    if (status === 429 || /quota|rate_limit/.test(code)) return failure('服务额度不足或请求过于频繁，请稍后重试。', status === 429);
    if (status === 404 || /model_not_found/.test(code)) return failure('找不到接口或模型，请检查 API 地址及模型 ID。');
    if (/context_length/.test(code)) return failure('请求超出模型上下文，请减少读取的正文楼数。');
    return failure('API 请求失败' + (status ? '（HTTP ' + status + '）' : '') + '，请检查服务地址、模型与酒馆服务端连接。', status >= 500);
}

function extractApiText(data) {
    if (data?.error) throw apiError(0, data);
    if (data?.choices?.[0]?.finish_reason === 'length') throw failure('模型输出被截断，请提高回复 token 上限。');
    const content = data?.choices?.[0]?.message?.content;
    const text = typeof content === 'string' ? content : Array.isArray(content) ? content.filter(p => p.type === 'text').map(p => p.text).join('') : '';
    if (!text.trim()) throw failure('模型没有返回文字，请检查模型是否支持 Chat Completions，或提高回复 token 上限。');
    return text.trim();
}

function createApiClient({ getContext, getSettings, getKey, buildContext, fetchImpl = globalThis.fetch }) {
    const active = new Set();
    async function post(path, config, key, extra, isCurrent = () => true) {
        const endpoint = normalizeApiUrl(config.baseUrl);
        const host = getContext();
        if (typeof host?.getRequestHeaders !== 'function') throw failure('当前酒馆缺少请求接口，请更新酒馆后使用独立 API。');
        if (/\r|\n/.test(key)) throw failure('密钥不能包含换行，请重新粘贴。');
        if (!isCurrent()) throw failure('本次操作已取消。');
        const controller = new AbortController(); active.add(controller);
        let timedOut = false;
        const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, config.timeout * 1000);
        const watcher = setInterval(() => { if (!isCurrent()) controller.abort(); }, 150);
        try {
            const response = await fetchImpl('/api/backends/chat-completions/' + path, {
                method: 'POST', headers: host.getRequestHeaders(), credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
                body: JSON.stringify({ chat_completion_source: 'openai', reverse_proxy: endpoint, proxy_password: key, ...extra }),
            });
            if (!isCurrent()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            let data;
            try { data = await response.json(); } catch { throw failure('接口没有返回有效 JSON，请检查 API 地址和酒馆版本。'); }
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (!response.ok || data?.error) throw apiError(response.status, data);
            return data;
        } catch (error) {
            if (timedOut) throw failure('API 请求超时，可调整超时时间后重试。', true);
            if (controller.signal.aborted || !isCurrent()) throw failure('本次操作已取消。');
            if (error && typeof error === 'object' && 'retryable' in error) throw error;
            // Provider error bodies can echo credentials: never display them.
            throw failure('无法连接 API，请检查酒馆服务端网络与服务地址。', true);
        } finally { clearTimeout(timeout); clearInterval(watcher); active.delete(controller); }
    }
    async function complete(config, key, messages, isCurrent) {
        if (!config.model?.trim()) throw failure('请先填写或选择模型 ID。');
        return extractApiText(await post('generate', config, key, { model: config.model.trim(), messages, stream: false,
            max_tokens: config.maxTokens }, isCurrent));
    }
    return {
        async generate(prompt, contact, isCurrent) {
            const config = structuredClone(getSettings().api);
            const key = getKey(config.baseUrl);
            const fingerprint = JSON.stringify(config);
            const current = () => isCurrent() && fingerprint === JSON.stringify(getSettings().api) && key === getKey(config.baseUrl);
            const messages = await buildContext(getContext(), prompt, contact, config, current);
            if (!current()) throw failure('聊天或 API 配置已变化，本次操作已取消。');
            return complete(config, key, messages, current);
        },
        async models(config, key, isCurrent) {
            const data = await post('status', config, key, {}, isCurrent);
            if (!Array.isArray(data?.data)) throw failure('服务没有返回模型列表，请手动填写模型 ID。');
            return [...new Set(data.data.map(item => item?.id).filter(id => typeof id === 'string' && id.length < 300))].sort();
        },
        test(config, key, isCurrent) {
            return complete({ ...config, maxTokens: Math.max(128, Math.min(config.maxTokens, 1024)) }, key,
                [{ role: 'user', content: 'Connection test. Reply only: OK' }], isCurrent);
        },
        cancel() { for (const controller of active) controller.abort(); },
    };
}

const apiEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function createApiPanel({ adapter, getSettings, persist, redraw }) {
    let draft = null, key = '', tab = 'connection', models = [], status = '', statusKind = '', busy = false, token = 0;
    function init() { if (!draft) { draft = structuredClone(getSettings().api); key = adapter.keyStore?.get(draft.baseUrl) || ''; } }
    function field(id, label, type = 'text', extra = '') {
        const value = id === 'key' ? key : draft[id];
        return '<label class="pp-field"><span>' + label + '</span><input data-api-field="' + id + '" type="' + type + '" value="' + apiEscape(value) + '" ' + extra + (busy ? ' disabled' : '') + '></label>';
    }
    function config(requireModel = true) {
        init();
        const value = { ...draft, baseUrl: normalizeApiUrl(draft.baseUrl), model: draft.model.trim() };
        if (requireModel && !value.model) throw new Error('请填写或选择模型 ID。');
        for (const [id, min, max] of [['maxTokens', 128, 32768], ['timeout', 15, 300], ['historyLimit', 1, 500]]) {
            if (!Number.isInteger(value[id]) || value[id] < min || value[id] > max) throw new Error('请在参数页填写范围内的整数。');
        }
        if (/\r|\n/.test(key)) throw new Error('密钥不能包含换行。');
        return value;
    }
    return {
        html() {
            init();
            const disabled = busy ? ' disabled' : '';
            let body = '';
            if (tab === 'connection') {
                body = '<div class="pp-card pp-form"><label class="pp-field"><span>手机模型连接</span><select data-api-field="mode"' + disabled + '><option value="host"' + (draft.mode === 'host' ? ' selected' : '') + '>跟随酒馆</option><option value="independent"' + (draft.mode === 'independent' ? ' selected' : '') + '>独立 API（OpenAI 兼容）</option></select></label>';
                if (draft.mode === 'independent') body += field('baseUrl', 'API 地址', 'url', 'placeholder="https://example.com/v1" autocomplete="off" spellcheck="false"') +
                    field('key', 'API 密钥', 'password', 'autocomplete="off" spellcheck="false" placeholder="无需密钥的本地服务可留空"') +
                    field('model', '模型 ID', 'text', 'autocomplete="off" spellcheck="false" placeholder="填写服务商提供的模型 ID"') +
                    (models.length ? '<label class="pp-field"><span>已获取的模型</span><select data-api-field="modelChoice"' + disabled + '><option value="">选择模型</option>' + models.map(id => '<option value="' + apiEscape(id) + '"' + (draft.model === id ? ' selected' : '') + '>' + apiEscape(id) + '</option>').join('') + '</select></label>' : '') +
                    '<div class="pp-api-actions"><button type="button" class="pp-text-button" data-api-action="models"' + disabled + '>获取模型</button><button type="button" class="pp-text-button" data-api-action="test"' + disabled + '>测试连接</button><button type="button" class="pp-text-button" data-api-action="clear-key"' + disabled + '>清除密钥</button></div>';
                else body += '<p class="pp-footnote">使用酒馆当前模型连接和完整生成流程。</p>';

        },
        input(id, value) {
            init(); token++; statusKind = ''; status = '尚未保存。';
            if (id === 'key') key = value.trim();
            else if (id === 'baseUrl') { draft.baseUrl = value; key = adapter.keyStore?.get(value) || ''; models = []; }
            else if (id === 'modelChoice') { draft.model = value; redraw(); }
            else draft[id] = ['maxTokens', 'timeout', 'historyLimit'].includes(id) ? Number(value) : value;
            if (id === 'mode' || id === 'memorySource') redraw();
        },
        keyValue: () => key,
        async action(action) {
            init();
            if (action.startsWith('tab:')) { tab = action.slice(4); redraw(); return; }
            if (action === 'memory-refresh') { redraw(); return; }
            if (action === 'cancel') { token++; busy = false; status = '已取消请求。'; redraw(); return; }
            if (busy) return;
            statusKind = '';
            try {
                if (action === 'save') {
                    const next = draft.mode === 'independent' ? config() : { ...draft };
                    const previousKey = next.baseUrl ? adapter.keyStore?.get(next.baseUrl) : '';
                    if (draft.mode === 'independent') {
                        if (!adapter.keyStore) throw new Error('离线预览不保存 API 密钥。');
                        adapter.keyStore.set(next.baseUrl, key);
                    }
                    if (!persist({ api: { ...next, revision: getSettings().api.revision + 1 } })) {
                        if (draft.mode === 'independent') adapter.keyStore.set(next.baseUrl, previousKey);
                        throw new Error('API 设置保存失败。');
                    }
                    draft = structuredClone(getSettings().api); token++; statusKind = 'success'; status = '已保存，手机将使用' + (draft.mode === 'independent' ? '独立 API。' : '酒馆当前连接。');
                } else if (action === 'clear-key') {
                    adapter.keyStore?.set(normalizeApiUrl(draft.baseUrl), ''); key = ''; token++;
                    status = '此地址的本地密钥已清除。';
                } else if (action === 'models' || action === 'test') {
                    if (!adapter.api) throw new Error('离线预览不能连接 API，请在酒馆内测试。');
                    const next = config(action === 'test');
                    const id = ++token; busy = true; status = action === 'models' ? '正在获取模型…' : '正在测试连接…'; redraw();
                    try {
                        const result = await adapter.api[action](next, key, () => token === id);
                        if (token !== id) return;
                        if (action === 'models') { models = result; status = result.length ? '已获取 ' + result.length + ' 个模型，请选择后保存。' : '服务返回空列表，请手动填写模型 ID。'; }
                        else { statusKind = 'success'; status = '连接成功，模型已返回文字。请保存设置后使用。'; }
                    } catch (error) { if (token === id) { statusKind = 'error'; status = error.message; } }
                    finally { if (token === id) busy = false; }
                }
            } catch (error) { statusKind = 'error'; status = error.message; }
            redraw();
        },
        destroy() { token++; key = ''; draft = null; },
    };
}

// Small, chat-local event journal. It stores phone changes, never a copy of prose.
const JOURNAL_KEY = 'durian_phone_history';
const COLLECTIONS = ['profiles', 'contacts', 'calls', 'messages', 'snapchat', 'x', 'orders', 'assets'];
const SCHEMA = 1;
const EMPTY_REVISION = 'root';
const copy = value => JSON.parse(JSON.stringify(value));
const record = value => value && typeof value === 'object' && !Array.isArray(value);

const isMemoryHidden = message => message?.extra?.qianqianjieAutoHide?.schemaVersion === 1 && typeof message.extra.qianqianjieAutoHide.chatId === 'string' && !message.extra.type;

function messageSignatures(chat, legacy = false) {
    return chat.map(message => JSON.stringify([
        String(message.mes ?? ''), String(message.name ?? ''), Boolean(message.is_user),
        Boolean(message.is_system && (legacy || !isMemoryHidden(message))), message.send_date ?? null, message.swipe_id ?? null,
    ]));
}

async function revisionsFor(signatures) {
    const encoder = new TextEncoder();
    const revisions = [];
    let previous = EMPTY_REVISION;
    for (const signature of signatures) {
        const hash = await crypto.subtle.digest('SHA-256', encoder.encode(previous + '\n' + signature));
        previous = Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
        revisions.push(previous);
    }
    return revisions;
}

function validateChanges(changes) {
    if (!Array.isArray(changes) || !changes.length) throw new Error('手机记录缺少变更内容。');
    for (const change of changes) {
        if (!record(change) || !COLLECTIONS.includes(change.collection) || typeof change.key !== 'string' || !change.key.length ||
            ['__proto__', 'constructor', 'prototype'].includes(change.key) || !(change.value === null || record(change.value))) {
            throw new Error('手机记录格式不正确，原数据已保留。');
        }
    }
}

function readJournal(raw) {
    if (raw === undefined) return { schema: SCHEMA, events: [] };
    if (!record(raw) || raw.schema !== SCHEMA || !Array.isArray(raw.events)) {
        throw new Error('暂时无法读取此聊天的手机记录，原数据已保留。');
    }
    const ids = new Set();
    for (const event of raw.events) {
        if (!record(event) || typeof event.id !== 'string' || !event.id || ids.has(event.id) ||
            !record(event.source) || !Number.isInteger(event.source.index) || event.source.index < 0 ||
            typeof event.source.revision !== 'string') throw new Error('手机记录来源不完整，原数据已保留。');
        ids.add(event.id);
        validateChanges(event.changes);
    }
    return copy(raw);
}

function reconcileJournal(raw, revisions, legacyRevisions = null) {
    const journal = readJournal(raw);
    const before = journal.events.length;
    // A chained revision binds an event to its entire narrative prefix, not just
    // its floor number. Editing an earlier floor invalidates later changes too.
    let migrated = false;
    for (const event of journal.events) {
        if (!event.source.visibilityNormalized && legacyRevisions && event.source.revision === legacyRevisions[event.source.index] && revisions[event.source.index]) {
            event.source.revision = revisions[event.source.index]; event.source.visibilityNormalized = true; migrated = true;
        }
    }
    journal.events = journal.events.filter(event => revisions[event.source.index] === event.source.revision);
    return { journal, removed: before - journal.events.length, migrated };
}

function appendChange(journal, revisions, changes, id = crypto.randomUUID()) {
    if (!revisions.length) throw new Error('请先开始一段聊天。');
    validateChanges(changes);
    const next = readJournal(journal);
    if (next.events.some(event => event.id === id)) return next; // Safe retry of the same operation.
    next.events.push({ id, source: { index: revisions.length - 1, revision: revisions.at(-1), visibilityNormalized: true }, changes: copy(changes) });
    return next;
}

function replayJournal(journal) {
    const maps = Object.fromEntries(COLLECTIONS.map(name => [name, new Map()]));
    for (const event of readJournal(journal).events) {
        for (const change of event.changes) {
            if (change.value === null) maps[change.collection].delete(change.key);
            else maps[change.collection].set(change.key, copy(change.value));
        }
    }
    return Object.fromEntries(COLLECTIONS.map(name => [name, Object.fromEntries(maps[name])]));
}

const eventKey = id => 'contactEvent:' + id;
const isBlocked = (state, id, channel) => state.profiles?.['blocked:' + id]?.[channel] === true;

function eventDirective(data, chat, policy) {
    const action = data.event_action || 'none';
    if (!['none', 'start', 'continue', 'wait', 'end'].includes(action)) throw new Error('联系事件判断格式不正确。');
    if (action === 'start') {
        if (!policy.eventsEnabled || data.event_requires_response !== true || typeof data.event_evidence !== 'string' ||
            data.event_evidence.trim().length < 8 || typeof data.event_reason !== 'string' || !data.event_reason.trim()) throw new Error('联系事件缺少实际剧情依据。');
        const index = chat.findIndex((message, i) => i > policy.eventSinceIndex && (!message.is_system || isMemoryHidden(message)) && String(message.mes ?? '').includes(data.event_evidence));
        if (index < 0) throw new Error('联系事件的依据不在当前有效剧情中。');
        return { action, evidence: data.event_evidence, reason: data.event_reason.slice(0, 1000), sourceIndex: index };
    }
    if (['continue', 'wait', 'end'].includes(action) && !policy.event) throw new Error('当前没有可延续的联系事件。');
    return { action: policy.event && action === 'none' ? 'end' : action };
}

function eventChange(previous, directive, participant, revision) {
    if (directive.action === 'start') return { id: crypto.randomUUID(), participant, active: true,
        evidence: directive.evidence, reason: directive.reason, sourceIndex: directive.sourceIndex, revision };
    if (!previous) return null;
    return { ...previous, active: !['end', 'none'].includes(directive.action) };
}

// A normal telephone/SMS reply can recognize an event in the user's own words
// without making another API call or automatically generating a second response.
function communicationEvent(data, previous, participant, userText, sourceIndex) {
    if (data.event_action === 'end' && previous) return { ...previous, active: false };
    if (data.event_action !== 'start' || data.event_requires_response !== true || !userText ||
        typeof data.event_evidence !== 'string' || data.event_evidence.trim().length < 4 || !userText.includes(data.event_evidence) ||
        typeof data.event_reason !== 'string' || !data.event_reason.trim()) return null;
    return { id: crypto.randomUUID(), participant, active: true, evidence: data.event_evidence,
        reason: data.event_reason.slice(0, 1000), sourceIndex, origin: 'communication' };
}

        (busy ? '<p class="pp-phone-progress" role="status">正在处理，请稍候…</p>' : '') + errorHTML + (contactStatus && tab === 'contacts' ? '<p class="pp-contact-status" role="status">' + phoneEscape(contactStatus) + '</p>' : '') +
        '<div class="pp-phone-list">' + (rows || '<div class="pp-empty"><h2>' + (tab === 'contacts' ? '暂无联系人' : '暂无通话记录') + '</h2><p>' + (tab === 'contacts' ? '点击「新增联系人」，从可见正文和你的人设中查找。' : '到下方「联系人」选择已经取得号码的人拨打。') + '</p></div>') + '</div><nav class="pp-phone-tabs" aria-label="电话页面">' +
        [['history', '电话', 'phone'], ['contacts', '联系人', 'person'], ['blocked', '黑名单', 'person']].map(([id, label, glyph]) => '<button type="button" data-phone-tab="' + id + '" aria-pressed="' + (tab === id) + '">' + icon(glyph) + '<span>' + label + '</span></button>').join('') + '</nav></div>';
}

function validateSMS(data) {
    if (!['reply', 'no_reply'].includes(data.status) || typeof data.text !== 'string' ||
        (data.status === 'reply' && !data.text.trim())) throw new Error('短信回复格式不正确，请重试。');
    return { status: data.status, text: data.text.trim() };
}
function threadMessages(messages, contactId) {
    return Object.values(messages ?? {}).filter(message => message.contactId === contactId).sort((a, b) => a.createdAt - b.createdAt);
}
function unreadMessages(messages, contactId = null) {
    return Object.values(messages ?? {}).filter(message => message.role === 'assistant' && !message.read && (!contactId || message.contactId === contactId)).length;
}

// A received SMS supplies a return address for this thread only. It does not
// unlock telephone dialing or add an unearned number to the contact directory.
function messageParticipants(state) {
    const participants = { ...(state.contacts ?? {}) };
    for (const message of Object.values(state.messages ?? {})) {
        if (message.proactive && message.role === 'assistant' && message.participant?.id === message.contactId && !participants[message.contactId]) {
            participants[message.contactId] = { ...message.participant, number: null, receivedSMS: true };
        }
    }
    return participants;
}

const smsEscape = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const smsTime = value => new Date(value).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
const replyLabels = { pending: '等待回复…', received: '已发送', failed: '回复获取失败', no_reply: '已发送 · 暂无回复', blocked: '已暂停接收回复' };
function renderMessagesScreen(view, selectedContactId, picking, drafts) {
    const { contacts = {}, messages = {}, busy = false, error = '', errorKind = null, contactStatus = '' } = view ?? {};
    const retryHTML = error && errorKind === 'incoming' ? '<button type="button" class="pp-text-button" data-phone-check-incoming' + (busy ? ' disabled' : '') + '>重试主动联系检查</button>' : '';
    const errorHTML = retryHTML + (error ? '<div class="pp-call-error" role="alert">' + smsEscape(error) + '</div>' : '');
    if (picking === 'blocked') return '<div class="pp-sms-list"><div class="pp-phone-toolbar"><h2>短信黑名单</h2><button type="button" class="pp-text-button" data-sms-back>返回</button></div>' + renderBlockedList(view, 'messages') + '</div>';
    const participants = messageParticipants(view ?? {});
    const contact = participants[selectedContactId];
    if (contact) {
        const blocked = isBlocked(view, contact.id, 'messages');
        const thread = threadMessages(messages, contact.id);
        const latestUserId = thread.filter(message => message.role === 'user').at(-1)?.id;
        return '<div class="pp-sms-thread"><div class="pp-sms-heading"><button type="button" class="pp-icon-button" data-sms-back aria-label="返回短信列表">' + icon('back') + '</button><div><strong>' + smsEscape(contact.name) + '</strong><small>' + smsEscape(contact.number || (contact.receivedSMS ? '短信发件人' : contact.sourceKind === 'persona' ? '人设中的亲友' : '已交换号码')) + '</small></div>' + renderBlockButton(view, contact.id, 'messages') + '</div>' +
            '<div class="pp-sms-bubbles" aria-live="polite">' + (thread.length ? thread.map(message => '<div class="pp-sms-item" data-role="' + (message.role === 'user' ? 'user' : 'assistant') + '"><p class="pp-sms-bubble">' + smsEscape(message.text) + '</p><small>' + smsTime(message.createdAt) + (message.role === 'user' ? ' · ' + replyLabels[message.replyStatus] : '') + '</small>' +
                (message.id === latestUserId && message.replyStatus === 'failed' ? '<button type="button" class="pp-text-button" data-sms-retry="' + smsEscape(message.id) + '"' + (busy || blocked ? ' disabled' : '') + '>重试回复</button>' : '') + '</div>').join('') : '<p class="pp-sms-empty-thread">发送第一条短信</p>') + '</div>' +
            (busy ? '<p class="pp-phone-progress" role="status">正在处理，请稍候…</p>' : '') + errorHTML +
            (blocked ? '<p class="pp-footnote">此人的短信已被拉黑，取消后才能继续交流。</p>' : '') +
            '<form data-sms-form class="pp-sms-compose"><label for="pp-sms-input">短信内容</label><textarea id="pp-sms-input" data-sms-draft rows="2" maxlength="6000" placeholder="短信…"' + (busy || blocked ? ' disabled' : '') + '>' + smsEscape(drafts[contact.id] || '') + '</textarea><button type="submit" aria-label="发送短信"' + (busy || blocked ? ' disabled' : '') + '>发送</button></form></div>';
    }
    let entries = Object.values(picking ? contacts : participants);
    if (picking) entries.sort((a, b) => a.name.localeCompare(b.name));
    else entries = entries.filter(item => threadMessages(messages, item.id).length).sort((a, b) => threadMessages(messages, b.id).at(-1).createdAt - threadMessages(messages, a.id).at(-1).createdAt);
    return '<div class="pp-sms-list"><div class="pp-phone-toolbar"><h2>' + (picking ? '选择联系人' : '短信') + '</h2><button type="button" class="pp-text-button" ' + (picking ? 'data-sms-back' : 'data-sms-new') + '>' + (picking ? '取消' : '新建短信') + '</button>' + (picking ? '<button type="button" class="pp-text-button" data-sms-sync' + (busy ? ' disabled' : '') + '>新增联系人</button>' : '') + (!picking ? '<button type="button" class="pp-text-button" data-sms-blocklist>黑名单</button>' : '') + '</div>' +
        (busy ? '<p class="pp-phone-progress" role="status">正在处理，请稍候…</p>' : '') + errorHTML + (contactStatus && picking ? '<p class="pp-contact-status" role="status">' + smsEscape(contactStatus) + '</p>' : '') +
        (entries.length ? entries.map(item => {
            const last = threadMessages(messages, item.id).at(-1);
            const unread = unreadMessages(messages, item.id);
            return '<button type="button" class="pp-sms-row" data-sms-contact="' + smsEscape(item.id) + '"><span class="pp-contact-avatar">' + icon('person') + '</span><span class="pp-sms-row-text"><strong>' + smsEscape(item.name) + '</strong><small>' + smsEscape(picking ? (item.number || (item.sourceKind === 'persona' ? '人设中的亲友' : '已交换号码')) : last.text) + '</small></span>' + (unread && !picking ? '<span class="pp-unread-count">' + unread + '</span>' : '') + icon('chevron') + '</button>';
        }).join('') : '<div class="pp-empty"><h2>' + (picking ? '暂无联系人' : '暂无短信') + '</h2><p>' + (picking ? '点击「新增联系人」，从可见正文和你的人设中查找。' : '点击「新建短信」，选择联系人开始交流。') + '</p></div>') +
        '</div>';
}

// Fictional Snapchat: all media/calls are text roleplay; no real social API,
// microphone, camera, geolocation, payment or media hosting is used.
const snapItems = (state, type) => Object.values(state.snapchat || {}).filter(item => item.type === type);
const snapProfile = (state, name = 'user') => state.snapchat?.profile || { id:'profile',type:'profile',alias:name,currency:'USD',location:'',sharing:false };
const snapExpired = (item, now = Date.now()) => now - item.createdAt >= 86400000;
const snapUnread = state => snapItems(state,'message').filter(m=>m.role==='assistant'&&!m.read).length + snapItems(state,'account').filter(a=>a.friend==='incoming').length;


const snapEsc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const snapKind = {text:'文字',voice:'语音',image:'照片',video:'视频'};
const snapMoney = item => item.currency + ' ' + (item.amountMinor / 100).toFixed(2);
const snapTime = item => new Date(item.createdAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});

function createSnapPanel({adapter,getView,redraw,notice}) {

    const empty=text=>'<p class="pp-snap-empty">'+text+'</p>';
    function accountsHTML(state) {
        const accounts=snapItems(state,'account');
        return form('search',field('query','姓名或账号（可留空）'),'新增联系人')+accounts.map(a=>{
            const unread=snapItems(state,'message').filter(m=>m.accountId===a.id&&m.role==='assistant'&&!m.read).length;
            const label=a.blocked?'已拉黑':({none:'尚未添加',incoming:'邀请你成为好友',pending:'等待通过',declined:'邀请未通过',friends:'好友'})[a.friend];
            return '<article class="pp-snap-card"><div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+' · '+label+(unread?' · '+unread+' 条未读':'')+'</small></div></div><div class="pp-snap-actions">'+
                (a.blocked?button('unblock','解除拉黑',a.id):a.friend==='friends'?button('thread','聊天',a.id):a.friend==='incoming'?button('accept','接受邀请',a.id)+button('decline','拒绝',a.id):button('invite',a.friend==='pending'?'查看邀请回应':'添加好友',a.id))+(!a.blocked?button('block','拉黑',a.id):'')+'</div></article>';
        }).join('')+(accounts.length?'':empty('还没有 Snapchat 联系人。点「新增联系人」查找账号。'));
    }
    function transferHTML(t) {
        return '<article class="pp-snap-cash"><strong>Snapcash · '+(t.direction==='incoming'?'对方转来':'你转出')+'</strong><b>'+snapMoney(t)+'</b><p>'+snapEsc(t.memo)+'</p><small>'+({pending:'待收款',accepted:'已收款 · 已记入资产流水',declined:'已拒收／取消'})[t.status]+'</small><div class="pp-snap-actions">'+(t.status==='pending'?button('settle',t.direction==='incoming'?'收款':'查看收款回应',t.id)+button('cancel',t.direction==='incoming'?'拒收':'取消转账',t.id):'')+'</div></article>';
    }
    function threadHTML(state,a) {
        const items=Object.values(state.snapchat||{}).filter(i=>i.accountId===a.id&&['message','call','transfer'].includes(i.type)).sort((a,b)=>a.createdAt-b.createdAt);
        const active=items.find(i=>i.type==='call'&&i.status==='connected');
        const chat=items.map(i=>{
            if(i.type==='transfer')return transferHTML(i);
            if(i.type==='call')return '<article class="pp-snap-card"><strong>'+snapKind[i.mode]+'通话 · '+({connected:'通话中',ended:'已结束',no_answer:'未接听'})[i.status]+'</strong>'+i.turns.map(t=>'<p class="pp-snap-copy"><b>'+(t.role==='user'?'你':snapEsc(a.name))+'：</b>'+snapEsc(t.text)+'</p>').join('')+'</article>';
            return '<article class="pp-snap-message '+(i.role==='user'?'is-user':'')+'"><small>'+(i.role==='user'?'你':snapEsc(a.name))+' · '+snapKind[i.kind]+' · '+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p>'+(['failed','pending'].includes(i.status)?button('retry','重试回复',i.id):i.status==='no_reply'?'<small>对方暂未回复</small>':'')+'</article>';
        }).join('');
        return button('list','‹ 聊天列表')+'<div class="pp-snap-person"><span class="pp-snap-avatar">'+snapEsc(a.name.slice(0,1))+'</span><div><strong>'+snapEsc(a.name)+'</strong><small>@'+snapEsc(a.handle)+' · '+(a.identityKnown?'知道你的真实身份':'以网名与你交流')+'</small></div></div><div class="pp-snap-actions">'+(!a.blocked?button('voice','语音通话',a.id)+button('video','视频通话',a.id)+button('cash','转账',a.id)+(a.identityKnown?'':button('reveal','告知真实身份',a.id))+button('block','拉黑',a.id):button('unblock','解除拉黑',a.id))+'</div><div class="pp-snap-thread">'+chat+'</div>'+
            (a.blocked?empty('已拉黑，不能发送消息或通话。'):page==='cash'?form('cash',field('amount','金额','','number')+field('currency','币种',profile().currency)+field('memo','附言'),'发送转账')+button('thread','返回聊天',a.id):active?form('call',textarea('call','通话内容（文字扮演）'),'说话')+button('hangup','挂断',active.id):form('message',select('kind',['text','voice','image','video'],'text')+textarea('message','消息／语音转写／媒体描述'),'发送'));
    }
    function postHTML(item) {
        return '<article class="pp-snap-card '+(item.type==='clip'?'pp-snap-clip':'')+'"><header><strong>'+snapEsc(item.name)+'</strong><small>'+snapKind[item.kind]+(item.type==='story'?' · <span data-snap-expiry="'+item.createdAt+'">'+(snapExpired(item)?'已过期 · 留存':'24 小时内')+'</span>':'')+'</small></header><div class="pp-snap-media"><span aria-hidden="true">'+(item.kind==='video'?'▷':'▧')+'</span><p class="pp-snap-copy">'+snapEsc(item.text)+'</p></div><div class="pp-snap-actions">'+button('like',item.liked?'♥ 已赞':'♡ 点赞',item.id)+button('comment','评论',item.id)+'</div>'+(item.comments||[]).map(c=>'<p class="pp-snap-copy"><b>'+snapEsc(c.name)+'：</b>'+snapEsc(c.text)+'</p>').join('')+(page==='comment:'+item.id?form('comment',textarea('comment','评论内容'),'发送评论'):'')+'</article>';
    }
    function feedsHTML(state) {
        if(tab==='stories')return form('story',select('storyKind',['image','video'],'image')+textarea('story','分享照片或视频的描述'),'发布故事')+button('refresh','刷新好友故事')+snapItems(state,'story').slice().reverse().filter(i=>i.author==='user'||!state.snapchat[i.author]?.blocked).map(postHTML).join('');
        if(tab==='spotlight')return button('refresh','加载短视频')+'<div class="pp-snap-clips">'+snapItems(state,'clip').slice().reverse().map(postHTML).join('')+'</div>'+empty('上下滑动浏览已加载内容，不调用 API。');
        const p=profile();const locations=snapItems(state,'location').filter(i=>!state.snapchat[i.author]?.blocked).slice().reverse();
        return button('refresh','刷新共享位置与动态')+'<div class="pp-snap-map"><strong>Snap Map</strong><p>朋友分享的位置 · 世界动态</p><div class="pp-snap-pins">'+(p.sharing&&p.location?'<span>⌖ 你 · '+snapEsc(p.location)+'</span>':'')+locations.slice(0,6).map(i=>'<span>⌖ '+snapEsc(i.name)+' · '+snapEsc(i.place)+'</span>').join('')+'</div></div>'+(!p.sharing?empty('你的位置未共享，可在「我的账号」开启。'):'')+locations.map(i=>'<article class="pp-snap-card"><strong>'+snapEsc(i.name)+' · '+snapEsc(i.place)+'</strong><small>'+snapTime(i)+'</small><p class="pp-snap-copy">'+snapEsc(i.text)+'</p></article>').join('');
    }
    function html() {
        const state=getView();if(accountId&&!state.snapchat?.[accountId]){accountId=null;page='';}
        const a=state.snapchat?.[accountId];const p=profile();
        let body=page==='profile'?button('list','‹ 返回')+form('profile',field('alias','网名',p.alias)+field('currency','默认币种',p.currency)+field('location','我分享的位置',p.location)+'<label class="pp-snap-check"><input name="sharing" data-snap-field="sharing" type="checkbox"'+(value('sharing',p.sharing)?' checked':'')+'>向好友共享此位置</label>','保存个人设置'):tab==='chat'?(a?threadHTML(state,a):accountsHTML(state)):feedsHTML(state);
        return '<div class="pp-snap"><header class="pp-snap-top"><b>Snapchat</b>'+button('profile','我的账号')+'</header><p class="pp-snap-status" role="status">'+snapEsc(state.busy?'正在处理…':state.errorKind==='snapchat'&&state.error?state.error:status)+'</p>'+body+'<nav class="pp-snap-tabs" aria-label="Snapchat 页面">'+[['chat','聊天'],['stories','故事'],['spotlight','聚光灯'],['map','地图']].map(([id,label])=>'<button type="button" data-snap-action="tab" data-snap-id="'+id+'" aria-pressed="'+(tab===id)+'">'+label+'</button>').join('')+'</nav></div>';
    }
    async function perform(method,args=[],message='') {
        if(!adapter.snapchat){notice('请在酒馆内使用 Snapchat。');return null;}
        if(posting||getView().busy)return null;
        posting=true;redraw();
        try {const result=await adapter.snapchat[method](...args);if(result?.ok){status=message;return result;}status=result?.error||'正在处理其他操作，请稍后重试。';return result;}
        catch(error){status=error.message;return null;}
        finally{posting=false;redraw();}
    }
    return {
        html,
        reset(){tab='chat';accountId=null;page='';drafts=Object.create(null);status='';},
        input(target){if(target.dataset.snapField)drafts[key(target.dataset.snapField)]=target.type==='checkbox'?target.checked:target.value;},
        async readVisible(){if(reading||posting||getView().busy||!accountId||page==='profile'||!adapter.snapchat)return;if(!snapItems(getView(),'message').some(m=>m.accountId===accountId&&m.role==='assistant'&&!m.read))return;reading=true;try{await adapter.snapchat.markRead(accountId);}finally{reading=false;}},
        async action(action,id) {
            if(action==='tab'){tab=id;accountId=null;page='';status='';redraw();return;}
            if(action==='profile'){page='profile';redraw();return;}
            if(action==='list'){accountId=null;page='';redraw();return;}
            if(action==='thread'){accountId=id;page='';redraw();return;}
            if(action==='cash'){page='cash';redraw();return;}
            if(action==='comment'){page='comment:'+id;redraw();return;}
            const handlers={invite:['invite',[id]],accept:['accept',[id,true]],decline:['accept',[id,false]],block:['block',[id,true]],unblock:['block',[id,false]],reveal:['reveal',[id]],voice:['call',[id,'voice']],video:['call',[id,'video']],hangup:['hangup',[id]],retry:['retryMessage',[id]],refresh:['refresh',[tab]],like:['like',[id]],settle:['settle',[id,true]],cancel:['settle',[id,false]]};
            if(handlers[action])await perform(...handlers[action]);
        },
        async submit(formElement) {
            const data=Object.fromEntries(new FormData(formElement));const formName=formElement.dataset.snapForm;
            const initialKey=key('');const draftKey=name=>initialKey+name;let result;
            if(formName==='search'){result=await perform('discover',[data.query]);if(result?.ok)status='搜索完成，新增 '+result.value.added+' 个账号。';}
            if(formName==='profile')result=await perform('saveProfile',[{...data,sharing:data.sharing==='on'}],'已保存个人设置');
            if(formName==='message'){
                const before=new Set(snapItems(getView(),'message').map(m=>m.id));
                result=await perform('send',[accountId,data.kind,data.message]);
                // Sent-but-failed messages have a retry button; do not send them twice.
                if(result?.ok||snapItems(getView(),'message').some(m=>!before.has(m.id)&&m.role==='user'))delete drafts[draftKey('message')];
            }
            if(formName==='story'){result=await perform('publish',[data.storyKind,data.story],'故事已发布');if(result?.ok)delete drafts[draftKey('story')];}
            if(formName==='comment'){result=await perform('comment',[page.slice(8),data.comment]);if(result?.ok){delete drafts[draftKey('comment')];page='';}}
            if(formName==='call'){const active=snapItems(getView(),'call').find(c=>c.accountId===accountId&&c.status==='connected');if(active){result=await perform('call',[accountId,active.mode,data.call,active.id]);if(result?.ok)delete drafts[draftKey('call')];}}
            if(formName==='cash'){
                result=await perform('transfer',[accountId,data.amount,data.currency,data.memo]);
                if(result?.ok){for(const name of ['amount','memo'])delete drafts[draftKey(name)];page='';await perform('settle',[result.value,true]);}
            }
            redraw();
        },
    };
}


const SECTIONS = [
    { id: 'appearance', name: '外观', icon: 'display', note: '主题、壁纸、字号与大小' },
    { id: 'api', name: 'API', icon: 'api', note: '模型连接' },
    { id: 'apps', name: 'App 管理', icon: 'apps', note: '选择桌面上显示的应用' },
    { id: 'prompts', name: '提示词', icon: 'prompts', note: '按功能分别编辑' },
    { id: 'contact', name: '主动联系', icon: 'phone', note: '允许角色主动联系' },
    { id: 'retry', name: '失败重试', icon: 'retry', note: '设置自动重试次数' },
];

function esc(value) {
    return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function mountPhone({ adapter, styles, container = document.body }) {
    let settings = normalizeSettings(adapter.load());
    let route = 'home';
    let history = [];
    let promptId = 'general';
    let phoneTab = 'history';
    let phoneView = { contacts: {}, calls: {}, busy: false, error: '' };
    let selectedCallId = null;
    let callDraft = '';
    let previousActiveCallId = null;
    let selectedSMSContactId = null;
    let pickingSMSContact = false;
    let smsDrafts = Object.create(null);
    let smsRenderKey = '';
    let opened = false;
    let lastFocused = null;
    let dragging = null;
    let suppressClickUntil = 0;
    let destroyed = false;
    let noticeTimeout;
    const lifetime = new AbortController();
    const host = document.createElement('div');
    host.id = 'personal-pocket-phone-root';
    // Keep the widget out of theme stacking/transform contexts when supported.
    // A manual popover is non-modal: the rest of SillyTavern remains usable.
    const topLayerAvailable = typeof host.showPopover === 'function';
    if (topLayerAvailable) host.setAttribute('popover', 'manual');
    const shadow = host.attachShadow({ mode: 'open' });
    const style = document.createElement('style');
    style.textContent = styles;
    shadow.append(style);
    const layer = document.createElement('div');
    layer.className = 'pp-layer';
    layer.style.setProperty('--pp-launcher-size', LAUNCHER_SIZE + 'px');
    layer.innerHTML = '<button type="button" class="pp-launcher" aria-label="打开榴莲手机" title="打开榴莲手机 · 拖动可移动" aria-expanded="false">' + icon('launcher') + '<span class="pp-launcher-badge" hidden></span></button>' +
        '<section class="pp-phone" role="dialog" aria-label="榴莲手机" hidden>' +
        '<div class="pp-topline"><span class="pp-status-time"></span><span class="pp-island"></span></div>' +
        '<header class="pp-header"><button type="button" data-action="back" class="pp-icon-button" aria-label="返回">' + icon('back') + '</button><span class="pp-title"></span><button type="button" data-action="close" class="pp-icon-button" aria-label="收起手机">' + icon('close') + '</button></header>' +
        '<main class="pp-content"></main><div class="pp-toast" role="status" aria-live="polite" hidden></div>' +
        '<footer class="pp-footer"><button type="button" data-action="home" aria-label="回到桌面"><span></span></button></footer></section>';
    shadow.append(layer);
    container.append(host);
    if (topLayerAvailable) {
        try { host.showPopover(); }
        catch { host.removeAttribute('popover'); }
    }
    const launcher = shadow.querySelector('.pp-launcher');
    const phone = shadow.querySelector('.pp-phone');
    const content = shadow.querySelector('.pp-content');
    const title = shadow.querySelector('.pp-title');
    const noticeElement = shadow.querySelector('.pp-toast');
    const apiPanel = createApiPanel({ adapter, getSettings: () => settings, persist, redraw: () => { if (!destroyed && route === 'api') renderAPI(); } });

    const snapPanel = createSnapPanel({adapter,getView:()=>phoneView,redraw:()=>{if(!destroyed&&opened&&route==='app:snapchat')renderSnapchat();},notice});

    function renderSnapchat() {
        const active=shadow.activeElement;const field=active?.dataset.snapField;
        const selection=field&&active.tagName==='TEXTAREA'?[active.selectionStart,active.selectionEnd]:null;
        const scroll=content.scrollTop;const clipsScroll=content.querySelector('.pp-snap-clips')?.scrollTop;
        content.innerHTML=snapPanel.html();content.scrollTop=scroll;
        const clips=content.querySelector('.pp-snap-clips');if(clips&&clipsScroll!=null)clips.scrollTop=clipsScroll;
        const next=field?Array.from(content.querySelectorAll('[data-snap-field]')).find(el=>el.dataset.snapField===field):null;
        if(next){next.focus({preventScroll:true});if(selection)next.setSelectionRange(...selection);}
        queueMicrotask(()=>{if(opened&&route==='app:snapchat')void snapPanel.readVisible();});
    }

    function notice(message) {
        noticeElement.textContent = message;
        noticeElement.hidden = false;
        clearTimeout(noticeTimeout);
        noticeTimeout = setTimeout(() => { noticeElement.hidden = true; }, 2600);
    }

    function persist(patch) {
        const previous = settings;
        settings = normalizeSettings({ ...settings, ...patch });
        try {
            adapter.save(settings);
        } catch (error) {
            settings = previous;
            applyAppearance();
            notice('设置保存失败，请检查储存空间后重试。');
            console.error('[榴莲手机] 无法保存设置', error);
            return false;
        }
        applyAppearance();
        adapter.onChange?.(settings);
        return true;
    }

    function applyAppearance() {
        layer.dataset.theme = settings.theme;
        layer.dataset.wallpaper = settings.wallpaper;
        layer.style.setProperty('--pp-font-size', settings.fontSize + 'px');
        layer.style.setProperty('--pp-phone-width', settings.phoneWidth + 'px');
        launcher.hidden = !settings.launcherVisible;
        const badge = launcher.querySelector('.pp-launcher-badge');
        badge.hidden = !settings.apps.phone || !unreadCalls();
    }

    function viewport() { return { width: window.innerWidth, height: window.innerHeight }; }

    function placeLauncher() {
        const view = viewport();
        const saved = settings.position;
        const point = clampPosition(saved ? { x: saved.x * (view.width - LAUNCHER_SIZE), y: saved.y * (view.height - LAUNCHER_SIZE) } : null, view);
        launcher.style.left = point.x + 'px';
        launcher.style.top = point.y + 'px';
    }

    function unreadCalls() { return Object.values(phoneView.calls || {}).filter(call => call.direction === 'incoming' && !call.read).length; }
    function appButton(app) {
        const unread = app.id === 'messages' ? unreadMessages(phoneView.messages) : app.id === 'phone' ? unreadCalls() : app.id === 'snapchat' ? snapUnread(phoneView) : 0;
        const badge = unread ? '<span class="pp-app-badge" aria-label="' + unread + (app.id === 'phone' ? ' 条待处理来电' : ' 条未读消息') + '">' + (unread > 99 ? '99+' : unread) + '</span>' : '';
        return '<button type="button" class="pp-app" data-app="' + app.id + '" aria-label="打开' + app.name + '"><span class="pp-app-icon pp-app-' + app.id + '" style="--app-color:' + app.color + '">' + icon(app.id) + badge + '</span><span class="pp-app-name">' + app.name + '</span></button>';
    }

    function renderHome() {
        const enabled = APPS.filter(app => settings.apps[app.id]);
        content.innerHTML = '<div class="pp-home"><div class="pp-home-clock"><div class="pp-date"></div><div class="pp-big-time"></div><span class="pp-time-label">设备时间</span></div>' +
            '<div class="pp-app-grid">' + enabled.filter(app => !app.dock).map(appButton).join('') + '</div>' +
            '<div class="pp-dock">' + enabled.filter(app => app.dock).map(appButton).join('') + appButton({ id: 'settings', name: '设置', color: '#778298' }) + '</div></div>';
        updateClock();
    }

    function renderSettings() {
        content.innerHTML = '<div class="pp-page"><div class="pp-page-lead">按你的习惯设置手机</div><div class="pp-card">' +
            SECTIONS.map(section => '<button type="button" class="pp-setting-row" data-section="' + section.id + '"><span class="pp-section-icon">' + icon(section.icon) + '</span><span><strong>' + section.name + '</strong><small>' + section.note + '</small></span><span class="pp-row-chevron">' + icon('chevron') + '</span></button>').join('') +
            '</div><p class="pp-footnote">榴莲手机 ' + VERSION + ' · 开发测试版</p></div>';
    }

    function selectField(id, label, entries, selected) {
        return '<label class="pp-field"><span>' + label + '</span><select data-setting="' + id + '">' + entries.map(([value, text]) => '<option value="' + value + '"' + (selected === value ? ' selected' : '') + '>' + text + '</option>').join('') + '</select></label>';
    }

    function renderAppearance() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card pp-form">' +
            selectField('theme', '主题', [['dark', '深色'], ['light', '浅色']], settings.theme) +
            '<div class="pp-field pp-wallpaper-field"><span>壁纸</span><div class="pp-swatches">' + [['violet', '暮紫'], ['ocean', '海蓝'], ['sand', '暖砂'], ['graphite', '石墨']].map(([value, name]) => '<button type="button" class="pp-swatch" data-wallpaper="' + value + '" aria-label="' + name + '壁纸" aria-pressed="' + (settings.wallpaper === value) + '"><span></span><small>' + name + '</small></button>').join('') + '</div></div>' +
            '<label class="pp-field"><span>字号 <output data-output="fontSize">' + settings.fontSize + '</output></span><input type="range" min="14" max="20" step="1" data-setting="fontSize" value="' + settings.fontSize + '"></label>' +
            '<label class="pp-field"><span>窗口宽度 <output data-output="phoneWidth">' + settings.phoneWidth + '</output></span><input type="range" min="300" max="420" step="10" data-setting="phoneWidth" value="' + settings.phoneWidth + '"></label></div><p class="pp-footnote">小屏幕会自动适配可用宽度。</p></div>';
    }

    function renderAPI() { content.innerHTML = apiPanel.html(); }

    function renderApps() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card">' + APPS.map(app => '<label class="pp-toggle-row"><span class="pp-small-app pp-app-' + app.id + '" style="--app-color:' + app.color + '">' + icon(app.id) + '</span><span>' + app.name + '</span><input type="checkbox" role="switch" data-enabled="' + app.id + '"' + (settings.apps[app.id] ? ' checked' : '') + ' aria-label="启用' + app.name + '"><span class="pp-switch" aria-hidden="true"></span></label>').join('') + '</div><p class="pp-footnote">关闭后从桌面隐藏，已有内容保留。设置始终可用。</p></div>';
    }

    function renderPrompts() {
        content.innerHTML = '<div class="pp-page"><label class="pp-field pp-prompt-select"><span>功能</span><select data-prompt-selector>' + Object.entries(PROMPTS).map(([id, prompt]) => '<option value="' + id + '"' + (id === promptId ? ' selected' : '') + '>' + prompt.name + '</option>').join('') + '</select></label>' +
            '<label class="pp-editor-label" for="pp-prompt-editor">提示词内容</label><textarea id="pp-prompt-editor" class="pp-editor" data-prompt-editor spellcheck="false" maxlength="30000"></textarea><div class="pp-editor-footer"><span class="pp-save-status" aria-live="polite">修改后自动保存</span><button type="button" class="pp-text-button" data-action="reset-prompt">恢复此项默认</button></div><p class="pp-footnote">内容语言以酒馆预设为准。联系方式识别、电话、主动来电、主动短信、短信、Snapchat 和正文衔接提示词现已生效；其余用于后续功能。</p></div>';
        content.querySelector('[data-prompt-editor]').value = settings.prompts[promptId];
    }

    function renderContactSettings() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card pp-form">' +
            selectField('proactiveEnabled', '允许主动联系', [['true', '开启'], ['false', '关闭']], String(settings.proactiveEnabled)) + '</div></div>';
    }

    function renderRetry() {
        content.innerHTML = '<div class="pp-page"><div class="pp-card pp-form"><label class="pp-field"><span>失败后自动重试次数</span><input class="pp-number" type="number" inputmode="numeric" min="0" max="15" step="1" data-setting="retries" value="' + settings.retries + '" aria-describedby="pp-retry-help"></label></div><p id="pp-retry-help" class="pp-footnote">填写 0—15 的整数。0 表示不自动重试；次数不包含首次请求，成功后立即停止。</p><p class="pp-footnote">此设置用于联系人识别、来电判断、电话和短信回应的请求失败重试。</p></div>';
    }

    function renderPhone() {
        const input = shadow.querySelector('[data-phone-draft]');
        const focused = input && shadow.activeElement === input;
        const selection = input ? [input.selectionStart, input.selectionEnd] : null;
        const scroll = content.scrollTop;
        content.innerHTML = renderPhoneScreen(phoneView, phoneTab, selectedCallId, callDraft);
        content.scrollTop = scroll;
        const next = shadow.querySelector('[data-phone-draft]');
        if (focused && next) { next.focus({ preventScroll: true }); next.setSelectionRange(...selection); }
        if (Object.values(phoneView.calls || {}).some(call => call.direction === 'incoming' && !call.read && ['ended', 'declined', 'missed', 'interrupted'].includes(call.status))) phoneAction(() => adapter.phone.markCallsRead());
    }
    function renderMessages() {
        const input = shadow.querySelector('[data-sms-draft]');
        const focused = input && shadow.activeElement === input;
        const selection = input ? [input.selectionStart, input.selectionEnd] : null;
        const scroll = content.scrollTop;
        const count = Object.values(phoneView.messages || {}).filter(item => item.contactId === selectedSMSContactId).length;
        const key = selectedSMSContactId + ':' + count;
        content.innerHTML = renderMessagesScreen(phoneView, selectedSMSContactId, pickingSMSContact, smsDrafts);
        content.scrollTop = key === smsRenderKey ? scroll : content.scrollHeight;
        smsRenderKey = key;
        const next = shadow.querySelector('[data-sms-draft]');
        if (focused && next && !next.disabled) { next.focus({ preventScroll: true }); next.setSelectionRange(...selection); }
        if (opened && selectedSMSContactId && unreadMessages(phoneView.messages, selectedSMSContactId)) {
            phoneAction(() => adapter.phone.markMessagesRead(selectedSMSContactId));
        }
    }
    function phoneAction(action) {
        if (!adapter.phone) { notice('请在酒馆中连接 API 后使用通信功能。'); return; }
        Promise.resolve().then(action).catch(error => notice(error.message));
    }

    function renderEmptyApp(id) {
        const app = APPS.find(item => item.id === id);
        const words = {
            phone: phoneTab === 'contacts' ? ['暂无联系人', '点击「新增联系人」后查找可见正文和人设中的电话联系人。'] : ['暂无通话记录', '电话功能将在下一阶段接入。'],
            messages: ['暂无短信', '短信功能将在后续阶段接入。'],
            snapchat: ['Snapchat', '好友邀请、私聊与 Stories 将在后续阶段接入。'],
            x: ['X', '个人主页、搜索与动态将在后续阶段接入。'],
            amazon: ['Amazon', '商品与虚拟订单将在后续阶段接入。'],
        };
        const [heading, detail] = words[id];
        content.innerHTML = '<div class="pp-empty-app"><div class="pp-empty"><span class="pp-empty-icon">' + icon(id === 'phone' && phoneTab === 'contacts' ? 'person' : app.id) + '</span><h2>' + heading + '</h2><p>' + detail + '</p><span class="pp-stage-label">页面预留</span></div>' +
            (id === 'phone' ? '<nav class="pp-phone-tabs" aria-label="电话页面"><button type="button" data-phone-tab="history" aria-pressed="' + (phoneTab === 'history') + '">' + icon('phone') + '<span>电话</span></button><button type="button" data-phone-tab="contacts" aria-pressed="' + (phoneTab === 'contacts') + '">' + icon('person') + '<span>联系人</span></button></nav>' : '') + '</div>';
    }

    function render() {
        if (destroyed) return;
        phone.dataset.home = String(route === 'home');
        shadow.querySelector('[data-action="back"]').hidden = route === 'home';
        const app = APPS.find(item => route === 'app:' + item.id);
        title.textContent = route === 'home' ? '' : route === 'settings' ? '设置' : app ? app.name : SECTIONS.find(section => section.id === route)?.name || '';
        if (route === 'home') renderHome();
        else if (route === 'settings') renderSettings();
        else if (route === 'appearance') renderAppearance();
        else if (route === 'api') renderAPI();
        else if (route === 'apps') renderApps();
        else if (route === 'prompts') renderPrompts();
        else if (route === 'contact') renderContactSettings();
        else if (route === 'retry') renderRetry();
        else if (app?.id === 'phone') renderPhone();
        else if (app?.id === 'messages') renderMessages();
        else if (app?.id === 'snapchat') renderSnapchat();
        else if (app) renderEmptyApp(app.id);
        content.scrollTop = route === 'app:messages' && selectedSMSContactId ? content.scrollHeight : 0;
    }

    function navigate(next) {
        if (next === route) return;
        history.push(route);
        route = next;
        render();
        shadow.querySelector('[data-action="back"]').focus({ preventScroll: true });
        if (next === 'app:phone') phoneAction(() => adapter.phone.open());
        if (next === 'app:messages') phoneAction(() => adapter.phone.openMessages());
        if (next === 'app:snapchat' && adapter.snapchat) phoneAction(() => adapter.snapchat.open());
    }

    function open() {
        if (opened) return;
        lastFocused = document.activeElement;
        opened = true;
        const incoming = phoneView.calls?.[phoneView.activeCallId];
        if (settings.apps.phone && incoming?.status === 'ringing') { route = 'app:phone'; history = ['home']; selectedCallId = incoming.id; }
        phone.hidden = false;
        if(windowPosition){const point={...windowPosition};phone.style.height='';phone.style.bottom='';phone.style.top='';movePhone(point.x,point.y);}
        launcher.setAttribute('aria-expanded', 'true');
        launcher.setAttribute('aria-label', '收起榴莲手机');
        render();
        shadow.querySelector('[data-action="close"]').focus({ preventScroll: true });
    }

    function close() {
        opened = false;
        phone.hidden = true;
        launcher.setAttribute('aria-expanded', 'false');
        launcher.setAttribute('aria-label', '打开榴莲手机');
        if (settings.launcherVisible) launcher.focus({ preventScroll: true });
        else if (lastFocused?.isConnected && lastFocused !== host) lastFocused.focus?.({ preventScroll: true });
    }

    function updateClock() {
        if (!opened) return;
        for(const el of content.querySelectorAll('[data-snap-expiry]'))el.textContent=Date.now()-Number(el.dataset.snapExpiry)>=86400000?'已过期 · 留存':'24 小时内';
        const now = new Date();
        const time = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
        shadow.querySelector('.pp-status-time').textContent = time;
        const clock = content.querySelector('.pp-big-time');
        if (clock) clock.textContent = time;
        const date = content.querySelector('.pp-date');
        if (date) date.textContent = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }).format(now);
    }

    shadow.addEventListener('click', event => {
        const target = event.target.closest('button');
        if (!target) return;
        if (target.dataset.snapAction) { void snapPanel.action(target.dataset.snapAction,target.dataset.snapId); return; }
        if (target.dataset.apiAction) { void apiPanel.action(target.dataset.apiAction); return; }
        const action = target.dataset.action;
        if (action === 'close') close();
        if (action === 'home') { route = 'home'; history = []; render(); }
        if (action === 'back') { route = history.pop() || 'home'; render(); }
        if (target.dataset.app) navigate(target.dataset.app === 'settings' ? 'settings' : 'app:' + target.dataset.app);
        if (target.dataset.section) navigate(target.dataset.section);
        if (target.dataset.wallpaper && persist({ wallpaper: target.dataset.wallpaper })) {
            shadow.querySelectorAll('[data-wallpaper]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.wallpaper === settings.wallpaper)));
        }
        if (target.dataset.phoneTab) { phoneTab = target.dataset.phoneTab; selectedCallId = null; renderPhone(); }
        if (target.hasAttribute('data-phone-sync')) phoneAction(() => adapter.phone.scan());
        if (target.dataset.phoneDial) phoneAction(() => adapter.phone.dial(target.dataset.phoneDial));
        if (target.dataset.phoneRecord) { selectedCallId = target.dataset.phoneRecord; callDraft = ''; renderPhone(); }
        if (target.hasAttribute('data-phone-list')) { selectedCallId = null; phoneTab = 'history'; renderPhone(); }
        if (target.hasAttribute('data-phone-hangup')) phoneAction(async () => { await adapter.phone.hangup(); selectedCallId = phoneView.activeCallId; phoneTab = 'history'; callDraft = ''; renderPhone(); });
        if (target.hasAttribute('data-phone-answer')) phoneAction(() => adapter.phone.answer());
        if (target.hasAttribute('data-phone-decline')) phoneAction(() => adapter.phone.decline());
        if (target.hasAttribute('data-phone-check-incoming')) phoneAction(() => adapter.phone.checkIncoming());
        if (target.hasAttribute('data-phone-retry')) phoneAction(() => adapter.phone.retry());
        if (target.hasAttribute('data-sms-new')) { pickingSMSContact = true; selectedSMSContactId = null; renderMessages(); }
        if (target.hasAttribute('data-sms-back')) { pickingSMSContact = false; selectedSMSContactId = null; renderMessages(); }
        if (target.hasAttribute('data-sms-blocklist')) { pickingSMSContact = 'blocked'; selectedSMSContactId = null; renderMessages(); }
        if (target.dataset.blockId) phoneAction(() => adapter.phone.setBlocked(target.dataset.blockId, target.dataset.blockChannel, target.dataset.blockValue === 'true'));
        if (target.dataset.smsContact) { selectedSMSContactId = target.dataset.smsContact; pickingSMSContact = false; renderMessages(); }
        if (target.hasAttribute('data-sms-sync')) phoneAction(() => adapter.phone.scan());
        if (target.dataset.smsRetry) phoneAction(() => adapter.phone.retryMessage(target.dataset.smsRetry));
        if (action === 'reset-prompt' && persist({ prompts: { ...settings.prompts, [promptId]: PROMPTS[promptId].text } })) { renderPrompts(); notice('已恢复此项默认提示词'); }
    }, { signal: lifetime.signal });

    shadow.addEventListener('submit', event => {
        if(event.target.dataset.snapForm){event.preventDefault();void snapPanel.submit(event.target);return;}
        if (event.target.hasAttribute('data-sms-form')) {
            event.preventDefault();
            const contactId = selectedSMSContactId;
            const draft = smsDrafts[contactId] || '';
            if (draft.trim()) phoneAction(async () => {
                const result = await adapter.phone.sendMessage(contactId, draft);
                if (result?.value?.saved && smsDrafts[contactId] === draft) delete smsDrafts[contactId];
                if (opened && route === 'app:messages') renderMessages();
            });
            return;
        }
        if (!event.target.hasAttribute('data-phone-form')) return;
        event.preventDefault();
        const text = callDraft.trim();
        if (text) phoneAction(async () => { callDraft = ''; await adapter.phone.say(text); });
    }, { signal: lifetime.signal });

    shadow.addEventListener('change', event => {
        const target = event.target;
        if(target.dataset.snapField){snapPanel.input(target);return;}
        if (target.dataset.apiField && target.tagName === 'SELECT') { apiPanel.input(target.dataset.apiField, target.value); return; }
        if (target.dataset.enabled) persist({ apps: { ...settings.apps, [target.dataset.enabled]: target.checked } });
        if (target.hasAttribute('data-prompt-selector')) { promptId = target.value; renderPrompts(); }
        if (target.dataset.setting) {
            const key = target.dataset.setting;
            let value = target.value;
            if (['fontSize', 'phoneWidth', 'retries'].includes(key)) {
                value = Number(value);
                if (target.value.trim() === '' || !Number.isInteger(value) || !target.checkValidity()) {
                    target.value = settings[key];
                    notice(key === 'retries' ? '请填写 0—15 的整数' : '请填写有效数值');
                    return;
                }
            }
            if (['proactiveEnabled'].includes(key)) value = value === 'true';
            if (persist({ [key]: value })) {
                const output = shadow.querySelector('[data-output="' + key + '"]');
                if (output) output.textContent = settings[key];
            }
        }
    }, { signal: lifetime.signal });

const PREVIEW_KEY = 'pocket_phone_preview_v010';
let storageAvailable = true;
let memory = {};
try { localStorage.setItem(PREVIEW_KEY + '_probe', '1'); localStorage.removeItem(PREVIEW_KEY + '_probe'); }
catch { storageAvailable = false; document.getElementById('storage-note').hidden = false; }
const adapter = {
    load() { try { return storageAvailable ? JSON.parse(localStorage.getItem(PREVIEW_KEY) || '{}') : memory; } catch { return {}; } },
    save(settings) { if (storageAvailable) localStorage.setItem(PREVIEW_KEY, JSON.stringify(settings)); else memory = settings; },
    connectionName() { return '离线预览中不连接模型。'; },
    onChange(settings) { document.getElementById('preview-visibility').checked = settings.launcherVisible; },
};
const controller = mountPhone({ adapter, styles: PREVIEW_STYLES });
document.getElementById('preview-visibility').checked = controller.getSettings().launcherVisible;
document.getElementById('preview-visibility').addEventListener('change', event => controller.setLauncherVisible(event.target.checked));
document.getElementById('preview-open').addEventListener('click', () => controller.open());
document.getElementById('preview-settings').addEventListener('click', () => controller.openSettings());
document.getElementById('preview-reset').addEventListener('click', () => controller.resetPosition());
controller.open();
